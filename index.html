<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="진실한숲교회 2026년 10월 설교 시리즈 「말의 구원 — 깊은 샘에서 흘러나오는 말」 4주 워크북">
<meta name="theme-color" content="#F3ECDB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1B28" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="말의 구원">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>말의 구원 — 깊은 샘에서 흘러나오는 말</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/DeepspringSans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/GowunBatang-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Gowun Batang";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/GowunBatang-400.woff2") format("woff2");}
@font-face{font-family:"Gowun Batang";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/GowunBatang-700.woff2") format("woff2");}
@font-face{font-family:"Deepspring Sans";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/DeepspringSans-400.woff2") format("woff2");}
@font-face{font-family:"Deepspring Sans";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/DeepspringSans-600.woff2") format("woff2");}
:root{
  --paper:#F3ECDB; --sheet:#FBF7EC; --ink:#1C2942; --ink-soft:#4A5670; --muted:#7A8194;
  --ochre:#9C6A1E; --ochre-soft:#E9D9B8; --teal:#1E7068; --teal-soft:#D5E7E3; --teal-ink:#FFFFFF;
  --line:#DDD2BA; --deep:#16405C; --deep-2:#0C2436; --warn:#8A3B2E; --warn-soft:#F2DCD5;
  --serif:"Gowun Batang","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --sans:"Deepspring Sans","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --base:17px; --r-s:10px; --r-m:14px; --r-l:22px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1B28; --sheet:#152536; --ink:#ECE4D2; --ink-soft:#C3BCAC; --muted:#8C93A3;
    --ochre:#D6A452; --ochre-soft:#3A3122; --teal:#56B3A7; --teal-soft:#1B3A3A; --teal-ink:#0F1B28;
    --line:#2A3B4E; --deep:#0E3048; --deep-2:#071826; --warn:#E39A88; --warn-soft:#3A2420;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1B28; --sheet:#152536; --ink:#ECE4D2; --ink-soft:#C3BCAC; --muted:#8C93A3;
  --ochre:#D6A452; --ochre-soft:#3A3122; --teal:#56B3A7; --teal-soft:#1B3A3A; --teal-ink:#0F1B28;
  --line:#2A3B4E; --deep:#0E3048; --deep-2:#071826; --warn:#E39A88; --warn-soft:#3A2420;
  color-scheme: dark;
}
:root[data-size="l"]{ --base:20px; }

*{box-sizing:border-box}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); background:var(--paper); }
body{ margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:var(--base); line-height:1.65; -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:anywhere; }
img{ max-width:100%; }
button,input,textarea,select{ font:inherit; color:inherit; }
a{ color:var(--teal); }
:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; border-radius:6px; }

/* ---------- 골격 ---------- */
#app{ max-width:600px; margin:0 auto; min-height:100vh; padding:0 20px 168px; }
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--paper); margin:0 -20px; padding:12px 20px 10px; display:flex; align-items:center; gap:12px; border-bottom:1px solid transparent; }
.topbar.scrolled{ border-bottom-color:var(--line); }
.topbar .back{ border:0; background:none; padding:6px 8px 6px 0; font-size:1.05em; color:var(--ink-soft); cursor:pointer; min-height:44px; }
.topbar h1{ font-family:var(--serif); font-weight:700; font-size:1.08em; margin:0; flex:1; min-width:0; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar .sub{ white-space:nowrap; }
.topbar .sub{ font-size:.78em; color:var(--muted); }

.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--sheet); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
.tabbar .in{ max-width:600px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); }
.tabbar button{ border:0; background:none; padding:10px 4px 12px; font-size:.78em; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; min-height:58px; }
.tabbar button svg{ width:24px; height:24px; }
.tabbar button[aria-current="page"]{ color:var(--ink); font-weight:600; }
.tabbar button[aria-current="page"] svg{ color:var(--teal); }

.fab{ position:fixed; z-index:31; right:max(16px, calc(50% - 300px + 16px)); bottom:calc(76px + env(safe-area-inset-bottom,0px)); background:var(--teal); color:var(--teal-ink); border:0; border-radius:999px; padding:13px 20px 13px 16px; font-weight:600; font-size:.92em; display:flex; align-items:center; gap:8px; box-shadow:0 6px 18px rgba(12,36,54,.22); cursor:pointer; min-height:48px; }
.fab svg{ width:20px; height:20px; }

/* ---------- 글자 ---------- */
.serif{ font-family:var(--serif); }
.h-hero{ font-family:var(--serif); font-size:1.9em; line-height:1.35; letter-spacing:-.02em; margin:.2em 0 .5em; font-weight:700; }
.h2{ font-family:var(--serif); font-size:1.32em; line-height:1.4; margin:1.6em 0 .5em; font-weight:700; letter-spacing:-.01em; }
.h3{ font-size:1.02em; font-weight:600; margin:1.3em 0 .4em; }
.lead{ color:var(--ink-soft); }
.small{ font-size:.85em; color:var(--muted); }
p{ margin:.55em 0; }
.note{ font-size:.86em; color:var(--muted); margin-top:.6em; }

/* ---------- 말씀 ---------- */
.scripture{ margin:1.1em 0 1.3em; padding:.1em 0 .1em 16px; border-left:2px solid var(--ochre); font-family:var(--serif); font-size:1.06em; line-height:1.95; }
.scripture .ref{ display:block; font-family:var(--sans); font-size:.78em; color:var(--ochre); margin-bottom:.35em; font-weight:600; }
.scripture .v{ display:inline; }
.scripture .vn{ font-family:var(--sans); font-size:.68em; color:var(--ochre); font-weight:700; vertical-align:.25em; margin:0 .25em 0 .1em; }
.scripture b, .quote b{ font-weight:700; color:var(--ink); }
.scripture .var{ color:var(--muted); font-size:.9em; }
.gloss{ font-size:.84em; color:var(--muted); margin:-.6em 0 1em 18px; }
.quote{ font-family:var(--serif); font-size:1.08em; line-height:1.9; margin:1em 0; padding:0 0 0 16px; border-left:2px solid var(--ochre-soft); }
.quote .ref{ display:block; font-family:var(--sans); font-size:.78em; color:var(--ochre); margin-top:.3em; }
.speaker{ font-size:.8em; color:var(--ochre); font-weight:600; margin-bottom:.2em; }

/* ---------- 홈 ---------- */
.home-hero{ padding:18px 0 6px; }
.home-hero .week{ font-size:.86em; color:var(--muted); }
.home-hero .q{ font-family:var(--serif); font-size:1.62em; line-height:1.4; font-weight:700; margin:.25em 0 .7em; letter-spacing:-.02em; }
.today{ background:var(--sheet); border-radius:var(--r-l); padding:20px 20px 18px; border:1px solid var(--line); }
.today .day{ font-size:.85em; color:var(--teal); font-weight:600; }
.today .title{ font-family:var(--serif); font-size:1.28em; font-weight:700; margin:.15em 0 .6em; }
.today .line{ font-family:var(--serif); color:var(--ink-soft); font-size:1.02em; line-height:1.8; margin:0 0 1em; }
.strip{ display:flex; gap:8px; margin:18px 0 6px; }
.strip button{ flex:1; aspect-ratio:1/1.15; border-radius:var(--r-m); border:1px solid var(--line); background:transparent; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:.78em; color:var(--muted); min-height:52px; }
.strip button b{ font-size:1.25em; color:var(--ink); font-family:var(--serif); }
.strip button.done{ background:var(--teal-soft); border-color:transparent; }
.strip button.now{ border:2px solid var(--teal); }
.strip button.group{ flex:1.2; }

.wells{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin:10px 0; }
.wells span{ aspect-ratio:1; border-radius:50%; border:1.5px solid var(--line); display:block; position:relative; overflow:hidden; }
.wells span.full{ border-color:var(--deep); background:radial-gradient(circle at 50% 70%, #3F7EA3 0%, var(--deep) 70%); }
.wells span.locked{ opacity:.45; }
.wells-row{ display:flex; align-items:center; gap:10px; }
.wells-row .lbl{ width:34px; font-size:.78em; color:var(--muted); }

/* ---------- 버튼 ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; border:1.5px solid var(--teal); background:transparent; color:var(--teal); padding:12px 18px; font-weight:600; cursor:pointer; min-height:48px; text-decoration:none; }
.btn.primary{ background:var(--teal); color:var(--teal-ink); }
.btn.block{ width:100%; }
.btn.ghost{ border-color:transparent; padding-left:6px; padding-right:6px; }
.btn.warn{ border-color:var(--warn); color:var(--warn); }
.btn svg{ width:20px; height:20px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.row .btn{ flex:1; }

/* ---------- 오늘의 순서(날) ---------- */
.stepper{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 62px); z-index:15; background:var(--paper); margin:0 -20px; padding:6px 20px 10px; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.stepper a{ text-decoration:none; color:var(--muted); font-size:.78em; text-align:center; padding:8px 2px 6px; border-radius:10px; border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:2px; min-height:48px; justify-content:center; }
.stepper a .n{ font-family:var(--serif); font-weight:700; font-size:1.2em; color:var(--ink-soft); }
.stepper a.done{ background:var(--teal-soft); border-color:transparent; color:var(--ink); }
.stepper a.done .n{ color:var(--teal); }
.layer{ padding:8px 0 22px; border-bottom:1px solid var(--line); scroll-margin-top:130px; }
.layer:last-of-type{ border-bottom:0; }
.layer > .lh{ display:flex; align-items:baseline; gap:10px; margin:22px 0 4px; }
.layer > .lh .n{ font-family:var(--serif); font-size:1.5em; color:var(--teal); font-weight:700; line-height:1; }
.layer > .lh h2{ font-family:var(--serif); font-size:1.28em; margin:0; font-weight:700; }
.layer > .lh .min{ margin-left:auto; font-size:.8em; color:var(--muted); }
.donebar{ margin-top:22px; display:flex; gap:10px; justify-content:flex-end; }
.donebar .btn.primary{ flex:1; }
.flowbar{ margin:4px 0 18px; }
.flowbar .fb-n{ font-size:.8em; color:var(--muted); margin-bottom:6px; }
.fb-steps{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.fb-steps .fs{ font-size:.82em; text-align:center; padding:8px 4px; border-radius:var(--r-s); background:var(--sheet); border:1px solid var(--line); color:var(--muted); }
.fb-steps .fs.done{ color:var(--teal); border-color:var(--teal-soft); }
.fb-steps .fs.now{ background:var(--teal); color:var(--teal-ink); border-color:var(--teal); font-weight:700; }
.dayflow .layer{ display:none; }
.dayflow[data-cur="1"] #L1, .dayflow[data-cur="2"] #L2, .dayflow[data-cur="3"] #L3, .dayflow[data-cur="4"] #L4{ display:block; }
#lg-type{ display:grid; gap:8px; }
#lg-type .opt .tx{ font-weight:700; }
.donebar .btn{ min-width:150px; }
.donebar .btn.is-done{ background:var(--teal-soft); border-color:transparent; color:var(--ink); }

/* ---------- 입력 ---------- */
.field{ margin:14px 0; }
.field label, .field .lbl{ display:block; font-weight:600; font-size:.95em; margin-bottom:6px; }
.field .hint{ font-size:.83em; color:var(--muted); margin:-2px 0 6px; }
.field input[type=text], .field textarea, .field select{ width:100%; border:1.5px solid var(--line); background:var(--sheet); border-radius:var(--r-s); padding:12px 14px; min-height:48px; }
.field textarea{ min-height:88px; resize:vertical; line-height:1.6; }
.field input:focus, .field textarea:focus{ border-color:var(--teal); outline:none; }
.range{ display:flex; align-items:center; gap:12px; }
.range input[type=range]{ flex:1; accent-color:var(--teal); height:32px; }
.range output{ min-width:2.6em; text-align:right; font-family:var(--serif); font-weight:700; font-size:1.2em; color:var(--teal); }
.range-ends{ display:flex; justify-content:space-between; font-size:.78em; color:var(--muted); margin-top:-2px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ border:1.5px solid var(--line); background:var(--sheet); border-radius:999px; padding:9px 14px; cursor:pointer; min-height:44px; font-size:.93em; }
.chip[aria-pressed="true"]{ border-color:var(--teal); background:var(--teal-soft); color:var(--ink); font-weight:600; }
.seg{ display:grid; grid-template-columns:repeat(3,1fr); border:1.5px solid var(--line); border-radius:12px; overflow:hidden; }
.seg button{ border:0; background:var(--sheet); padding:10px 4px; cursor:pointer; font-size:.86em; min-height:44px; color:var(--ink-soft); }
.seg button + button{ border-left:1.5px solid var(--line); }
.seg button[aria-pressed="true"]{ background:var(--teal); color:var(--teal-ink); font-weight:600; }

.phrase{ padding:14px 0; border-bottom:1px solid var(--line); }
.phrase .t{ font-family:var(--serif); font-size:1.08em; margin-bottom:8px; }

/* ---------- 도구 패널 · 카드 ---------- */
.panel{ border:1.5px solid var(--teal); border-radius:var(--r-m); padding:16px 16px 12px; margin:16px 0; background:transparent; }
.panel.soft{ border-color:var(--line); background:var(--sheet); }
.panel.warn{ border-color:var(--warn); background:var(--warn-soft); }
.panel > .ph{ font-weight:700; margin:0 0 6px; }
.privacy{ font-size:.86em; color:var(--ink-soft); background:var(--sheet); border-radius:var(--r-s); padding:10px 14px; margin:12px 0; border:1px dashed var(--line); }
.stop{ font-size:.86em; color:var(--muted); margin:18px 0 0; padding-top:12px; border-top:1px dashed var(--line); }
.stop a{ color:var(--muted); }

.voice{ border-top:1px solid var(--line); padding:16px 0; }
.voice summary{ cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; min-height:44px; }
.voice summary::-webkit-details-marker{ display:none; }
.voice summary .nm{ font-family:var(--serif); font-weight:700; font-size:1.15em; }
.voice summary .mine{ margin-left:auto; font-size:.78em; color:var(--teal); font-weight:600; }
.voice dl{ margin:10px 0 0; display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:.93em; }
.voice dt{ color:var(--muted); }
.voice dd{ margin:0; }
.voice .answer{ margin-top:12px; }

.bars{ margin:14px 0 6px; }
.bar{ display:grid; grid-template-columns:7.2em 1fr; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
.bar .nm{ font-size:.9em; font-weight:600; }
.bar .tr{ display:grid; gap:5px; }
.bar .tk{ height:10px; border-radius:6px; background:var(--line); position:relative; overflow:hidden; }
.bar .tk i{ position:absolute; inset:0 auto 0 0; border-radius:6px; }
.bar .tk.out i{ background:var(--ochre); }
.bar .tk.in i{ background:var(--teal); }
.bar.top .nm{ color:var(--teal); }
.legend{ display:flex; gap:16px; font-size:.8em; color:var(--muted); margin-top:6px; }
.legend i{ display:inline-block; width:12px; height:10px; border-radius:4px; margin-right:6px; vertical-align:-1px; }

.pairlist{ margin:10px 0; }
.pair{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); font-size:.93em; }
.pair .said{ font-family:var(--serif); }
.pair .voice-t{ color:var(--ink-soft); }
.pair .meta{ grid-column:1/-1; font-size:.78em; color:var(--muted); }
.pair .new-t{ grid-column:1/-1; font-family:var(--serif); color:var(--teal); border-left:3px solid var(--teal-soft); padding-left:10px; }
.empty{ color:var(--muted); font-size:.92em; padding:18px 0; text-align:left; }

.cmp{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0; }
.cmp .c{ border:1px solid var(--line); border-radius:var(--r-m); padding:12px; }
.cmp .c .k{ font-size:.8em; color:var(--muted); }
.cmp .c .v{ font-family:var(--serif); font-size:1.6em; font-weight:700; }

.line-chart{ width:100%; height:150px; }

/* ---------- 마법사(4일차) ---------- */
.wiz-steps{ display:flex; gap:5px; margin:12px 0 4px; }
.wiz-steps i{ flex:1; height:5px; border-radius:4px; background:var(--line); }
.wiz-steps i.on{ background:var(--teal); }
.wiz-title{ font-weight:700; margin:10px 0 4px; }
.optlist{ display:grid; gap:10px; margin:10px 0; }
.opt{ text-align:left; border:1.5px solid var(--line); background:var(--sheet); border-radius:var(--r-m); padding:14px; cursor:pointer; }
.opt[aria-pressed="true"]{ border-color:var(--teal); box-shadow:inset 0 0 0 1px var(--teal); }
.opt .speaker{ margin-bottom:4px; }
.opt .tx{ font-family:var(--serif); line-height:1.8; }
.reads{ display:flex; gap:12px; margin:12px 0; }
.reads button{ width:64px; height:64px; border-radius:50%; border:2px solid var(--teal); background:transparent; font-family:var(--serif); font-size:1.4em; font-weight:700; color:var(--teal); cursor:pointer; }
.reads button[aria-pressed="true"]{ background:var(--teal); color:var(--teal-ink); }
.card-preview{ width:min(260px, 70%); display:block; margin:14px auto; border-radius:18px; box-shadow:0 10px 30px rgba(12,36,54,.25); }

/* ---------- 시트 · 오버레이 ---------- */
.sheet-back{ position:fixed; inset:0; background:rgba(8,20,32,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
.sheet{ width:100%; max-width:600px; background:var(--paper); border-radius:22px 22px 0 0; padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px)); max-height:92vh; overflow:auto; }
.sheet .grab{ width:44px; height:5px; border-radius:4px; background:var(--line); margin:0 auto 10px; }
.sheet h2{ font-family:var(--serif); margin:.2em 0 .3em; font-size:1.3em; }

.overlay{ position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; }
.calm{ background:linear-gradient(180deg, var(--deep) 0%, var(--deep-2) 100%); color:#EDE6D3; }
.calm canvas{ position:absolute; inset:0; width:100%; height:100%; }
.calm .cv{ position:relative; z-index:2; flex:1; display:flex; flex-direction:column; padding:calc(18px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px)); max-width:600px; width:100%; margin:0 auto; }
.calm .top{ display:flex; justify-content:space-between; align-items:center; font-size:.86em; color:#B7C4CE; }
.calm .top button{ background:none; border:0; color:#DCE4EA; padding:8px; cursor:pointer; min-height:44px; font-size:1em; }
.calm .stage{ margin-top:auto; margin-bottom:auto; text-align:center; }
.calm .stage .nm{ font-family:var(--serif); font-size:2em; font-weight:700; letter-spacing:.02em; }
.calm .stage .ins{ font-family:var(--serif); font-size:1.08em; line-height:1.8; margin:.6em auto 0; max-width:26em; color:#DCE3E6; }
.calm .stage .time{ margin-top:1.1em; font-size:.95em; color:#AFC0CC; font-variant-numeric:tabular-nums; }
.calm .text{ font-family:var(--serif); font-size:1.05em; line-height:1.95; max-height:42vh; overflow:auto; text-align:left; margin:1em 0 0; padding:0 4px; color:#EDE6D3; }
.calm .text .vn{ color:#D6A452; font-family:var(--sans); font-size:.7em; font-weight:700; margin-right:.25em; vertical-align:.25em; }
.calm .text b{ color:#FFF6E0; }
.calm .dots{ display:flex; justify-content:center; gap:8px; margin:0 0 16px; }
.calm .dots i{ width:34px; height:4px; border-radius:3px; background:rgba(237,230,211,.25); }
.calm .dots i.on{ background:#D6A452; }

function vocative(name){
  const n=(name||"").trim(); if(!n) return "";
  const c=n.charCodeAt(n.length-1);
  if(c>=0xAC00 && c<=0xD7A3){ return n + (((c-0xAC00)%28)?"아":"야"); }
  return n + ",";
}

function voiceScores(){
  const res={};
  TYPES.forEach(t=>res[t.id]={out:0,outN:0,in:0,inN:0});
  PHRASES.forEach(p=>{ const v=F1(2,"ph_"+p.id,null); if(v===null) return; const r=res[p.type]; if(p.dir==="out"){r.out+=v;r.outN++;} else {r.in+=v;r.inN++;} });
  const list=TYPES.map(t=>{ const r=res[t.id]; const o=r.outN?r.out/r.outN:0, i=r.inN?r.in/r.inN:0; return {id:t.id, out:o, in:i, sum:o+i}; });
  const answered = PHRASES.filter(p=>F1(2,"ph_"+p.id,null)!==null).length;
  const top=[...list].sort((a,b)=>b.sum-a.sum).filter(x=>x.sum>0).slice(0,2).map(x=>x.id);
  const oMean=list.reduce((a,x)=>a+x.out,0)/list.length, iMean=list.reduce((a,x)=>a+x.in,0)/list.length;
  let shape="both";
  if(oMean<0.35 && iMean<0.35) shape="low"; else if(oMean-iMean>=0.35) shape="out"; else if(iMean-oMean>=0.35) shape="in";
  return {list, top, answered, shape};
}
function myPhrases(typeId){ return PHRASES.filter(p=>p.type===typeId && (F1(2,"ph_"+p.id,0)||0)>0).map(p=>p.t); }
function topTypes(){ return voiceScores().top; }

  return out.sort((a,b)=>(b.belief??-1)-(a.belief??-1));
}

let AC;
function chime(){
  if(!S.settings.chime) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const now=AC.currentTime;
    [[523.25,0.18],[783.99,0.09],[1046.5,0.05]].forEach(([f,g],i)=>{
      const o=AC.createOscillator(), a=AC.createGain();
      o.type="sine"; o.frequency.value=f;
      a.gain.setValueAtTime(0,now); a.gain.linearRampToValueAtTime(g, now+0.02+i*0.01); a.gain.exponentialRampToValueAtTime(0.0001, now+3.2);
      o.connect(a).connect(AC.destination); o.start(now); o.stop(now+3.3);
    });
  }catch(e){}
}

function openCalm(dayN){

  </div>`;
  document.body.appendChild(ov); document.body.style.overflow="hidden";
  const cvs=ov.querySelector("canvas"); let ctx=null; try{ ctx=cvs.getContext("2d"); }catch(e){}
  if(!ctx){ ctx={clearRect(){},createLinearGradient(){return {addColorStop(){}};},fillRect(){},beginPath(){},arc(){},fill(){},setTransform(){}}; }

      const dl = await window.claude.use("downloads");
      if(dl){ await dl.save({filename, data:blob}); toast("저장했습니다"); return true; }
      return false;
    }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); return true;
  }catch(e){ if(e && e.code==="declined") return true; return false; }
}
async function copyText(txt){

  const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();

function wrapLines(ctx, text, maxW){
  const out=[]; let line="";
  for(const ch of text){ const test=line+ch; if(ctx.measureText(test).width>maxW && line){ out.push(line); line=ch.trim()?ch:""; } else line=test; }
  if(line) out.push(line); return out;
}

  try{ await document.fonts.ready; }catch(e){}
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,"#16405C"); g.addColorStop(1,"#0C2436"); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle="rgba(214,190,140,.16)"; for(let i=0;i<90;i++){ x.beginPath(); x.arc(Math.random()*W, H-140-Math.random()*120, 1+Math.random()*3, 0, Math.PI*2); x.fill(); }
  x.fillStyle="rgba(214,190,140,.22)"; x.fillRect(0,H-120,W,120);
  const serif='"Gowun Batang","Nanum Myeongjo",serif', sans='"Deepspring Sans","Apple SD Gothic Neo",sans-serif';

  while(lines.length>11 && size>44){ size-=4; x.font=`700 ${size}px ${serif}`; lines=wrapLines(x, body, W-220); }
  x.fillStyle="#F3ECDB"; lines.forEach(l=>{ x.fillText(l,110,y); y+=size*1.62; });
  y+=30; x.fillStyle="#B7C4CE"; x.font=`500 32px ${sans}`; x.fillText(v.ref+" · NJHV",110,y);
  x.fillStyle="rgba(243,236,219,.55)"; x.font=`500 28px ${sans}`; x.fillText("말의 구원 · 깊은 샘에서 흘러나오는 말",110,H-230);

function vHome(){

  const n=currentDay(w), d=DY[n], allDone=[1,2,3,4,5,6].every(k=>dayState(k,w)==="done");
  const st=dayState(n,w), cur=curStep(n);
  const prevLeft = w>1 && ![1,2,3,4,5,6].every(k=>dayState(k,w-1)==="done");
  const label = allDone ? "소그룹 열기" : st==="none" ? "오늘 시작하기" : `이어서 하기 · ${cur} / 4`;
  return `<section class="home-hero">
    <div class="week">${SERIES.title} — ${w}주</div>
    <p class="q">${WK.q}</p>
    <p class="small" style="margin:-.5em 0 .8em">${WK.sub}</p>
  </section>
  <section class="today" aria-label="오늘">
    <div class="day">${allDone?"한 주를 모두 걸었습니다":`${n}일째 · ${d.nm} · 약 ${d.min}분`}</div>
    <div class="title">${allDone?"소그룹에서 함께 나눠요":d.title}</div>
    <p class="small" style="margin:6px 0 14px">${allDone?"이번 주 기록을 들고 소그룹에서 나눕니다.":"누르면 고요부터 마무리까지, 한 단계씩 차례로 안내합니다."}</p>
    <button type="button" class="btn primary block" data-go="${allDone?`#/group/${w}`:`#/day/${w}/${n}`}">${label}</button>
    ${prevLeft?`<button type="button" class="btn block" style="margin-top:10px" data-go="#/day/${w-1}/${currentDay(w-1)}">${w-1}주 이어서 하기</button>`:""}
  </section>
  ${w===2?sigRow():""}
  <div class="strip" role="list" aria-label="이번 주">
    ${[1,2,3,4,5,6].map(k=>`<button type="button" role="listitem" class="${dayState(k,w)==="done"?"done":""} ${k===n&&!allDone?"now":""}" data-go="#/day/${w}/${k}" aria-label="${k}일째 ${DY[k].title}"><b>${k}</b>${["","월","화","수","목","금","토"][k]}</button>`).join("")}
    <button type="button" role="listitem" class="group" data-go="#/group/${w}" aria-label="소그룹"><b>함께</b>소그룹</button>
  </div>
  <p class="small">지난 날을 다시 보려면 날짜를 누르세요.</p>`;
}

/* ---------- 도입 ---------- */
function vIntro(p){
  p=+p||0; const last=1;
  const nav=`<div class="row" style="margin-top:26px">${p>0?`<button type="button" class="btn" data-go="#/intro/${p-1}">이전</button>`:""}<button type="button" class="btn primary" data-go="${p<last?`#/intro/${p+1}`:"#/finish-intro"}">${p<last?"다음":"시작하기"}</button></div>`;
  const pages=[
    `<div class="pg">1 / 2</div><h1 class="ttl">말의 구원</h1>
     <p class="small" style="margin-top:-.4em">깊은 샘에서 흘러나오는 말 · 2026년 10월 설교 시리즈</p>
     <p>10월 한 달, 매일 15분쯤 말씀 앞에 머물고 내 말을 돌아보는 길잡이입니다.</p>
     <div class="panel soft"><p class="ph">쓰는 법은 하나입니다</p><p>매일 첫 화면의 <b>[오늘 시작하기]</b>를 누르세요. 고요 → 오늘의 질문 → 오늘의 연습 → 마무리, 한 단계씩 차례로 안내합니다.</p><p class="small">그리고 날마다 마지막에 ‘오늘의 세 걸음’ — 내 말을 알아채고, 하나님의 말씀을 나에게 들려주고, 새 말을 합니다.</p></div>
     <p class="small">기록은 이 기기에만 저장되고, 목사님도 다른 누구도 볼 수 없습니다. 성경 본문은 NJHV(나종현 목사가 원문에서 옮긴 번역)입니다.</p>`,
    `<div class="pg">2 / 2</div><h1 class="ttl">이름을 알려 주세요</h1>
     <p>말씀을 읽을 때 이름을 넣어 불러 드립니다. \u201c<span class="serif">${esc(vocative(S.name||"지은"))} 두려워하지 마라. 내가 네 이름을 불렀다.</span>\u201d</p>
     <div class="field"><label for="nm">부르는 이름</label><div class="hint">이 기기에만 저장됩니다. 비워 두셔도 됩니다.</div><input type="text" id="nm" data-name value="${esc(S.name)}" placeholder="예: 지은"></div>
     <div class="field"><div class="lbl">글자 크기</div><div class="seg" style="grid-template-columns:repeat(2,1fr)"><button type="button" aria-pressed="${S.settings.size!=="l"}" data-set="size|m">보통</button><button type="button" aria-pressed="${S.settings.size==="l"}" data-set="size|l">크게</button></div></div>`
  ];
  return `<div class="intro">${pages[p]}${nav}</div>`;
}
function guideHTML(inIntro){
  return `<${inIntro?"h1 class='ttl'":"h2 class='h2'"}>고요 훈련 안내</${inIntro?"h1":"h2"}>
  <div class="quote">그리스도의 말씀이 여러분 안에 집을 삼아 풍성하게 머물게 하십시오.<span class="ref">골로새서 3:16 · NJHV</span></div>
  <p>잠시 들르는 손님이 아니라, 집에 사는 식구처럼. 하루 10분의 고요는 말씀이 내 안에 머물 자리를 내는 시간입니다.</p>
  <p class="serif" style="font-size:1.05em;line-height:1.9">루스 헤일리 바턴은 말과 글로 모든 것을 풀어내며 살던 사람이었습니다. 어느 날 그녀의 영적 지도자가 말했습니다. \u201c당신은 마구 흔들린 강물 병 같아요. 침전물이 가라앉고 물이 맑아질 만큼, 오래 가만히 앉아 있어야 해요.\u201d</p>
  <p>하루 10분의 고요는 우리 안에서 소용돌이치던 것들이 가라앉는 시간입니다. 타이머를 켜면 물속의 부유물이 천천히 가라앉는 것을 보게 됩니다.</p>
  <h3 class="h3">성경 속 그 자리</h3>
  <p>엘리야가 바람과 지진과 불이 지나간 뒤, 고요하고 가느다란 소리를 들었던 자리(왕상 19:12). 예수께서 새벽 아직 어두울 때 한적한 곳으로 가셨던 자리(막 1:35).</p>
  <div class="quote">손을 놓아라. 그리고 알아라, 내가 하나님이다.<span class="ref">시편 46:10 · NJHV</span></div>
  <h3 class="h3">네 단계, 10분</h3>
  <div class="tablewrap"><table class="simple"><tr><th>단계</th><th>시간</th><th>하는 일</th></tr>
  <tr><td>멈춤</td><td>1분</td><td>숨을 세 번 깊이. 몸의 긴장 한 곳 알아채기</td></tr>
  <tr><td>알아채기</td><td>2분</td><td>오늘 가장 크게 들리는 목소리를 판단하지 않고 보기</td></tr>
  <tr><td>말씀 듣기</td><td>5분</td><td>천천히 두 번. 머무는 한 단어에 머물기</td></tr>
  <tr><td>응답</td><td>2분</td><td>한 문장 기도, 오늘 건넬 말 하나</td></tr></table></div>
  <h3 class="h3">준비</h3>
  <p>매일 같은 시간, 같은 자리. 할 수 있다면 <b>아침에 다른 앱을 열기 전에, 이 앱부터</b>. 알림과 피드의 목소리가 오늘의 첫 목소리가 되기 전에. 길이보다 꾸준함이 중요합니다. 딴생각이 올 때 돌아올 짧은 기도문 하나 — 1주의 기도문은 <span class="serif"><b>\u201c나는 주의 것입니다.\u201d</b></span>(사 43:1)</p>
  <h3 class="h3">흔한 어려움</h3>
  <p><b>딴생각이 계속 나요</b> — 정상입니다. 구름처럼 지나가게 두고 기도문으로 돌아오세요.</p>
  <p><b>졸려요</b> — 등을 조금 더 세우거나 창가로 옮겨 보세요. 피곤한 날에는 잠잠히 앉아 있는 것만으로 충분합니다.</p>
  <p><b>아무 느낌이 없어요</b> — 헨리 나우웬은 성령의 움직임이 부드럽고 숨어 있어서 처음에는 아무 일도 없는 것처럼 느껴진다고 말합니다. 그러다 어느 날, 그 시간을 기다리는 자신을 발견하게 된다고 합니다.</p>
  <p><b>\u201c잘하고 있나?\u201d</b> — 이 시간은 무엇을 얻어 내는 시간이 아니라, 하나님과 함께 있는 시간입니다.</p>`;
}

/* ---------- 주차 ---------- */
function vWeek(w){
  w=+w||1; const W=SERIES.weeks[w-1];
  if(!W.open) return `${topbar(`${w}주 · ${W.tag}`,"#/more")}<p class="h-hero" style="font-size:1.5em">${W.q}</p><p class="lead">${W.sub}</p><p class="lead">${w}주차 설교 뒤에 열립니다. 1주의 기록이 이 주에 다시 이어집니다.</p>`;
  return `${topbar(`1주 · ${W.tag}`,"#/more")}
  <p class="h-hero">${W.q}</p>
  <p class="lead">${W.sub}</p>
  ${verseHTML("jn10_27",{note:false})}
  <h2 class="h2">이번 주에 발견할 것</h2>
  <p>태초에 하나님이 먼저 말씀하셨고, 사람은 그 음성을 듣고 응답하도록 지어졌습니다. 그런데 다른 소리를 더 크게 듣기 시작했을 때, 말이 무너졌습니다.</p>
  <p>내가 자주 하는 말 밑에는 오래 들어 온 목소리가 있습니다. 그 목소리는 나에게도, 남에게도 같은 말을 합니다. 그리고 그 목소리는 원래 내 것이 아닙니다.</p>
  <div class="quote">나무는 저마다 그 열매로 알려지는 법이다.<span class="ref">누가복음 6:44 · NJHV</span></div>
  <details class="voice"><summary><span class="nm">주일에 함께 읽은 말씀 — 야고보서 3장</span></summary>
    ${scriptureHTML("jas3a")}${scriptureHTML("jas3b")}
  </details>
  <details class="voice"><summary><span class="nm">설교에서 함께 본 창세기</span></summary>
    ${scriptureHTML("gen2")}${scriptureHTML("gen3")}
  </details>
  ${methodPanel(CW)}
  <h2 class="h2">이번 주의 여섯 날</h2>
  ${[1,2,3,4,5,6].map(k=>`<a class="list-link" href="#/day/1/${k}"><span><span class="s">${k}일째 · ${DAYS[k].nm} · 약 ${DAYS[k].min}분</span><br><span class="t">${DAYS[k].title}</span></span><span class="s">${dayState(k)==="done"?"마침":dayState(k)==="part"?"진행 중":""}</span></a>`).join("")}
  <a class="list-link" href="#/group/1"><span><span class="s">6일째 뒤</span><br><span class="t">소그룹 — 함께 나누기</span></span></a>
  <h2 class="h2">설교 한 문장</h2>
  <p class="serif" style="font-size:1.25em;font-weight:700;line-height:1.6">태초에 말이 있었습니다. 그 말씀이, 오늘 우리의 말을 다시 시작하게 하십니다.</p>`;
}

    <div class="panel soft"><p class="ph">약속과 실제는 달랐습니다</p>
      <p>노은혜는 이렇게 씁니다. \u201c가혹한 비판자는 결코 우리를 성장으로 이끌지 않는다.\u201d</p>
      <p>심리학자 줄리아나 브라인스와 세레나 첸의 실험에서, 실패한 뒤 자기에게 친절하게 대한 사람들이 오히려 잘못을 바로잡으려는 마음이 더 컸고, 어려운 시험에 떨어진 뒤 더 오래 공부했습니다.</p>
      <p>그리고 하나님은 숨은 사람에게 \u201c너희가 벗었구나\u201d 하지 않으시고, 이렇게 물으셨습니다. <span class="serif">\u201c누가 너에게, 네가 벗었다고 알려 주었느냐?\u201d</span>(창 3:11)</p></div>
    <div class="quote"><b>하나님의 인자하심이 너를 회개로 이끌고 있다는 것을 알지 못하느냐?</b><span class="ref">로마서 2:4 · NJHV</span></div>
    <p>사람을 돌이키게 하는 것은 다그침이 아니라, 하나님의 인자하심입니다.</p>
    <h3 class="h3">이름 붙이기</h3>
    <p class="small">역할로 붙입니다. 이름이 생기면 그 목소리가 \u2018나\u2019와 조금 떨어져 보입니다. \u201c아, 재판관이 또 왔구나.\u201d</p>
    <div class="chips">${["재판관","감시자","채점관","검사","잔소리꾼","감독"].map(x=>`<button type="button" class="chip" data-fill="3|critic_name" data-val="${x}" aria-pressed="${F(3,"critic_name","")===x}">${x}</button>`).join("")}</div>
    ${fText(n,"critic_name","내 비판자의 이름")}
    <p class="small">비판자를 마귀라고 부르지는 않습니다. 이 목소리의 상당 부분은 우리가 오래 들어 온 사람들의 말투이기 때문입니다.</p>
    ${doneBar(n,2)}</section>
  <section class="layer" id="L3">${layerHead(n,3,"양심인가, 비판자인가","")}
    <p>\u201c이 가혹한 소리가 혹시 내 양심 아닐까?\u201d 자기를 향한 목소리에는 <b>고치려는</b> 얼굴과 <b>벌주려는</b> 얼굴이 있습니다. 폴 길버트와 동료들은 자기를 미워하고 해치려는 쪽이 특히 해롭다고 보고합니다.</p>
    <div class="quote">하나님의 뜻을 따르는 근심은 후회할 것 없는 구원에 이르는 회개를 이루지만, 세상의 근심은 죽음을 이룹니다.<span class="ref">고린도후서 7:10 · NJHV</span></div>
    <p class="small">어제 적은 문장 하나를 떠올리며 고르세요.</p>
    ${qs.map((q,i)=>`<div class="field"><div class="lbl">${["이 목소리를 듣고 나면","이 목소리는","이 목소리는","이 목소리는"][i]}</div><div class="seg" style="grid-template-columns:1fr 1fr">${q.map((o,j)=>`<button type="button" aria-pressed="${F(3,"tf"+(i+1),null)===j}" data-seg="3|tf${i+1}" data-val="${j}">${o}</button>`).join("")}</div></div>`).join("")}
    ${answered===4?`<p class="serif" style="font-size:1.05em">${right>=2?"이것은 양심의 목소리라기보다 비판자의 목소리에 가깝습니다. 하나님이 주시는 근심은 사람을 무너뜨리지 않고 돌아오게 합니다.":"이 목소리에는 하나님이 주시는 근심의 모습이 있습니다. 그 일을 하나님께 가져가고, 필요하면 바로잡으세요(요일 1:9)."}</p>`:""}
    <h3 class="h3">이 목소리는 어디서 왔을까 — 두 질문만</h3>
    <div class="quote" style="font-size:.98em">가족을 돌아보는 것은 잘못을 찾기 위해서가 아니라, 무엇이 건강했고 무엇이 아팠는지 정직하게 보고 그리스도 안에서 자라기 위해서입니다.<span class="ref">피터 스캐지로</span></div>
    ${safety?`<div class="panel warn"><p>이 질문은 오늘 건너뛰어도 됩니다. 3주에 천천히 다시 열 수 있습니다.</p><div class="seg" style="grid-template-columns:1fr 1fr"><button type="button" aria-pressed="${skip}" data-seg="3|skipOrigins" data-val="1">건너뛰기</button><button type="button" aria-pressed="${!skip}" data-seg="3|skipOrigins" data-val="0">지금 해 보기</button></div></div>`:""}
    ${skip?"":`
      ${F(2,"pick_text","")?`<p class="small">내 입버릇: \u201c${esc(F(2,"pick_text",""))}\u201d</p>`:""}
      <p>창세기 3장에서 여자는 몇 마디 대화 만에 뱀의 말투로 하나님을 말하게 됩니다. \u201c모든 나무에서 마음껏\u201d이 빠지고, 하나님이 하지 않으신 \u201c만지지도 마라\u201d가 더해집니다(창 3:2–3). 우리는 들은 대로 닮습니다.</p>
      <div class="quote">제자는 스승보다 높지 않다. 그러나 <b>누구든지 다 배우고 나면 자기 스승처럼 되는 법이다.</b><span class="ref">누가복음 6:40 · NJHV</span></div>
      ${fChips(n,"who","1. 내가 자주 하는 그 말 — 그 말투는 누구에게서 들었나요?",WHO,{multi:true,hint:"여럿 골라도 됩니다. 아이는 부모를 옳다고 믿어야 세상이 안전하기 때문에 \u201c엄마가 잘못했다\u201d보다 \u201c내가 잘못했다\u201d를 택하곤 합니다(노은혜). 목소리의 출처가 늘 누군가의 말은 아닙니다."})}
      <p>우리 집의 보이지 않는 규칙은 대개 \u201c~해야만\u201d의 문법으로 말합니다. 동산에서 뱀이 이미 하나님의 형상으로 지음받은 사람에게 \u201c하나님처럼 되어서\u201d라고 한(창 3:5), 그 문법입니다.</p>
      ${fChips(n,"rules","2. 우리 집의 보이지 않는 규칙 가운데, 내 비판자와 닮은 것을 두세 개 고르세요.",RULES.map(r=>({v:r.id,t:r.t})),{multi:true})}
      ${fText(n,"rule_own","직접 쓰는 규칙")}
      ${rulesSel.length?`<h3 class="h3">새 가족의 규칙</h3>
        <p>피터 스캐지로는 이렇게 말합니다. \u201c예수님은 마음에 계셔도, 할아버지는 뼛속에 산다.\u201d 오래 배운 규칙은 쉽게 떠나지 않습니다. 그러나 그리스도께 온 우리는 새 가족으로 태어났습니다.</p>
        <div class="quote">그러나 그분을 맞아들인 사람들, 곧 그분의 이름을 믿는 사람들에게는 하나님의 자녀가 되는 권리를 주셨다. 이들은 혈통으로나, 육체의 뜻으로나, 사람의 뜻으로 난 사람들이 아니라, <b>하나님께로부터 난 사람들이다.</b><span class="ref">요한복음 1:12–13 · NJHV</span></div>
        ${rulesSel.map(id=>{const r=RULES.find(x=>x.id===id); return `<p style="margin-top:18px"><b>우리 집:</b> ${r.t}</p><p class="small">아버지 집의 말${r.note?` — ${r.note}`:""}</p>${verseHTML(r.v,{name:S.name,note:false})}`;}).join("")}`:""}
      <p class="small" style="margin-top:14px">오늘 모두 풀어내지 않아도 됩니다. <b>3주에 이 기록을 다시 열어</b>, 그 목소리를 처음 들었던 장면까지 조금 더 깊이 들어갑니다.</p>`}
    ${stopLine()}${doneBar(n,3)}</section>`+
  closeLayer(n, `<div class="quote">아버지, 이 목소리는 저를 지키겠다고 했지만, 저를 숨게 했습니다. 이제 아버지의 인자하심 안에서 돌이키게 하십시오.</div>`));
}

/* ---------- 4일째 ---------- */
function vDay4(){
  const n=4; const step=F(4,"step",1);
  const pairs=pairsForAnswer(); const pk=F(4,"pair",null); const pair=pk?pairByKey(pk):null;
  const vid=F(4,"verse",null);
  let body="";
  if(step===1){
    body=`<p class="wiz-title">1. 오늘 대답을 들을 짝 하나를 고르세요</p><p class="small">지금 가장 믿고 있는 문장이 맨 위에 있습니다.</p>
    ${pairs.length?`<div class="optlist">${pairs.map(p=>`<button type="button" class="opt" aria-pressed="${pk===p.key}" data-wiz-set="pair" data-val="${p.key}">${p.said?`<div class="small">내가 한 말 \u201c${esc(p.said)}\u201d</div>`:""}<div class="tx">\u201c${esc(p.voice||p.said)}\u201d</div><div class="small">${p.type?TYPE[p.type].nm:"목소리 모름"}${p.belief!=null?` · 믿음 ${p.belief}`:""}</div></button>`).join("")}</div>`
    :`<p class="empty">아직 짝이 없습니다. 2일째의 \u2018그 말 밑의 문장\u2019을 적거나 [말과 목소리]로 기록해 주세요.</p><button type="button" class="btn" data-act="log">${IC.pen}지금 기록하기</button>`}`;
  }
  if(step===2){
    const t=pair&&pair.type?TYPE[pair.type]:null;
    const cats = t? t.cats : CATS.map(c=>c.id);
    const catSel=F(4,"cat", cats[0]);
    const ids = [...new Set([...(t?[t.answer]:[]), ...CATS.find(c=>c.id===catSel).v])];
    body=`<p class="wiz-title">2. 아버지의 대답을 고르세요</p>
    <p class="small">예수께서도 광야에서 흔드는 목소리에 자기 말로 답하지 않으시고, \u201c기록되었으되\u201d로 답하셨습니다(마 4:4). 바울도 \u201c새 사람이 되라\u201d고 하지 않고 \u201c새 사람을 입었다\u201d고 말합니다(골 3:10). 우리가 고르는 것은 내가 만든 좋은 말이 아니라, 하나님이 이미 하신 말씀입니다.</p>
    ${pair?`<p class="small">내 안의 목소리: \u201c${esc(pair.voice||pair.said)}\u201d</p>`:""}
    <div class="chips" style="margin:10px 0">${cats.map(c=>`<button type="button" class="chip" aria-pressed="${catSel===c}" data-wiz-set="cat" data-val="${c}">${CATS.find(x=>x.id===c).nm}</button>`).join("")}</div>
    <div class="optlist">${ids.map(id=>{const v=VERSES[id]; return `<button type="button" class="opt" aria-pressed="${vid===id}" data-wiz-set="verse" data-val="${id}"><div class="speaker">${esc(v.who)}</div><div class="tx">${esc(v.t)}</div><div class="small">${v.ref}</div></button>`;}).join("")}</div>`;
  }
  if(step===3){
    body=`<p class="wiz-title">3. 내 이름을 넣어 읽어 보세요</p>
    ${S.name?"":`<div class="field"><label for="nm3">부르는 이름</label><input type="text" id="nm3" data-name value="" placeholder="예: 지은"></div>`}
    ${vid?verseHTML(vid,{name:S.name}):""}
    <p class="small">말씀의 글자는 바꾸지 않고, 이름만 앞에 붙입니다. 심리학자들은 자기와 관련지어 받아들인 정보가 훨씬 잘 기억된다고 말합니다(자기 참조 효과). 하나님은 이미 이렇게 말씀하셨습니다. \u201c내가 네 이름을 불렀다.\u201d</p>`;
  }
  if(step===4){
    const v=VERSES[vid]||{}; const r=[1,2,3].map(i=>F(4,"read"+i,false));
    body=`<p class="wiz-title">4. 굵은 부분을 소리 내어 천천히 세 번</p>
    <div class="quote">${v.direct&&S.name?`<b>${esc(vocative(S.name))} </b>`:""}<b>${esc(v.key||v.t)}</b><span class="ref">${v.ref||""}</span></div>
    <div class="reads">${[1,2,3].map(i=>`<button type="button" aria-pressed="${r[i-1]}" data-read="${i}" aria-label="${i}번째 읽기">${i}</button>`).join("")}</div>
    <p class="small">소리 내어 읽은 것이 조용히 읽은 것보다 더 잘, 더 오래 기억된다는 연구가 있습니다(산출 효과). 그런데 시편 1편이 \u201c주야로 <b>묵상</b>한다\u201d고 할 때, 그 \u2018묵상\u2019(하가)은 원래 낮은 소리로 읊조린다는 뜻입니다.</p>`;
  }
  if(step===5){
    const v=VERSES[vid]||{};
    const dflt=`\u201c${pair?(pair.voice||pair.said):"그 목소리"}\u201d가 들리면${pair&&pair.said&&pair.voice?` — 그래서 \u201c${pair.said}\u201d가 나오려 할 때 —`:""} 나는 \u201c${v.key||v.t||""}\u201d를 내 영혼에게 말하겠다.`;
    if(F(4,"ifthen",null)===null) setF(4,"ifthen",dflt);
    body=`<p class="wiz-title">5. 만약-그러면 한 줄</p>
    ${fText(n,"ifthen","",{area:true})}
    <p class="small">94개의 연구를 모아 본 결과, \u201c이럴 때는 이렇게 하겠다\u201d를 미리 정해 둔 사람들이 목표를 훨씬 더 잘 이루었습니다(실행 의도). 옛 목소리가 들리는 바로 그 순간에, 새 길로 흐르도록 미리 길을 내 두는 것입니다. 시인도 영혼이 주저앉는 그때 \u201c내 영혼아\u201d라고 불렀습니다(시 42:5).</p>`;
  }
  if(step===6){
    body=`<p class="wiz-title">6. \u2018기록되었으되\u2019 카드</p>
    <div id="cardbox"><p class="small">카드를 만드는 중입니다…</p></div>
    <button type="button" class="btn primary block" data-act="cardSave">배경화면으로 저장</button>
    <p class="small">배경화면은 다른 사람도 볼 수 있으니, 카드에는 내 문장을 넣지 않고 말씀만 둡니다. 신명기는 말씀을 \u201c네 집 문설주와 바깥문에 기록하라\u201d(신 6:9)고 했습니다. 오늘의 문설주는 하루에도 수십 번 여는 휴대전화 화면입니다. 저장이 되지 않으면 카드를 길게 눌러 저장하세요.</p>`;
  }
  if(step===7){
    body=`<p class="wiz-title">7. 다시 재기</p>
    ${pair&&pair.belief!=null?`<p>처음에 이 문장을 믿었던 정도: <b>${pair.belief}</b></p>`:""}
    ${pair?`<p class="serif">\u201c${esc(pair.voice||pair.said)}\u201d</p>`:""}
    ${fRange(n,"belief4","아버지의 대답을 듣고 난 지금, 이 문장을 얼마나 믿나요?",{min:0,max:100,step:5,lo:"전혀",hi:"완전히"})}
    <p class="small">한 번에 크게 달라지지 않아도 괜찮습니다. 토요일에 한 주의 변화를 함께 봅니다.</p>`;
  }
  const canNext = (step===1&&pk)||(step===2&&vid)||step>=3;
  const wiz=`<div class="wiz-steps" aria-hidden="true">${[1,2,3,4,5,6,7].map(i=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>${body}
    <div class="row" style="margin-top:16px">${step>1?`<button type="button" class="btn" data-wiz="prev">이전</button>`:""}${step<7?`<button type="button" class="btn primary" data-wiz="next" ${canNext?"":"disabled"}>다음</button>`:""}</div>`;
  return dayShell(n, calmLayer(n)+`
  <section class="layer" id="L2">${layerHead(n,2,"주어가 다릅니다","")}
    <p>좋은 말을 스스로 되뇌면 가혹한 목소리가 사라질까요? 캐나다 워털루 대학의 조앤 우드와 동료들은 참가자들에게 \u201c나는 사랑받을 만한 사람이다\u201d를 되뇌게 했습니다. 자존감이 높은 사람은 조금 나아졌지만, <b>자존감이 낮은 사람은 되뇌지 않은 사람보다 오히려 기분이 더 가라앉았습니다.</b></p>
    <p>복음은 내가 만든 좋은 말을 되뇌라고 하지 않습니다. <b>아버지가 이미 하신 말을 듣고, 그 말을 내 영혼에게 전하라고</b> 합니다. 시인이 그렇게 했습니다.</p>
    ${verseHTML("ps42_5")}
    ${doneBar(n,2)}</section>
  <section class="layer" id="L3">${layerHead(n,3,"아버지의 대답으로 새 길 내기","5–7분")}${wiz}${doneBar(n,3)}</section>`+
  closeLayer(n, `<div class="quote">아버지, 제 안에서 오래 들린 말이 있습니다. 그러나 오늘 아버지의 말씀을 들었습니다. 그 말이 제 안의 새 길이 되게 하시고, 제 입에서도 새 말이 흐르게 하십시오.</div>`, "오늘 그 입버릇 대신 건넬 말 하나", `<p class="small">날 선 말이 왜 하필 그 순간에 나오는지는 3주에 함께 봅니다.</p>`));
}

/* ---------- 5일째 ---------- */
function vDay5(){
  const n=5; const vid=F(4,"verse","isa43_1"); const alt=F(1,"alt",null); const partner=F(1,"partner","");

function lineChart(pts){
  const W=320,H=140,pad=28; const xs=pts.map((_,i)=>pad+i*((W-2*pad)/Math.max(1,pts.length-1)));
  const y=v=>H-pad-(v/100)*(H-2*pad);
  const path=pts.map((p,i)=>p.v==null?null:`${xs[i]},${y(p.v)}`).filter(Boolean);
  return `<svg class="line-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="믿음의 변화">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"/>
    ${path.length>1?`<polyline fill="none" stroke="var(--teal)" stroke-width="3" points="${path.join(" ")}"/>`:""}
    ${pts.map((p,i)=>p.v==null?"":`<circle cx="${xs[i]}" cy="${y(p.v)}" r="6" fill="var(--teal)"/><text x="${xs[i]}" y="${y(p.v)-12}" text-anchor="middle" font-size="13" fill="var(--ink)">${p.v}</text>`).join("")}
    ${pts.map((p,i)=>`<text x="${xs[i]}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${p.l}</text>`).join("")}</svg>`;
}

/* 2일째 해부한 장면 — 다른 날들이 함께 쓴다 */
function w2Scene(){
  const sc=F(2,"scene",null,2), own=F(2,"scene_own","",2), said=sc||own||F(4,"scene4","",2);
  const ph=W2_PH.find(p=>p.t===sc); const st=W2_SIT.flatMap(s=>s.o).find(o=>o.t===sc);
  const shape = ph?ph.s : st&&st.c!=="true" ? st.c : null;
  return {said, shape, fact:F(2,"fact","",2), pic:F(2,"pic_own","",2)||F(2,"pic",null,2), guard:F(2,"guard",[],2)||[], afraid:F(2,"afraid",[],2)||[], belief:F(2,"belief",null,2), pct:F(2,"belief_pct",null,2)};
}
function quoteOf(t){ const m=String(t||"").match(/“([^”]+)”/); return m?m[1]:String(t||""); }
function sceneCard(sn, title="해부한 장면"){
  if(!sn.said) return `<p class="empty">2일째에 해부한 장면이 여기에 나타납니다.</p>`;
  return `<div class="panel soft"><p class="ph">${title}</p>
    <p><b>내가 한 말</b> — ${esc(sn.said)}${sn.shape?` <span class="small">(${shapeNm(sn.shape)})</span>`:""}</p>
    ${sn.fact?`<p class="small"><b>실제로 있었던 일</b> — ${esc(sn.fact)}</p>`:""}
    ${sn.pic?`<p class="small"><b>상대 머릿속의 그림</b> — ${esc(sn.pic)}</p>`:""}
    ${sn.guard.length?`<p class="small"><b>그 그림이 지킨 것</b> — ${sn.guard.map(esc).join(", ")}</p>`:""}
    ${sn.afraid.length?`<p class="small"><b>드러났다면 두려웠던 것</b> — ${sn.afraid.map(esc).join(", ")}</p>`:""}
    ${sn.belief?`<p class="small"><b>그 밑의 믿음</b> — “${esc(sn.belief)}”${sn.pct!=null?` · 믿음 ${sn.pct}`:""}</p>`:""}</div>`;
}

    ${sceneCard(sn,"어제 해부한 장면")}
    <h3 class="h3">이 두려움은 어디서 배웠을까 — 두 질문만</h3>

    ${fChips(n,"who","1. 가리는 법을 처음 배운 자리는",WHO,{multi:true,hint:"여럿 골라도 됩니다. 목소리의 출처가 늘 누군가의 말은 아닙니다."})}
    ${fChips(n,"rules","2. 우리 집이나 학교, 교회에 있던 보이지 않는 규칙 가운데, 오늘의 내 가림과 닮은 것",W2_RULES.map(r=>({v:r.id,t:r.t})),{multi:true})}
    ${fText(n,"rule_own","직접 쓰는 규칙")}
    ${rs.length?`<div class="panel soft"><p class="ph">새 가족의 규칙</p><p class="small">피터 스캐지로는 “예수님은 마음에 계셔도, 할아버지는 뼛속에 산다”고 말합니다. 오래 배운 규칙은 쉽게 떠나지 않습니다. 그러나 그리스도 안에서 우리는 새 가족이 되었고, 그 가족의 규칙은 “우리는 서로의 지체”입니다(엡 4:25).</p>${rs.map(id=>{const r=W2_RULES.find(x=>x.id===id); return r?`<p class="small" style="margin-top:12px">“${r.t}” 대신</p>${verseHTML(r.v,{name:S.name})}`:"";}).join("")}</div>`:""}
    ${t1?`<div class="panel soft"><p class="ph">1주에 찾은 내 안의 가장 큰 목소리</p><p><b>${t1.nm}</b> — “${t1.self}”</p></div>${fChips(n,"echo","오늘 찾은 규칙은 그 목소리와 닮았나요?",["많이 닮았다","조금","아니다","잘 모르겠다"])}`:""}
    <p class="small">숨는 이유가 다 내 잘못 때문은 아닙니다. 누군가에게 당한 일 때문에 숨어 온 분도 있습니다. 그건 그분 탓이 아닙니다.</p>
    ${stopLine()}${doneBar(n,2)}</section>
  <section class="layer" id="L3">${layerHead(n,3,"지혜로운 침묵인가, 두려운 가림인가","")}
    <p>모든 침묵이 가림은 아닙니다. “잠잠할 때가 있고, 말할 때가 있다”(전 3:7). 침묵할 자유는 있지만, 속일 자유는 없습니다. 어제 해부한 장면을 네 질문으로 가려 봅니다.</p>
    ${W2_DISCERN.map(q=>`<div class="phrase"><div class="t">${q.q}</div>${fSeg(n,"d_"+q.id,q.o)}</div>`).join("")}
    ${dDone?`<div class="panel soft"><p class="ph">이 장면은</p><p>${hideN>=2?`<b>두려운 가림</b>에 가깝습니다. 나를 지키려는 말이었고, 상대나 다른 사람에게 필요한 진실이 가려졌습니다. 내일, 이 장면을 들고 빛 가운데로 갑니다.`:`<b>지혜로운 침묵</b>에 가깝습니다. 모든 것을 모든 사람에게 말할 필요는 없습니다. 다만 말한다면, 참되게.`}</p></div>
      <div class="quote">뱀처럼 지혜롭고 비둘기처럼 순결하거라.<span class="ref">마태복음 10:16 · NJHV</span></div>
      <p class="small">순결하다는 것은 속이지 않는 것이고, 지혜롭다는 것은 누구에게, 언제, 어떻게 말할지 분별하는 것입니다. 누군가에게 해를 입은 일이라면 이 질문의 대상이 아닙니다. 그 일은 안전한 사람에게 먼저 이야기해 주세요.</p>`:""}
    ${doneBar(n,3)}</section>`+
  w2Close(n));
}

/* ---------- 2주 4일째 — 빛 가운데 서기 (일곱 단계) ---------- */
function vW2Day4(){
  const n=4; const step=F(4,"step",1); const sn=w2Scene(); const coats=F(n,"coat",[])||[]; const name=F(n,"name",null); const vid=F(4,"verse",null);
  const verdict=(()=>{ const a=W2_DISCERN.map(q=>F(3,"d_"+q.id,null,2)); return a.every(v=>v!==null)?(a.filter(v=>v===1).length>=2?"두려운 가림":"지혜로운 침묵"):null; })();

  if(step===2) body=`<h3 class="h3">2. 에서의 옷을 벗고, 이름으로</h3>
    <p>“네 이름이 무엇이냐?” 이십 년 전에는 “에서입니다”라고 답했던 사람이, 그 밤에는 “야곱입니다”라고 답합니다. 그리고 그 자리에서 복을 받습니다.</p>
    ${coats.length?`<p class="small">위에서 고른 에서의 옷 — ${coats.map(esc).join(", ")}</p>`:`<p class="small">위 ‘에서의 옷’ 칸에서 옷을 먼저 골라 주세요.</p>`}
    <div class="optlist">${JACOB.map(j=>`<button type="button" class="opt" aria-pressed="${name===j}" data-wiz-set="name" data-val="${esc(j)}"><div class="tx">하나님 앞에서, 나는 사실 — ${esc(j)}</div></button>`).join("")}</div>
    ${conf?`<div class="panel soft"><p class="ph">이름 고백</p><p class="serif" style="font-size:1.15em;line-height:1.7">${conf}</p><p class="small">소리 내어 한 번 말해 보세요.</p></div>`:""}`;
  if(step===3) body=`<h3 class="h3">3. 하나님께 그대로</h3>
    <div class="quote">내가 내 죄를 주께 아뢰고, 내 잘못을 덮지 않았습니다. ‘내 허물을 여호와께 털어놓겠다’ 하였더니, 주께서 내 죄의 잘못을 용서하셨습니다.<span class="ref">시편 32:5 · NJHV</span></div>
    <p>있었던 그대로, 핑계 없이 적어 보세요. 말하기 편한 것 말고, 진짜 하나. 이 칸은 나만 봅니다.</p>
    ${fText(n,"confess","하나님, 사실은 —",{area:true})}
    <p class="small">1절의 ‘덮인’과 5절의 ‘덮지 않았습니다’는 히브리어로 같은 말입니다. 우리가 덮기를 멈추면, 하나님이 덮어 주십니다.</p>`;
  if(step===4) body=`<h3 class="h3">4. 빛 가운데의 말씀 — 내 이름을 넣어</h3>
    <p>내가 만든 좋은 말이 아니라, 하나님이 이미 하신 말씀을 고릅니다. ${sn.belief?`화요일에 찾은 믿음 “${esc(sn.belief)}”에 맞는 말씀이 맨 위에 있습니다.`:""}</p>
    <div class="optlist">${LIGHT.map((id,i)=>{const v=VERSES[id]; return v?`<button type="button" class="opt" aria-pressed="${vid===id}" data-wiz-set="verse" data-val="${id}"><div class="tx">${esc(v.key||v.t)}</div><div class="small">${v.ref}${i===0&&sn.belief?" · 내 믿음에 맞춘 말씀":""}</div></button>`:"";}).join("")}</div>
    ${vid?verseHTML(vid,{name:S.name})+`<p class="small">말씀의 글자는 바꾸지 않고, 이름만 앞에 붙입니다. 자기와 관련지어 받아들인 말이 훨씬 잘 기억됩니다(자기 참조 효과).</p>`:""}`;
  if(step===5){ const v=VERSES[vid]||{}; body=`<h3 class="h3">5. 굵은 부분을 소리 내어 천천히 세 번</h3>
    ${vid?verseHTML(vid,{name:S.name}):""}
    <div class="row">${[1,2,3].map(i=>`<button type="button" class="chip" aria-pressed="${F(4,"read"+i,false)}" data-read="${i}">${i}번째</button>`).join("")}</div>
    <p class="small">소리 내어 읽은 것이 조용히 읽은 것보다 더 잘, 더 오래 기억됩니다(산출 효과). 시편 1편의 ‘묵상’(하가)도 원래 낮은 소리로 읊조린다는 뜻입니다.</p>`; }
  if(step===6){ const v=VERSES[vid]||{}; const old=quoteOf(sn.said)||"그 말"; const nw=(sn.shape&&W2_SHAPES[sn.shape]?W2_SHAPES[sn.shape].re[0]:"“사실은…”");
    if(F(4,"ifthen",null)===null) setF(4,"ifthen",`다음에 “${old}” 같은 말이 나오려 하면, 나는 ${nw} 하고 말하겠다. 그리고 “${v.key||v.t||""}”를 기억하겠다.`);
    body=`<h3 class="h3">6. 만약-그러면 한 줄, 그리고 카드</h3>
    ${fText(n,"ifthen","",{area:true})}
    <p class="small">94개의 연구를 모아 본 결과, “이럴 때는 이렇게 하겠다”를 미리 정해 둔 사람들이 목표를 훨씬 더 잘 이루었습니다(실행 의도). 가리고 싶은 바로 그 순간에, 참된 말로 흐르도록 미리 길을 내 두는 것입니다.</p>
    <div id="cardbox" class="cardbox"><p class="small">카드를 만드는 중입니다…</p></div>
    <button type="button" class="btn" data-act="cardSave">${IC.pen}배경화면으로 저장</button>
    <p class="small">카드에는 내 문장을 넣지 않고 말씀만 둡니다. 저장이 되지 않으면 카드를 길게 눌러 저장하세요.</p>`; }
  if(step===7) body=`<h3 class="h3">7. 다시 재기</h3>
    ${sn.belief?`<p class="serif">“${esc(sn.belief)}”</p>${sn.pct!=null?`<p class="small">화요일에 이 믿음을 믿었던 정도: <b>${sn.pct}</b></p>`:""}${fRange(n,"belief4","빛 가운데 서고 난 지금, 이 믿음을 얼마나 믿나요?",{min:0,max:100,step:5,lo:"전혀",hi:"완전히"})}`:`<p class="empty">화요일에 찾은 믿음이 여기에 나타납니다.</p>`}

  const can=(step===1&&(sn.said||F(n,"scene4","")))||(step===2&&name)||step===3||(step===4&&vid)||step>=5;
  const wiz=`<div class="wiz-steps" aria-hidden="true">${[1,2,3,4,5,6,7].map(i=>`<i class="${i<=step?"on":""}"></i>`).join("")}</div>${body}
    <div class="row" style="margin-top:16px">${step>1?`<button type="button" class="btn" data-wiz="prev">이전</button>`:""}${step<7?`<button type="button" class="btn primary" data-wiz="next" ${can?"":"disabled"}>다음</button>`:""}</div>`;

  <section class="layer" id="L2">${layerHead(n,2,"에서의 옷","")}
    <p>“이삭은 에서를 사랑했다”(창 25:28). 아버지의 사랑과 복이 향하는 이름은 늘 ‘에서’였습니다. 그래서 그날 야곱은 에서가 됩니다. 형의 옷을 입고, 염소 가죽으로 손을 덮고, “저는 아버지의 맏아들 에서입니다.”</p>
    <details class="voice"><summary><span class="nm">창세기 27장 — 에서의 옷</span></summary>${scriptureHTML("gen27")}</details>
    <p>옷은 바꿔 입어도 목소리까지 바꿀 수는 없었습니다. “목소리는 야곱의 목소리인데, 손은 에서의 손이구나”(27:22). 그리고 그 복은 야곱이 아니라 에서에게 빌어진 말이었습니다.</p>
    ${fChips(n,"coat","내가 입어 온 ‘에서의 옷’ — 사람들 앞에서 나는 이런 사람이어야 한다고 느낀다",ESAU,{multi:true,hint:"여럿 골라도 됩니다."})}
    ${fChips(n,"applause","그 옷으로 박수를 받을 때, 내 마음은",["기뻤지만 허전했다","들킬까 불안했다","지쳤다","편했다","잘 모르겠다"],{multi:true})}
    <details class="voice"><summary><span class="nm">창세기 32장 — 네 이름이 무엇이냐</span></summary>${scriptureHTML("gen32")}</details>

}

/* ---------- 2주 5일째 — 두려움 없는 말 ---------- */
function vW2Day5(){
  const n=5; const sd=w2Side(); const m=sd.m; const lv=v=>v==null?"–":v<0.75?"낮음":v<1.25?"중간":"높음"; const sn=w2Scene();
  const partner=F(1,"partner_keep",null)==="same"?F1(1,"partner",""):F(1,"partner",""); const sig=F(1,"signal","")||F1(1,"signal",""); const vid=F(4,"verse",null);
  const msg = sd.answered<W2_SIDE.length ? "" : sd.top==="knife" ? "사실을 칼처럼 쓰는 쪽이 가장 큽니다. 말하기 전에 세 질문 가운데 ‘이 말을 들은 사람은 어떤 마음일까?’를 먼저 물어보세요. “사랑 안에서 참된 것을 말하며 자라 가라”(엡 4:15)."
    : sd.top==="silent" ? "말해야 할 때 입을 닫는 쪽이 가장 큽니다. 참된 말에는 용기가 필요합니다. 하나님은 “참된 것을 말하여라” 하시기 전에 두 번 “두려워하지 마라” 하셨습니다(슥 8:13, 15). 용기는 타고나는 게 아니라 구하는 것입니다."
    : "나를 지키려고 가리는 쪽이 가장 큽니다. 오늘 만들 문장이 특히 필요한 자리입니다.";
  const fact=F(n,"o_fact","")||""; const feel=F(n,"o_feel",[])||[]; const need=F(n,"o_need",[])||[]; const req=F(n,"o_req",null)||F(n,"o_req_own","");
  const bad=/항상|원래|맨날|늘 그래|매번/.test(fact);
  const ready = fact && feel.length;
  return dayShell(n, calmLayer(n)+`
  <section class="layer" id="L2">${layerHead(n,2,"참된 말에서 나는 어느 쪽으로","")}
    <p>참된 말이 ‘사실이면 다 말해도 된다’는 뜻은 아닙니다. 참된 말에서 벗어나는 길은 하나가 아닙니다. 나를 지키려고 <b>가리기도</b> 하고, 사실을 <b>칼처럼 쓰기도</b> 하고, 말해야 할 때 <b>입을 닫기도</b> 합니다.</p>
    <p class="small">지난 몇 주를 떠올리며, 떠오르는 대로 누르세요.</p>
    ${W2_SIDE.map(p=>`<div class="phrase"><div class="t">${p.t}</div>${fSeg(n,"sd_"+p.id,["거의 안 한다","가끔","자주"])}</div>`).join("")}
    ${sd.answered===W2_SIDE.length?`<div class="bars" style="margin-top:14px">${["hide","knife","silent"].map(k=>`<div class="bar ${k===sd.top?"top":""}"><span class="nm">${W2_SIDES[k].nm}</span><span class="tr"><span class="tk ${k==="hide"?"in":"out"}"><i style="width:${m[k]==null?0:m[k]/2*100}%"></i></span><span class="small">${lv(m[k])} · ${W2_SIDES[k].d}</span></span></div>`).join("")}</div>
      <div class="panel soft"><p class="ph">내가 자주 벗어나는 쪽</p><p>${msg}</p>${m.hide==null?`<p class="small">가리는 쪽은 2일째 점검을 하면 함께 나옵니다.</p>`:""}</div>`:`<p class="small">${sd.answered} / ${W2_SIDE.length}</p>`}
    <div class="panel soft"><p class="ph">말하기 전 세 질문</p><p>이 말은 실제와 같은 그림인가? 이 말을 들은 사람은 어떤 마음일까? 그 사람을 살리려는 말인가?</p><p class="small">“함부로 내뱉는 말은 칼로 찌르는 것 같지만, 지혜로운 사람의 혀는 사람을 낫게 한다”(잠 12:18). 나를 해치는 관계라면 그 사람 앞에서 다 드러내야 할 의무는 없습니다. 먼저 안전한 사람에게 말하는 것이 지혜입니다.</p></div>
    ${doneBar(n,2)}</section>

    <p><b>질문 4</b> — 누군가 무거운 이야기를 꺼내도, 그 자리에서 더 묻거나 풀어 주려 하지 않습니다. “말해 줘서 고마워요”로 받고, 모임 뒤에 따로 연락합니다.</p>
    <p><b>누군가에게 해를 입은 일을 꺼내는 분이 있을 때</b> — 그것은 ‘가리는 말’의 문제가 아닙니다. 판단 없이 듣고, 목회자에게 연결합니다.</p>
    <p><b>시간</b> — 60분을 넘기지 않습니다.</p></details>`;
}

/* ---------- 내 말의 지도 — 2주 ---------- */
function w2MapHTML(){
  const sc=w2Scores(); const tot=sigTotals(); const sn=w2Scene(); const any=sc.answered||Object.keys(S.w2.sig||{}).length||sn.said;
  if(!any) return `<p class="empty">2주에 채워집니다.</p>`;
  const coats=F(4,"coat",[],2)||[]; const nm=F(4,"name",null,2); const vid=F(4,"verse",null,2);
  return `${sc.top.length?`<p>내가 가장 자주 쓰는 가리는 말 — <b>${sc.top.map(k=>W2_SHAPES[k].nm).join(", ")}</b></p>`:""}
  ${sc.mAns===W2_MD.length?`<p class="small">가리는 마음 — ${Object.keys(W2_MINDS).map(k=>`${W2_MINDS[k].nm} ${sc.m[k].toFixed(1)}`).join(" · ")} (0–4)</p>`:""}
  ${w2Side().answered===W2_SIDE.length?`<p class="small">참된 말에서 자주 벗어나는 쪽 — ${W2_SIDES[w2Side().top].nm}</p>`:""}
  ${sn.belief?`<p>가림 밑의 믿음 — “${esc(sn.belief)}” <span class="small">${[sn.pct,F(4,"belief4",null,2),F(6,"belief6",null,2)].map(v=>v==null?"–":v).join(" → ")}</span></p>`:""}
  <p class="small">이번 주 신호어 — ${SIGS.map(s=>`“${s.t}” ${tot[s.id]}`).join(" · ")}</p>
  ${coats.length&&nm?`<p>이름 고백 — <span class="serif">저는 ${coats.map(esc).join(", ")}이 아닙니다. 저는 ${esc(nm)}입니다.</span></p>`:""}
  ${vid?`<p>빛 가운데의 말씀</p>${verseHTML(vid,{name:S.name})}`:""}`;
}

VIEWS_W[2] = [null, vW2Day1, vW2Day2, vW2Day3, vW2Day4, vW2Day5, vW2Day6];
/* ====================== 오늘의 세 걸음 — 1주 설교의 회복 방식: 알아채기 → 말씀을 나에게 → 새 말 ====================== */
const BELIEF_V={"잘 보여야 사랑받는다":"ijn4_19","실수하면 끝이다":"ijn1_9","약해 보이면 안 된다":"ps32_5","있는 그대로의 나는 부족하다":"isa43_4","하나님도 나에게 실망하실 것이다":"gen28_15","잘 모르겠다":"ijn1_7"};
function tsInfo(n,w){
  w=w||CW; const said=F(n,"ts_said",null,w), own=F(n,"ts_own","",w), none=said==="none";
  if(w===2){
    const sc=w2Scores(); const ph=W2_PH.find(p=>p.t===said); const sg=SIGS.find(s=>`“${s.t}”`===said);
    const kind = ph?ph.s : sg?(sg.id==="but"?"excuse":"exag") : (!said&&own) ? F(n,"ts_shape",null,w) : (none?(sc.top[0]||null):null);
    const topM=Object.keys(W2_MINDS).filter(k=>sc.m[k]!=null).sort((a,b)=>sc.m[b]-sc.m[a])[0];
    const b3=F(2,"belief",null,2)||F(3,"belief",null,2);
    const verse = b3&&BELIEF_V[b3] ? BELIEF_V[b3] : (topM&&sc.m[topM]>=1.5 ? W2_MINDS[topM].v : "ijn1_7");
    return {opts:[...sc.picks.map(p=>p.t), ...SIGS.map(s=>`“${s.t}”`)], askKind:!said&&!!own, kindKey:"ts_shape", kindLbl:"어떤 모양에 가까운가요?", kinds:Object.entries(W2_SHAPES).map(([k,s])=>({v:k,t:s.nm})), kind, verse, news: kind?W2_SHAPES[kind].re:[]};
  }
  const v1=voiceScores();
  const kind = typeOfText(said) || ((!said&&own) ? F(n,"ts_type",null,w) : (none?(v1.top[0]||null):null));
  const picks=PHRASES.filter(p=>(F1(2,"ph_"+p.id,0)||0)>0).map(p=>p.t);
  return {opts: picks.length?picks:TYPES.map(x=>x.self), askKind:!said&&!!own, kindKey:"ts_type", kindLbl:"그 말 밑의 마음은?", kinds:TYPES.map(x=>({v:x.id,t:x.nm})), kind, verse: kind?TYPE[kind].answer:"isa43_1", news: kind?NEWW[kind]:[]};
}
function threeSteps(n){
  const I=tsInfo(n);
  return `<div class="panel soft" style="margin:6px 0 16px"><p class="ph">오늘의 세 걸음</p><p class="small">1주 설교에서 배운 회복의 방식 — 내 말을 알아채고, 하나님의 말씀을 나에게 들려주고, 새 말을 합니다.</p>
    ${fChips(n,"ts_said","① 오늘 알아챈 말 — 가장 가까운 것 하나",[...I.opts.map(o=>({v:o,t:o})),{v:"none",t:"오늘은 없었어요"}])}
    ${fText(n,"ts_own","보기에 없으면 그대로 적기 (선택)")}
    ${I.askKind?fChips(n,I.kindKey,I.kindLbl,I.kinds):""}
    <div class="lbl" style="margin-top:14px">② 그 말 앞에서, 하나님의 말씀을 나에게</div>
    ${verseHTML(I.verse,{name:S.name})}
    ${fChips(n,"ts_heard","",[{v:"yes",t:"소리 내어 나에게 들려줬어요"}])}
    ${I.news.length?fChips(n,"ts_new","③ 오늘의 새 말 — 하나 고르세요",I.news):`<div class="lbl" style="margin-top:14px">③ 오늘의 새 말</div>`}
    ${fText(n,"ts_new_own",I.news.length?"내 말로 고쳐 쓰기 (선택)":"오늘 하려는 새 말")}
    ${fChips(n,"ts_done","저녁에 — 새 말을",["말했어요","아직이에요"])}
  </div>`;
}
function tsWeekHTML(w){
  const rows=[1,2,3,4,5,6].map(d=>{ const s=F(d,"ts_said",null,w), o=F(d,"ts_own","",w); if(!s&&!o) return "";
    const I=tsInfo(d,w); const said = s==="none"?"(알아챈 말 없음)":(s||o); const nw=F(d,"ts_new",null,w)||F(d,"ts_new_own","",w);
    return `<tr><td>${d}일째</td><td>${esc(said)}</td><td>${VERSES[I.verse]?VERSES[I.verse].ref:""}${F(d,"ts_heard",null,w)?" · 들려줌":""}</td><td>${esc(nw||"")}${F(d,"ts_done",null,w)==="말했어요"?" · 말함":""}</td></tr>`; }).join("");
  return rows?`<div class="tablewrap"><table class="simple"><tr><th>날</th><th>① 알아챈 말</th><th>② 들려준 말씀</th><th>③ 새 말</th></tr>${rows}</table></div>`:`<p class="empty">날마다 마무리의 ‘오늘의 세 걸음’이 여기에 모입니다.</p>`;
}
function methodPanel(w){
  return `<div class="panel soft"><p class="ph">말이 회복되는 세 걸음 — 1주 설교에서</p>
   <p>① <b>알아채기</b> — 옛 말을 벗으려면, 먼저 내가 무엇을 입고 있는지 알아야 합니다(골 3:8).${w===2?" 이번 주에는 가리는 말을.":""}<br>
   ② <b>말씀을 나에게 들려주기</b> — 그리스도의 말씀이 내 안에 집을 삼아 머물게 합니다(골 3:16).${w===2?" 이번 주에는 그 밑의 두려움 앞에서.":""}<br>
   ③ <b>새 말 하기</b> — 옛 말 옆에, 주님이시라면 해 주셨을 말을(골 3:12–14).${w===2?" 이번 주에는 실제와 같은 그림으로, 한 문장 더.":""}</p>
   <p class="small">날마다 마지막 단계의 ‘오늘의 세 걸음’으로 연습합니다.</p></div>`;
}


function view(){
  const r=route(); CW=1;
  if(!S.onboarded && r[0]!=="intro" && r[0]!=="finish-intro") return vIntro(0);
  switch(r[0]){
    case undefined: CW=homeWeek(); return vHome();
    case "intro": return vIntro(r[1]);
    case "week": CW=+r[1]||1; return CW===2 ? vWeek2() : vWeek(r[1]);
    case "day": { const W=+r[1]||1, n=Math.min(6,Math.max(1,+r[2]||1)); CW=W; if(!VIEWS_W[W]) return vWeek(W); return VIEWS_W[W][n](); }
    case "group": { const W=+r[1]||1; CW=W; return W===1 ? vGroup() : W===2 ? vGroup2() : vWeek(W); }
    case "log": return vLog();
    case "more": return vMore();
    case "library": return vLibrary();
    case "tools5": return vTools5();
    case "guide": return vGuide();
    case "help": return vStop();
    case "settings": return vSettings();
    case "map": return vMap();
    case "sources": return vSources();
    default: return vHome();
  }
}
function chrome(){
  const r=route(); const tab=currentTab(r); const intro=!S.onboarded||r[0]==="intro";
  let tb=$(".tabbar"), fab=$(".fab");
  fab&&fab.remove();
  if(intro || r[0]==="day"){ tb&&tb.remove(); return; }
  if(!tb){ tb=document.createElement("nav"); tb.className="tabbar"; tb.setAttribute("aria-label","주요 메뉴"); document.body.appendChild(tb); }
  tb.innerHTML=`<div class="in">${[["home","오늘","#/"],["more","더보기","#/more"]].map(([k,t,h])=>`<button type="button" data-go="${h}" ${tab===k?'aria-current="page"':""}>${IC[k]}${t}</button>`).join("")}</div>`;
}
let lastRoute="";
function render(keepScroll){
  const y=window.scrollY; const r=location.hash;
  $("#app").innerHTML=view(); chrome();
  if(keepScroll && r===lastRoute) window.scrollTo(0,y); else window.scrollTo(0,0);
  lastRoute=r;
  if(route()[0]==="day" && +route()[2]===4 && F(4,"step",1)===6) renderCard();
  const h1=$(".topbar h1"); document.title = (h1?h1.textContent+" — ":"") + SERIES.title;
}
async function renderCard(){
  const box=$("#cardbox"); const vid=F(4,"verse",null); if(!box||!vid) return;
  const c=await makeCard(vid);
  if(!c){ box.innerHTML=`<div class="panel soft">${verseHTML(vid,{name:S.name})}<p class="small">이 기기에서는 카드 그림을 만들 수 없습니다. 이 화면을 캡처해 배경화면으로 쓰셔도 됩니다.</p></div>`; return; }
  const url=c.toDataURL("image/png");
  box.innerHTML=`<img class="card-preview" src="${url}" alt="말씀 카드: ${esc(VERSES[vid].t)}">`;
  box.dataset.ready="1"; box._canvas=c;
}

/* ---------- 이벤트 ---------- */
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.f){ const [n,k]=t.dataset.f.split("|"); setF(+n,k,t.value); if(n==="2"&&k==="own"){ clearTimeout(t._rt); t._rt=setTimeout(()=>{},0);} }
  if(t.dataset.r){ const [n,k]=t.dataset.r.split("|"); setF(+n,k,+t.value); const o=t.parentElement.querySelector("output"); if(o) o.textContent=t.value; t.setAttribute("aria-valuetext",t.value); }
  if(t.hasAttribute("data-name")){ S.name=t.value.trim(); save(); }
  if(t.dataset.g){ S["w"+CW].group[t.dataset.g]=t.value; save(); }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.f && (t.dataset.f==="2|own" || /\|(ts_own|scene_own|o_fact|scene4)$/.test(t.dataset.f))) render(true);
  if(t.hasAttribute("data-name") && route()[0]==="day") render(true);
  if(t.dataset.r){ const [n,k]=t.dataset.r.split("|"); if((n==="6"&&k==="belief6")||(n==="6"&&k.startsWith("t_"))||k==="belief_pct"||k==="belief_after"||k==="belief4") render(true); }
  if(t.id==="imp" && t.files && t.files[0]){
    const fr=new FileReader(); fr.onload=()=>{ try{ const data=JSON.parse(fr.result); if(!data||data.v!==1) throw 0; if(confirm("지금 이 기기의 기록을 불러온 기록으로 바꿀까요?")){ S=Object.assign(DEF(),data); save(); applySettings(); render(); toast("불러왔습니다"); } }catch(err){ toast("이 앱에서 내보낸 기록 파일이 아닙니다"); } };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-go],[data-act],[data-chip],[data-seg],[data-done],[data-prev],[data-dx],[data-sig],[data-set],[data-jump],[data-wiz],[data-wiz-set],[data-read],[data-fill]");
  if(!el) return;
  const ds=el.dataset;
  if(ds.go){ if(ds.go==="#/finish-intro"){ S.onboarded=true; save(); location.hash="#/"; return; } if(location.hash===ds.go) render(); else location.hash=ds.go; return; }
  if(ds.jump){ const t=document.getElementById(ds.jump); if(t) t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"}); return; }
  if(ds.chip){ const [n,k,multi]=ds.chip.split("|"); const val=ds.val;
    if(multi==="1"){ const cur=[...F(+n,k,[])]; const i=cur.indexOf(val); if(i>=0) cur.splice(i,1); else cur.push(val); setF(+n,k,cur); }
    else { setF(+n,k, F(+n,k,null)===val? null : val); }
    render(true); return; }
  if(ds.fill){ const [n,k]=ds.fill.split("|"); setF(+n,k,ds.val); render(true); return; }
  if(ds.seg){ const [n,k]=ds.seg.split("|"); let v=+ds.val; if(k==="skipOrigins") v=!!v; setF(+n,k,v); render(true); return; }
  if(ds.done){ const [n,L]=ds.done.split("|").map(Number); const d=D(n); d.done[L]=true; save();
    if(L<4){ setF(n,"cur",L+1); render(); }
    else { setF(n,"cur",1); toast(`${CW>1?CW+"주 ":""}${n}일째 순서를 모두 마쳤습니다`); location.hash="#/"; }
    return; }
  if(ds.sig){ const k=todayKey(); S.w2.sig=S.w2.sig||{}; const d=S.w2.sig[k]=S.w2.sig[k]||{}; d[ds.sig]=(d[ds.sig]||0)+1; save(); const s=SIGS.find(x=>x.id===ds.sig); toast(`“${s?s.t:""}” — 지금 내가 가리는 게 있나요?`); render(true); return; }
  if(ds.dx){ const v=Math.max(1,Math.min(4,F(2,"dx",1)+(ds.dx==="next"?1:-1))); setF(2,"dx",v); render(); return; }
  if(ds.prev){ const [n,L]=ds.prev.split("|").map(Number); setF(n,"cur",Math.max(1,L-1)); render(); return; }
  if(ds.set){ const [k,v]=ds.set.split("|"); if(k==="chime") S.settings.chime = v==="1"; else S.settings[k]=v; save(); applySettings(); render(true); return; }
  if(ds.wiz){ const s=F(4,"step",1); setF(4,"step", Math.max(1,Math.min(7, s+(ds.wiz==="next"?1:-1)))); render(true); const L3=document.getElementById("L3"); L3&&L3.scrollIntoView({block:"start"}); return; }
  if(ds.wizSet){ setF(4, ds.wizSet, ds.val); if(ds.wizSet==="pair"){ setF(4,"ifthen",null); setF(4,"cat",null); } if(ds.wizSet==="verse") setF(4,"ifthen",null); render(true); return; }
  if(ds.read){ const k="read"+ds.read; setF(4,k,!F(4,k,false)); render(true); return; }
  const a=ds.act;
  if(a==="calm"){ openCalm(+ds.day||currentDay()); return; }
  if(a==="log"){ openLogSheet(); return; }
  if(a==="logEdit"){ openLogSheet(ds.id); return; }
  if(a==="partner"){ openPartnerView(ds.v); return; }
  if(a==="copy"){ copyText(ds.text); return; }
  if(a==="reveal"){ setF(6,"revealed",true); render(true); return; }
  if(a==="cardSave"){ const box=$("#cardbox"); if(!box||!box._canvas){ toast("카드를 만드는 중입니다"); return; }
    box._canvas.toBlob(async b=>{ const ok=await saveFile("기록되었으되_카드.png", b); if(!ok) toast("카드를 길게 눌러 저장해 주세요"); }, "image/png"); return; }
  if(a==="export"){ const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const d=new Date(); const ok=await saveFile(`깊은샘_내기록_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`, b); if(!ok){ copyText(JSON.stringify(S)); } return; }
  if(a==="reset"){ if(confirm("이 기기의 모든 기록을 지울까요? 되돌릴 수 없습니다.") && confirm("정말 지울까요?")){ S=DEF(); S.onboarded=true; save(); applySettings(); render(); toast("모두 지웠습니다"); } return; }
});
window.addEventListener("hashchange", ()=>render());
window.addEventListener("scroll", ()=>{ const tb=$(".topbar"); if(tb) tb.classList.toggle("scrolled", window.scrollY>4); }, {passive:true});

/* ---------- 시작 ---------- */
load(); applySettings(); render();
