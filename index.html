  if(!c){ box.innerHTML=`<div class="panel soft">${verseHTML(vid,{name:S.name})}<p class="small">이 기기에서는 카드 그림을 만들 수 없습니다. 이 화면을 캡처해 배경화면으로 쓰셔도 됩니다.</p></div>`; return; }
  const url=c.toDataURL("image/png");
  box.innerHTML=`<img class="card-preview" src="${url}" alt="말씀 카드: ${esc(VERSES[vid].t)}">`;
  box.dataset.ready="1"; box._canvas=c;
}

/* ---------- 이벤트 ---------- */
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.f){ const [n,k]=t.dataset.f.split("|"); setF(+n,k,t.value); if(n==="2"&&k==="own"){ clearTimeout(t._rt); t._rt=setTimeout(()=>{},0);} }
  if(t.dataset.r){ const [n,k]=t.dataset.r.split("|"); setF(+n,k,+t.value); const o=t.parentElement.querySelector("output"); if(o) o.textContent=t.value; t.setAttribute("aria-valuetext",t.value); }
  if(t.hasAttribute("data-name")){ S.name=t.value.trim(); save(); }
  if(t.dataset.g){ const o=wStore(CW); o.group[t.dataset.g]=t.value; save(); }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.f && (t.dataset.f==="2|own" || /\|(ts_own|scene_own|o_fact|scene4|law[123]|wit_see|wit_feel|wit_ask|apo|pl_when_own|pl_old_own|pl_new|kp_who|bl_daily_own|bs_[123]|lr[123]|ya_t|ya_old|tr[123]|ab_to|ab_about|pt_own)$/.test(t.dataset.f))) render(true);
  if(t.hasAttribute("data-name") && route()[0]==="day") render(true);
  if(t.dataset.r){ const [n,k]=t.dataset.r.split("|"); if((n==="6"&&k==="belief6")||(n==="6"&&k.startsWith("t_"))||k==="belief_pct"||k==="belief_after"||k==="belief4") render(true); }
  if(t.id==="imp" && t.files && t.files[0]){
    const fr=new FileReader(); fr.onload=()=>{ try{ const data=JSON.parse(fr.result); if(!data||data.v!==1) throw 0; if(confirm("지금 이 기기의 기록을 불러온 기록으로 바꿀까요?")){ S=Object.assign(DEF(),data); save(); applySettings(); render(); toast("불러왔습니다"); } }catch(err){ toast("이 앱에서 내보낸 기록 파일이 아닙니다"); } };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-step],[data-wk],[data-go],[data-act],[data-chip],[data-seg],[data-done],[data-prev],[data-dx],[data-sig],[data-set],[data-jump],[data-wiz],[data-wiz-set],[data-read],[data-fill]");
  if(!el) return;
  const ds=el.dataset;
  if(ds.act==="path"){ S.settings=S.settings||{}; S.settings.path=ds.v; save(); render(true); return; }
  if(ds.go){ if(ds.go==="#/finish-intro"){ S.onboarded=true; save(); location.hash="#/"; return; } if(location.hash===ds.go) render(); else location.hash=ds.go; return; }
  if(ds.jump){ const t=document.getElementById(ds.jump); if(t) t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"}); return; }
  if(ds.chip){ const [n,k,multi]=ds.chip.split("|"); const val=ds.val;
    if(multi==="1"){ const cur=[...F(+n,k,[])]; const i=cur.indexOf(val); if(i>=0) cur.splice(i,1); else cur.push(val); setF(+n,k,cur); }
    else { setF(+n,k, F(+n,k,null)===val? null : val); }
    render(true); return; }
  if(ds.fill){ const [n,k]=ds.fill.split("|"); setF(+n,k,ds.val); render(true); return; }
  if(ds.seg){ const [n,k]=ds.seg.split("|"); let v=+ds.val; if(k==="skipOrigins") v=!!v; setF(+n,k,v); render(true); return; }
  if(ds.done){ const [n,L]=ds.done.split("|").map(Number); const d=D(n); d.done[L]=true; save();
    if(L<4){ setF(n,"cur",L+1); render(); }
    else { setF(n,"cur",1); toast(`${CW>1?CW+"주 ":""}${n}일째 순서를 모두 마쳤습니다`); location.hash="#/"; }
    return; }
  if(ds.sig){ const k=todayKey(); const SG=W2SIG(); const d=SG[k]=SG[k]||{}; d[ds.sig]=(d[ds.sig]||0)+1; save(); toast(sigToast(ds.sig)); render(true); return; }
  if(ds.dx){ const v=Math.max(1,Math.min(4,F(2,"dx",1)+(ds.dx==="next"?1:-1))); setF(2,"dx",v); render(); return; }
  if(ds.prev){ const [n,L]=ds.prev.split("|").map(Number); setF(n,"cur",Math.max(1,L-1)); render(); return; }
  if(ds.step){ const [n,L]=ds.step.split("|").map(Number); if(F(n,"cur",null)!==L){ setF(n,"cur",L); render(); } return; }
  if(ds.wk){ setSelWeek(+ds.wk); render(); return; }
  if(ds.set){ const [k,v]=ds.set.split("|"); if(k==="chime") S.settings.chime = v==="1"; else S.settings[k]=v; save(); applySettings(); render(true); return; }
  if(ds.wiz){ const s=F(4,"step",1); setF(4,"step", Math.max(1,Math.min(7, s+(ds.wiz==="next"?1:-1)))); render(true); const L3=document.getElementById("L3"); L3&&L3.scrollIntoView({block:"start"}); return; }
  if(ds.wizSet){ setF(4, ds.wizSet, ds.val); if(ds.wizSet==="pair"){ setF(4,"ifthen",null); setF(4,"cat",null); } if(ds.wizSet==="verse") setF(4,"ifthen",null); render(true); return; }
  if(ds.read){ const k="read"+ds.read; setF(4,k,!F(4,k,false)); render(true); return; }
  const a=ds.act;
  if(a==="install"){ if(INST.prompt){ const p=INST.prompt; p.prompt(); Promise.resolve(p.userChoice).then(()=>{ INST.prompt=null; render(true); }); } return; }
  if(a==="instLater"){ S.settings.instLater=true; save(); toast("설정 화면에서 언제든 다시 볼 수 있습니다"); render(true); return; }
  if(a==="openExternal"){ location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(location.href); return; }
  if(a==="calm"){ openCalm(+ds.day||currentDay()); return; }
  if(a==="log"){ openLogSheet(); return; }
  if(a==="logEdit"){ openLogSheet(ds.id); return; }
  if(a==="partner"){ openPartnerView(ds.v); return; }
  if(a==="copy"){ copyText(ds.text); return; }
  if(a==="reveal"){ setF(6,"revealed",true); render(true); return; }
  if(a==="cardSave"){ const box=$("#cardbox"); if(!box||!box._canvas){ toast("카드를 만드는 중입니다"); return; }
    box._canvas.toBlob(async b=>{ const ok=await saveFile("기록되었으되_카드.png", b); if(!ok) toast("카드를 길게 눌러 저장해 주세요"); }, "image/png"); return; }
  if(a==="export"){ const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const d=new Date(); const ok=await saveFile(`깊은샘_내기록_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`, b); if(!ok){ copyText(JSON.stringify(S)); } return; }
  if(a==="reset"){ if(confirm("이 기기의 모든 기록을 지울까요? 되돌릴 수 없습니다.") && confirm("정말 지울까요?")){ S=DEF(); S.onboarded=true; save(); applySettings(); render(); toast("모두 지웠습니다"); } return; }
});
window.addEventListener("hashchange", ()=>render());
window.addEventListener("scroll", ()=>{ const tb=$(".topbar"); if(tb) tb.classList.toggle("scrolled", window.scrollY>4); }, {passive:true});

/* ---------- 시작 ---------- */
load(); applySettings(); render();

</script>
