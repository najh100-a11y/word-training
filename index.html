<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="진실한숲교회 2026년 10월 설교 시리즈 「말의 구원 — 깊은 샘에서 흘러나오는 말」 4주 워크북">
<meta name="theme-color" content="#F3ECDB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1B28" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="말의 구원">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>말의 구원 — 깊은 샘에서 흘러나오는 말</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/DeepspringSans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/GowunBatang-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Gowun Batang";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/GowunBatang-400.woff2") format("woff2");}
@font-face{font-family:"Gowun Batang";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/GowunBatang-700.woff2") format("woff2");}
@font-face{font-family:"Deepspring Sans";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/DeepspringSans-400.woff2") format("woff2");}
@font-face{font-family:"Deepspring Sans";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/DeepspringSans-600.woff2") format("woff2");}
:root{
  --paper:#F3ECDB; --sheet:#FBF7EC; --ink:#1C2942; --ink-soft:#4A5670; --muted:#7A8194;
  --ochre:#9C6A1E; --ochre-soft:#E9D9B8; --teal:#1E7068; --teal-soft:#D5E7E3; --teal-ink:#FFFFFF;
  --line:#DDD2BA; --deep:#16405C; --deep-2:#0C2436; --warn:#8A3B2E; --warn-soft:#F2DCD5;
  --serif:"Gowun Batang","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --sans:"Deepspring Sans","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --base:17px; --r-s:10px; --r-m:14px; --r-l:22px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1B28; --sheet:#152536; --ink:#ECE4D2; --ink-soft:#C3BCAC; --muted:#8C93A3;
    --ochre:#D6A452; --ochre-soft:#3A3122; --teal:#56B3A7; --teal-soft:#1B3A3A; --teal-ink:#0F1B28;
    --line:#2A3B4E; --deep:#0E3048; --deep-2:#071826; --warn:#E39A88; --warn-soft:#3A2420;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1B28; --sheet:#152536; --ink:#ECE4D2; --ink-soft:#C3BCAC; --muted:#8C93A3;
  --ochre:#D6A452; --ochre-soft:#3A3122; --teal:#56B3A7; --teal-soft:#1B3A3A; --teal-ink:#0F1B28;
  --line:#2A3B4E; --deep:#0E3048; --deep-2:#071826; --warn:#E39A88; --warn-soft:#3A2420;
  color-scheme: dark;
}
:root[data-size="l"]{ --base:20px; }

*{box-sizing:border-box}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); background:var(--paper); }
body{ margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:var(--base); line-height:1.65; -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:anywhere; }
img{ max-width:100%; }
button,input,textarea,select{ font:inherit; color:inherit; }
a{ color:var(--teal); }
:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; border-radius:6px; }

/* ---------- 골격 ---------- */
#app{ max-width:600px; margin:0 auto; min-height:100vh; padding:0 20px 168px; }
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--paper); margin:0 -20px; padding:12px 20px 10px; display:flex; align-items:center; gap:12px; border-bottom:1px solid transparent; }
.topbar.scrolled{ border-bottom-color:var(--line); }
.topbar .back{ border:0; background:none; padding:6px 8px 6px 0; font-size:1.05em; color:var(--ink-soft); cursor:pointer; min-height:44px; }
.topbar h1{ font-family:var(--serif); font-weight:700; font-size:1.08em; margin:0; flex:1; min-width:0; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar .sub{ white-space:nowrap; }
.topbar .sub{ font-size:.78em; color:var(--muted); }

.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--sheet); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
.tabbar .in{ max-width:600px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); }
.tabbar button{ border:0; background:none; padding:10px 4px 12px; font-size:.78em; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; min-height:58px; }
.tabbar button svg{ width:24px; height:24px; }
.tabbar button[aria-current="page"]{ color:var(--ink); font-weight:600; }
.tabbar button[aria-current="page"] svg{ color:var(--teal); }

.fab{ position:fixed; z-index:31; right:max(16px, calc(50% - 300px + 16px)); bottom:calc(76px + env(safe-area-inset-bottom,0px)); background:var(--teal); color:var(--teal-ink); border:0; border-radius:999px; padding:13px 20px 13px 16px; font-weight:600; font-size:.92em; display:flex; align-items:center; gap:8px; box-shadow:0 6px 18px rgba(12,36,54,.22); cursor:pointer; min-height:48px; }
.fab svg{ width:20px; height:20px; }

/* ---------- 글자 ---------- */
.serif{ font-family:var(--serif); }
.h-hero{ font-family:var(--serif); font-size:1.9em; line-height:1.35; letter-spacing:-.02em; margin:.2em 0 .5em; font-weight:700; }
.h2{ font-family:var(--serif); font-size:1.32em; line-height:1.4; margin:1.6em 0 .5em; font-weight:700; letter-spacing:-.01em; }
.h3{ font-size:1.02em; font-weight:600; margin:1.3em 0 .4em; }
.lead{ color:var(--ink-soft); }
.small{ font-size:.85em; color:var(--muted); }
p{ margin:.55em 0; }
.note{ font-size:.86em; color:var(--muted); margin-top:.6em; }

/* ---------- 말씀 ---------- */
.scripture{ margin:1.1em 0 1.3em; padding:.1em 0 .1em 16px; border-left:2px solid var(--ochre); font-family:var(--serif); font-size:1.06em; line-height:1.95; }
.scripture .ref{ display:block; font-family:var(--sans); font-size:.78em; color:var(--ochre); margin-bottom:.35em; font-weight:600; }
.scripture .v{ display:inline; }
.scripture .vn{ font-family:var(--sans); font-size:.68em; color:var(--ochre); font-weight:700; vertical-align:.25em; margin:0 .25em 0 .1em; }
.scripture b, .quote b{ font-weight:700; color:var(--ink); }
.scripture .var{ color:var(--muted); font-size:.9em; }
.gloss{ font-size:.84em; color:var(--muted); margin:-.6em 0 1em 18px; }
.quote{ font-family:var(--serif); font-size:1.08em; line-height:1.9; margin:1em 0; padding:0 0 0 16px; border-left:2px solid var(--ochre-soft); }
.quote .ref{ display:block; font-family:var(--sans); font-size:.78em; color:var(--ochre); margin-top:.3em; }
.speaker{ font-size:.8em; color:var(--ochre); font-weight:600; margin-bottom:.2em; }

/* ---------- 홈 ---------- */
.home-hero{ padding:18px 0 6px; }
.home-hero .week{ font-size:.86em; color:var(--muted); }
.home-hero .q{ font-family:var(--serif); font-size:1.62em; line-height:1.4; font-weight:700; margin:.25em 0 .7em; letter-spacing:-.02em; }
.today{ background:var(--sheet); border-radius:var(--r-l); padding:20px 20px 18px; border:1px solid var(--line); }
.today .day{ font-size:.85em; color:var(--teal); font-weight:600; }
.today .title{ font-family:var(--serif); font-size:1.28em; font-weight:700; margin:.15em 0 .6em; }
.today .line{ font-family:var(--serif); color:var(--ink-soft); font-size:1.02em; line-height:1.8; margin:0 0 1em; }
.weektabs{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:14px 0 4px; }
.weektabs button{ border:1px solid var(--line); background:transparent; border-radius:var(--r-m); padding:8px 2px 7px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--ink-soft); min-height:56px; font:inherit; }
.weektabs button b{ font-size:1.05em; color:var(--ink); }
.weektabs button .st{ font-size:.72em; color:var(--muted); line-height:1.25; text-align:center; word-break:keep-all; }
.weektabs button[aria-selected="true"]{ background:var(--teal); border-color:var(--teal); }
.weektabs button[aria-selected="true"] b, .weektabs button[aria-selected="true"] .st{ color:var(--teal-ink); }
.weektabs button.done:not([aria-selected="true"]){ background:var(--teal-soft); border-color:transparent; }
.weektabs button.now:not([aria-selected="true"]){ border:2px solid var(--teal); }
.weektabs button:disabled{ opacity:.45; cursor:default; }
.ytlink{ display:inline-flex; align-items:center; gap:8px; margin:0 0 14px; padding:7px 14px 7px 8px; border:1px solid var(--line); border-radius:999px; background:var(--sheet); color:var(--ink); text-decoration:none; font-size:.9em; }
.ytlink .ic{ width:26px; height:26px; border-radius:50%; background:var(--teal); color:var(--teal-ink); display:flex; align-items:center; justify-content:center; flex:none; }
.ytlink .ic svg{ width:12px; height:12px; margin-left:2px; }
.ytlink .tx{ line-height:1.35; }
.ytlink .t{ font-weight:600; white-space:nowrap; }
.ytlink .s{ color:var(--muted); white-space:nowrap; }
.strip button{ min-width:0; padding:0; }
.strip button.group{ white-space:nowrap; font-size:.72em; }
.strip button.group b{ font-size:1.1em; }
.strip{ display:flex; gap:8px; margin:18px 0 6px; }
.strip button{ flex:1; aspect-ratio:1/1.15; border-radius:var(--r-m); border:1px solid var(--line); background:transparent; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:.78em; color:var(--muted); min-height:52px; }
.strip button b{ font-size:1.25em; color:var(--ink); font-family:var(--serif); }
.strip button.done{ background:var(--teal-soft); border-color:transparent; }
.strip button.now{ border:2px solid var(--teal); }
.strip button.group{ flex:1.2; }

.wells{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin:10px 0; }
.wells span{ aspect-ratio:1; border-radius:50%; border:1.5px solid var(--line); display:block; position:relative; overflow:hidden; }
.wells span.full{ border-color:var(--deep); background:radial-gradient(circle at 50% 70%, #3F7EA3 0%, var(--deep) 70%); }
.wells span.locked{ opacity:.45; }
.wells-row{ display:flex; align-items:center; gap:10px; }
.wells-row .lbl{ width:34px; font-size:.78em; color:var(--muted); }

/* ---------- 버튼 ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; border:1.5px solid var(--teal); background:transparent; color:var(--teal); padding:12px 18px; font-weight:600; cursor:pointer; min-height:48px; text-decoration:none; }
.btn.primary{ background:var(--teal); color:var(--teal-ink); }
.btn.block{ width:100%; }
.btn.ghost{ border-color:transparent; padding-left:6px; padding-right:6px; }
.btn.warn{ border-color:var(--warn); color:var(--warn); }
.btn svg{ width:20px; height:20px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.row .btn{ flex:1; }

/* ---------- 오늘의 순서(날) ---------- */
.stepper{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 62px); z-index:15; background:var(--paper); margin:0 -20px; padding:6px 20px 10px; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.stepper a{ text-decoration:none; color:var(--muted); font-size:.78em; text-align:center; padding:8px 2px 6px; border-radius:10px; border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:2px; min-height:48px; justify-content:center; }
.stepper a .n{ font-family:var(--serif); font-weight:700; font-size:1.2em; color:var(--ink-soft); }
.stepper a.done{ background:var(--teal-soft); border-color:transparent; color:var(--ink); }
.stepper a.done .n{ color:var(--teal); }
.layer{ padding:8px 0 22px; border-bottom:1px solid var(--line); scroll-margin-top:130px; }
.layer:last-of-type{ border-bottom:0; }
.layer > .lh{ display:flex; align-items:baseline; gap:10px; margin:22px 0 4px; }
.layer > .lh .n{ font-family:var(--serif); font-size:1.5em; color:var(--teal); font-weight:700; line-height:1; }
.layer > .lh h2{ font-family:var(--serif); font-size:1.28em; margin:0; font-weight:700; }
.layer > .lh .min{ margin-left:auto; font-size:.8em; color:var(--muted); }
.donebar{ margin-top:22px; display:flex; gap:10px; justify-content:flex-end; }
.donebar .btn.primary{ flex:1; }
.flowbar{ margin:4px 0 18px; }
.flowbar .fb-n{ font-size:.8em; color:var(--muted); margin-bottom:6px; }
.fb-steps{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.fb-steps .fs{ font-size:.82em; text-align:center; padding:8px 4px; border-radius:var(--r-s); background:var(--sheet); border:1px solid var(--line); color:var(--muted); }
.fb-steps .fs.done{ color:var(--teal); border-color:var(--teal-soft); }
.fb-steps .fs.now{ background:var(--teal); color:var(--teal-ink); border-color:var(--teal); font-weight:700; }
.fb-steps button.fs{ font-family:inherit; line-height:1.3; cursor:pointer; min-height:40px; width:100%; }
.dayflow .layer{ display:none; }
.dayflow[data-cur="1"] #L1, .dayflow[data-cur="2"] #L2, .dayflow[data-cur="3"] #L3, .dayflow[data-cur="4"] #L4{ display:block; }
#lg-type{ display:grid; gap:8px; }
#lg-type .opt .tx{ font-weight:700; }
.donebar .btn{ min-width:150px; }
.donebar .btn.is-done{ background:var(--teal-soft); border-color:transparent; color:var(--ink); }

/* ---------- 입력 ---------- */
.field{ margin:14px 0; }
.field label, .field .lbl{ display:block; font-weight:600; font-size:.95em; margin-bottom:6px; }
.field .hint{ font-size:.83em; color:var(--muted); margin:-2px 0 6px; }
.field input[type=text], .field textarea, .field select{ width:100%; border:1.5px solid var(--line); background:var(--sheet); border-radius:var(--r-s); padding:12px 14px; min-height:48px; }
.field textarea{ min-height:88px; resize:vertical; line-height:1.6; }
.field input:focus, .field textarea:focus{ border-color:var(--teal); outline:none; }
.range{ display:flex; align-items:center; gap:12px; }
.range input[type=range]{ flex:1; accent-color:var(--teal); height:32px; }
.range output{ min-width:2.6em; text-align:right; font-family:var(--serif); font-weight:700; font-size:1.2em; color:var(--teal); }
.range-ends{ display:flex; justify-content:space-between; font-size:.78em; color:var(--muted); margin-top:-2px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ border:1.5px solid var(--line); background:var(--sheet); border-radius:999px; padding:9px 14px; cursor:pointer; min-height:44px; font-size:.93em; }
.chip[aria-pressed="true"]{ border-color:var(--teal); background:var(--teal-soft); color:var(--ink); font-weight:600; }
.seg{ display:grid; grid-template-columns:repeat(3,1fr); border:1.5px solid var(--line); border-radius:12px; overflow:hidden; }
.seg button{ border:0; background:var(--sheet); padding:10px 4px; cursor:pointer; font-size:.86em; min-height:44px; color:var(--ink-soft); }
.pathbar{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:6px 0 4px; }
.pathbar button{ border:1.5px solid var(--line); background:var(--sheet); border-radius:12px; padding:9px 6px; min-height:52px; font-size:.95em; color:var(--ink-soft); cursor:pointer; }
.pathbar button span{ display:block; font-size:.78em; margin-top:2px; }
.pathbar button[aria-pressed="true"]{ background:var(--teal); border-color:var(--teal); color:#fff; }
.pathnote{ margin:4px 0 10px; }
details.deep{ border:1.5px dashed var(--line); border-radius:12px; padding:6px 12px; margin:12px 0; }
details.deep > summary{ cursor:pointer; color:var(--ink-soft); font-size:.92em; min-height:40px; display:flex; align-items:center; }
details.deep[open] > summary{ margin-bottom:8px; }
.segn button{ font-size:.74em; padding:8px 2px; line-height:1.25; word-break:keep-all; }
.segends{ display:flex; justify-content:space-between; font-size:.74em; color:var(--ink-soft); margin-top:4px; }
.seg button + button{ border-left:1.5px solid var(--line); }
.seg button[aria-pressed="true"]{ background:var(--teal); color:var(--teal-ink); font-weight:600; }

.phrase{ padding:14px 0; border-bottom:1px solid var(--line); }
.phrase .t{ font-family:var(--serif); font-size:1.08em; margin-bottom:8px; }

/* ---------- 도구 패널 · 카드 ---------- */
.panel{ border:1.5px solid var(--teal); border-radius:var(--r-m); padding:16px 16px 12px; margin:16px 0; background:transparent; }
.panel.soft{ border-color:var(--line); background:var(--sheet); }
.panel.warn{ border-color:var(--warn); background:var(--warn-soft); }
.panel > .ph{ font-weight:700; margin:0 0 6px; }
.privacy{ font-size:.86em; color:var(--ink-soft); background:var(--sheet); border-radius:var(--r-s); padding:10px 14px; margin:12px 0; border:1px dashed var(--line); }
.stop{ font-size:.86em; color:var(--muted); margin:18px 0 0; padding-top:12px; border-top:1px dashed var(--line); }
.stop a{ color:var(--muted); }

.voice{ border-top:1px solid var(--line); padding:16px 0; }
.voice summary{ cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; min-height:44px; }
.voice summary::-webkit-details-marker{ display:none; }
.voice summary .nm{ font-family:var(--serif); font-weight:700; font-size:1.15em; }
.voice summary .mine{ margin-left:auto; font-size:.78em; color:var(--teal); font-weight:600; }
.voice dl{ margin:10px 0 0; display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:.93em; }
.voice dt{ color:var(--muted); }
.voice dd{ margin:0; }
.voice .answer{ margin-top:12px; }

.bars{ margin:14px 0 6px; }
.bar{ display:grid; grid-template-columns:7.2em 1fr; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
.bar .nm{ font-size:.9em; font-weight:600; }
.bar .tr{ display:grid; gap:5px; }
.bar .tk{ height:10px; border-radius:6px; background:var(--line); position:relative; overflow:hidden; }
.bar .tk i{ position:absolute; inset:0 auto 0 0; border-radius:6px; }
.bar .tk.out i{ background:var(--ochre); }
.bar .tk.in i{ background:var(--teal); }
.bar .tk b.avg{ position:absolute; top:0; bottom:0; width:3px; margin-left:-1px; background:var(--ink); opacity:.8; border-radius:2px; }
.bar.top .nm{ color:var(--teal); }
.legend{ display:flex; gap:16px; font-size:.8em; color:var(--muted); margin-top:6px; }
.legend i{ display:inline-block; width:12px; height:10px; border-radius:4px; margin-right:6px; vertical-align:-1px; }

.pairlist{ margin:10px 0; }
.pair{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); font-size:.93em; }
.pair .said{ font-family:var(--serif); }
.pair .voice-t{ color:var(--ink-soft); }
.pair .meta{ grid-column:1/-1; font-size:.78em; color:var(--muted); }
.pair .new-t{ grid-column:1/-1; font-family:var(--serif); color:var(--teal); border-left:3px solid var(--teal-soft); padding-left:10px; }
.empty{ color:var(--muted); font-size:.92em; padding:18px 0; text-align:left; }

.cmp{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0; }
.cmp .c{ border:1px solid var(--line); border-radius:var(--r-m); padding:12px; }
.cmp .c .k{ font-size:.8em; color:var(--muted); }
.cmp .c .v{ font-family:var(--serif); font-size:1.6em; font-weight:700; }

.line-chart{ width:100%; height:150px; }

/* ---------- 마법사(4일차) ---------- */
.wiz-steps{ display:flex; gap:5px; margin:12px 0 4px; }
.wiz-steps i{ flex:1; height:5px; border-radius:4px; background:var(--line); }
.wiz-steps i.on{ background:var(--teal); }
.wiz-title{ font-weight:700; margin:10px 0 4px; }
.optlist{ display:grid; gap:10px; margin:10px 0; }
.opt{ text-align:left; border:1.5px solid var(--line); background:var(--sheet); border-radius:var(--r-m); padding:14px; cursor:pointer; }
.opt[aria-pressed="true"]{ border-color:var(--teal); box-shadow:inset 0 0 0 1px var(--teal); }
.opt .speaker{ margin-bottom:4px; }

const KEY = "deepspring.v1";
const DEF = () => ({ v:1, name:"", onboarded:false, settings:{size:"m", chime:true, theme:"auto"}, logs:[], w1:{days:{}, group:{}}, calm:{} });
let S;
function load(){
  try{ const raw = localStorage.getItem(KEY); S = raw ? Object.assign(DEF(), JSON.parse(raw)) : DEF(); }
  catch(e){ S = DEF(); }
  S.settings = Object.assign(DEF().settings, S.settings||{});
  for(const k of ["w1","w2","w3","w4","w1b","w2b"]){ S[k] = S[k] || {days:{}, group:{}}; S[k].days = S[k].days||{}; S[k].group = S[k].group||{}; }
  S.logs = S.logs||[]; S.calm = S.calm||{};
}
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }, 150); }
/* 주(week) — 화면이 그려질 때 view()가 정한다. 1주 = S.w1, 2주 = S.w2 … */

const WEEK_START={1:"2026-10-04",2:"2026-10-11",3:"2026-10-18",4:"2026-10-25"};
/* 1 · 2주 새 판(2026-10-21)은 S.w1b · S.w2b에 저장한다. 첫 판의 S.w1 · S.w2는 지우지 않고 withOld()로만 읽는다. */
let OLDED=false;
function SKEY(w){ const W=w||CW; return (!OLDED&&(W===1||W===2))?"w"+W+"b":"w"+W; }
function withOld(fn){ const p=OLDED; OLDED=true; try{ return fn(); } finally{ OLDED=p; } }
function W2SIG(){ const o=wStore(2); o.sig=o.sig||{}; return o.sig; }
function calmKey(w,d){ return (!OLDED&&(w===1||w===2))?w+"b-"+d:w+"-"+d; }
function D(n,w){ const k=SKEY(w); S[k]=S[k]||{days:{},group:{}}; S[k].days=S[k].days||{}; S[k].days[n] = S[k].days[n] || {f:{}, done:{}}; const d=S[k].days[n]; d.f=d.f||{}; d.done=d.done||{}; return d; }
function F(n,k,dflt,w){ const v = D(n,w).f[k]; return v===undefined ? dflt : v; }
function F1(n,k,dflt){ return F(n,k,dflt,1); } /* 1주 2일째 점검처럼, 어느 주에서 불려도 1주를 읽어야 하는 값 */
function setF(n,k,v){ D(n).f[k]=v; save(); }

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function vocative(name){
  const n=(name||"").trim(); if(!n) return "";
  const c=n.charCodeAt(n.length-1);
  if(c>=0xAC00 && c<=0xD7A3){ return n + (((c-0xAC00)%28)?"아":"야"); }
  return n + ",";
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function applySettings(){
  const r=document.documentElement;
  r.setAttribute("data-size", S.settings.size==="l"?"l":"m");
  if(S.settings.theme==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.settings.theme);
}
function fmtDate(ts){ const d=new Date(ts); return `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }

function verseHTML(id, opts={}){

function fText(n,k,label,{hint="",ph="",area=false}={}){

  return `<div class="field"><label for="${id}">${label}</label>${hint?`<div class="hint">${hint}</div>`:""}${area?`<textarea id="${id}" data-f="${n}|${k}" placeholder="${esc(ph)}">${v}</textarea>`:`<input type="text" id="${id}" data-f="${n}|${k}" value="${v}" placeholder="${esc(ph)}">`}</div>`;
}
function fRange(n,k,label,{min=0,max=10,lo="",hi="",step=1}={}){
  const id=`f-${n}-${k}`; const v=F(n,k,null);
  return `<div class="field"><label for="${id}">${label}</label><div class="range"><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v??Math.round((min+max)/2)}" data-r="${n}|${k}" aria-valuetext="${v??"아직 고르지 않음"}"><output>${v??"–"}</output></div><div class="range-ends"><span>${lo}</span><span>${hi}</span></div></div>`;
}
function fChips(n,k,label,opts,{multi=false,hint=""}={}){
  const cur=F(n,k, multi?[]:null);
  return `<div class="field"><div class="lbl">${label}</div>${hint?`<div class="hint">${hint}</div>`:""}<div class="chips" role="group" aria-label="${esc(label)}">${opts.map(o=>{const val=typeof o==="string"?o:o.v; const txt=typeof o==="string"?o:o.t; const on= multi? (cur||[]).includes(val) : cur===val; return `<button type="button" class="chip" aria-pressed="${on}" data-chip="${n}|${k}|${multi?1:0}" data-val="${esc(val)}">${esc(txt)}</button>`;}).join("")}</div></div>`;
}
function fSeg(n,k,opts,o={}){
  const cur=F(n,k,null); const m=opts.length;

function voiceScores(){
  const res={};
  TYPES.forEach(t=>res[t.id]={out:0,outN:0,in:0,inN:0});
  PHRASES.forEach(p=>{ const v=phV(p); if(v===null) return; const r=res[p.type]; if(p.dir==="out"){r.out+=v;r.outN++;} else {r.in+=v;r.inN++;} });
  const list=TYPES.map(t=>{ const r=res[t.id]; const o=r.outN?r.out/r.outN:0, i=r.inN?r.in/r.inN:0; return {id:t.id, out:o, in:i, sum:o+i}; });
  const answered = PHRASES.filter(p=>phV(p)!==null).length;
  const top=[...list].sort((a,b)=>b.sum-a.sum).filter(x=>x.sum>0).slice(0,2).map(x=>x.id);
  const oMean=list.reduce((a,x)=>a+x.out,0)/list.length, iMean=list.reduce((a,x)=>a+x.in,0)/list.length;
  let shape="both";
  if(oMean<0.35 && iMean<0.35) shape="low"; else if(oMean-iMean>=0.35) shape="out"; else if(iMean-oMean>=0.35) shape="in";
  return {list, top, answered, shape};
}
function myPhrases(typeId){ return PHRASES.filter(p=>p.type===typeId && (phV(p)||0)>0).map(p=>p.t); }
function topTypes(){ return voiceScores().top; }

function pairsForAnswer(){

  for(let i=0;i<3;i++){ const t=F1(2,`s${i}_text`,""); if(t) out.push({key:`d2s${i}`, said:F1(2,"pick_text","")||"", voice:t, type:F1(2,`s${i}_type`,null)||typeOfText(t), belief:F1(2,`s${i}_belief`,null)}); }
  S.logs.forEach(l=>{ if(l.voice||l.said) out.push({key:"log_"+l.id, said:l.said||"", voice:l.voice||"", type:l.type||null, belief:l.belief??null}); });

}

let AC;
function chime(){
  if(!S.settings.chime) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const now=AC.currentTime;
    [[523.25,0.18],[783.99,0.09],[1046.5,0.05]].forEach(([f,g],i)=>{
      const o=AC.createOscillator(), a=AC.createGain();
      o.type="sine"; o.frequency.value=f;
      a.gain.setValueAtTime(0,now); a.gain.linearRampToValueAtTime(g, now+0.02+i*0.01); a.gain.exponentialRampToValueAtTime(0.0001, now+3.2);
      o.connect(a).connect(AC.destination); o.start(now); o.stop(now+3.3);
    });
  }catch(e){}
}

function openCalm(dayN){

  const total=stages.reduce((a,s)=>a+s.s,0);

  </div>`;
  document.body.appendChild(ov); document.body.style.overflow="hidden";
  const cvs=ov.querySelector("canvas"); let ctx=null; try{ ctx=cvs.getContext("2d"); }catch(e){}
  if(!ctx){ ctx={clearRect(){},createLinearGradient(){return {addColorStop(){}};},fillRect(){},beginPath(){},arc(){},fill(){},setTransform(){}}; }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,P=[];
  function size(){ const dpr=Math.min(2,window.devicePixelRatio||1); W=cvs.clientWidth; H=cvs.clientHeight; cvs.width=W*dpr; cvs.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  size(); window.addEventListener("resize", size);
  for(let i=0;i<150;i++) P.push({x:Math.random()*W, y:Math.random()*H, r:.6+Math.random()*2.2, vx:(Math.random()-.5)*.6, vy:(Math.random()-.5)*.6, a:.25+Math.random()*.45});

    if(st.run){ st.elapsed+=dt; st.left-=dt; if(st.left<=0) nextStage(true); }
    const p=progress();
    ctx.clearRect(0,0,W,H);
    // 물빛: 점점 맑아지는 위쪽 빛
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,`rgba(120,170,190,${.10+.18*p})`); g.addColorStop(1,"rgba(0,0,0,0)");

  }

  });
  function close(){ cancelAnimationFrame(st.raf); try{st.wake&&st.wake.release();}catch(e){} window.removeEventListener("resize",size); ov.remove(); document.body.style.overflow=""; TM=null; render(); }
}

async function saveFile(filename, blob){
  try{
    if(window.claude && typeof window.claude.use==="function"){
      const dl = await window.claude.use("downloads");
      if(dl){ await dl.save({filename, data:blob}); toast("저장했습니다"); return true; }
      return false;
    }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); return true;
  }catch(e){ if(e && e.code==="declined") return true; return false; }
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast("복사했습니다"); return; }catch(e){}
  const ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("복사했습니다"); }catch(e){ toast("길게 눌러 복사해 주세요"); }
  ta.remove();
}

function wrapLines(ctx, text, maxW){
  const out=[]; let line="";
  for(const ch of text){ const test=line+ch; if(ctx.measureText(test).width>maxW && line){ out.push(line); line=ch.trim()?ch:""; } else line=test; }
  if(line) out.push(line); return out;
}
async function makeCard(verseId){
  const v=VERSES[verseId]; const W=1080,H=1920;
  const c=document.createElement("canvas"); c.width=W; c.height=H; let x=null;
  try{ x=c.getContext("2d"); }catch(e){}
  if(!x) return null;
  try{ await document.fonts.ready; }catch(e){}
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,"#16405C"); g.addColorStop(1,"#0C2436"); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle="rgba(214,190,140,.16)"; for(let i=0;i<90;i++){ x.beginPath(); x.arc(Math.random()*W, H-140-Math.random()*120, 1+Math.random()*3, 0, Math.PI*2); x.fill(); }
  x.fillStyle="rgba(214,190,140,.22)"; x.fillRect(0,H-120,W,120);
  const serif='"Gowun Batang","Nanum Myeongjo",serif', sans='"Deepspring Sans","Apple SD Gothic Neo",sans-serif';
  x.textBaseline="top";
  x.fillStyle="#D6A452"; x.font=`600 34px ${sans}`;
  let y=360; wrapLines(x, v.who, W-220).forEach(l=>{ x.fillText(l,110,y); y+=50; });

  x.fillStyle="#F3ECDB"; lines.forEach(l=>{ x.fillText(l,110,y); y+=size*1.62; });
  y+=30; x.fillStyle="#B7C4CE"; x.font=`500 32px ${sans}`; x.fillText(v.ref+" · NJHV",110,y);
  x.fillStyle="rgba(243,236,219,.55)"; x.font=`500 28px ${sans}`; x.fillText("말의 구원 · 깊은 샘에서 흘러나오는 말",110,H-230);

}

const DEEP_LAYERS={1:{2:[3],3:[3],5:[3]},2:{1:[3],2:[3],3:[3],5:[2]},3:{4:[2]}};
function coreFold(html, layers){
  if(!layers||!layers.length||typeof document==="undefined") return html;
  const tp=document.createElement("template"); tp.innerHTML=html;
  layers.forEach(L=>{ const sec=tp.content.querySelector("#L"+L); if(!sec) return;
    const head=sec.querySelector(":scope > .lh"); const kids=[...sec.children]; const bar=kids.reverse().find(c=>c.classList.contains("donebar"));

    [...sec.childNodes].forEach(ch=>{ if(ch!==head&&ch!==bar) det.appendChild(ch); });
    sec.insertBefore(det, bar||null); });
  return tp.innerHTML;
}

    ${answered===4?`<p class="small">네 질문 가운데 ${right}곳에서 벌주려는 얼굴, ${4-right}곳에서 고치려는 얼굴을 고르셨습니다.</p><p class="serif" style="font-size:1.05em">${right>=2?"이것은 양심의 목소리라기보다 비판자의 목소리에 가깝습니다. 하나님이 주시는 근심은 사람을 무너뜨리지 않고 돌아오게 합니다.":"이 목소리에는 하나님이 주시는 근심의 모습이 있습니다. 그 일을 하나님께 가져가고, 필요하면 바로잡으세요(요일 1:9)."}</p>`:pendHTML(answered,4)}

      ${fChips(n,"who","1. 내가 자주 하는 그 말 — 그 말투는 누구에게서 들었나요?",WHO,{multi:true,hint:"여럿 골라도 됩니다. 아이는 부모를 옳다고 믿어야 세상이 안전하기 때문에 \u201c엄마가 잘못했다\u201d보다 \u201c내가 잘못했다\u201d를 택하곤 합니다(노은혜). 목소리의 출처가 늘 누군가의 말은 아닙니다."})}

function lineChart(pts){
  const W=320,H=140,pad=28; const xs=pts.map((_,i)=>pad+i*((W-2*pad)/Math.max(1,pts.length-1)));
  const y=v=>H-pad-(v/100)*(H-2*pad);
  const path=pts.map((p,i)=>p.v==null?null:`${xs[i]},${y(p.v)}`).filter(Boolean);
  return `<svg class="line-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="믿음의 변화">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"/>
    ${path.length>1?`<polyline fill="none" stroke="var(--teal)" stroke-width="3" points="${path.join(" ")}"/>`:""}
    ${pts.map((p,i)=>p.v==null?"":`<circle cx="${xs[i]}" cy="${y(p.v)}" r="6" fill="var(--teal)"/><text x="${xs[i]}" y="${y(p.v)-12}" text-anchor="middle" font-size="13" fill="var(--ink)">${p.v}</text>`).join("")}
    ${pts.map((p,i)=>`<text x="${xs[i]}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${p.l}</text>`).join("")}</svg>`;
}

/* 2일째 해부한 장면 — 다른 날들이 함께 쓴다 */
function w2Scene(){
  const sc=F(2,"scene",null,2), own=F(2,"scene_own","",2), said=sc||own||F(4,"scene4","",2);
  const ph=W2_PH.find(p=>p.t===sc); const st=W2_SIT.flatMap(s=>s.o).find(o=>o.t===sc);
  const shape = ph?ph.s : st&&st.c!=="true" ? st.c : null;
  return {said, shape, fact:F(2,"fact","",2), pic:F(2,"pic_own","",2)||F(2,"pic",null,2), guard:F(2,"guard",[],2)||[], afraid:F(2,"afraid",[],2)||[], belief:F(2,"belief",null,2), pct:F(2,"belief_pct",null,2)};
}
function pendHTML(done,total){ return `<p class="small" style="margin-top:10px;color:var(--teal)">${done} / ${total} · 모두 고르면 바로 아래에 결과가 나옵니다.</p>`; }
/* 원래 말에 짝이 맞는 '실제 그림의 말' — 만약-그러면의 기본 문장에 */
function w2NewFor(old,shape){
  const o=String(old||"");
  const pairs=[[/괜찮|별일/,"“사실 좀 힘들어요.”"],[/거의 다/,"“지금 막 나왔어. 20분쯤 걸릴 것 같아.”"],[/항상|맨날|원래/,"“당신, 최근에 두 번 그랬어.”"],[/다 했|다 봤|해 놨/,"“사실은 아직 다 못 했어요.”"],[/제가 (다 )?한/,"“사실은 동료가 많이 도와줬어요.”"],[/차가|막혀|막히/,"“제가 늦잠을 잤어요. 죄송합니다.”"],[/전달 못|못 받았/,"“제가 깜빡했어요. 제 실수예요.”"],[/그런 말 한 적|말한 적 없/,"“제가 그렇게 말했어요. 잘못 말했습니다.”"],[/기도해 보니|인도하셨/,"“제가 그렇게 결정했어요.”"],[/90점|수학/,"“수학은 90점인데, 나머지는 잘 못 봤어.”"]];
  for(const [re,nw] of pairs) if(re.test(o)) return nw;
  return shape&&W2_SHAPES[shape]?W2_SHAPES[shape].re[0]:"“사실은…”";
}
function quoteOf(t){ const m=String(t||"").match(/“([^”]+)”/); return m?m[1]:String(t||""); }
function sceneCard(sn, title="해부한 장면"){
  if(!sn.said) return `<p class="empty">2일째에 해부한 장면이 여기에 나타납니다.</p>`;
  return `<div class="panel soft"><p class="ph">${title}</p>
    <p><b>내가 한 말</b> — ${esc(sn.said)}${sn.shape?` <span class="small">(${shapeNm(sn.shape)})</span>`:""}</p>
    ${sn.fact?`<p class="small"><b>실제로 있었던 일</b> — ${esc(sn.fact)}</p>`:""}
    ${sn.pic?`<p class="small"><b>상대 머릿속의 그림</b> — ${esc(sn.pic)}</p>`:""}
    ${sn.guard.length?`<p class="small"><b>지키거나 높이려던 것</b> — ${sn.guard.map(esc).join(", ")} <span>(${sn.guard.some(x=>W2_RAISE.includes(x))&&sn.guard.some(x=>W2_KEEP.includes(x))?"두 얼굴 모두":sn.guard.some(x=>W2_RAISE.includes(x))?"높이려는 얼굴":"지키려는 얼굴"})</span></p>`:""}
    ${sn.afraid.length?`<p class="small"><b>드러났다면 두려웠던 것</b> — ${sn.afraid.map(esc).join(", ")}</p>`:""}
    ${sn.belief?`<p class="small"><b>그 밑의 믿음</b> — “${esc(sn.belief)}”${sn.pct!=null?` · 믿음 ${sn.pct}`:""}</p>`:""}</div>`;
}

function w1Rum(){ const r={brood:{s:0,c:0},reflect:{s:0,c:0}}; W1_RUM.forEach(p=>{ const v=F(5,"rm_"+p.id,null,1); if(v===null) return; r[p.f].s+=v; r[p.f].c++; });

    : hiB&&hiR ? "되새기기도 하고 살피기도 합니다. 같은 일을 오래 붙들고 있다는 뜻입니다. 살피는 힘을 ‘왜 나는’에서 ‘무엇을 할 수 있을까’로 옮겨 보세요."

    : "내 안의 말을 오래 붙들지 않는 편입니다. 다만 살피지 않고 덮어 두는 것은 아닌지, 한 번 물어보세요.";

/* 2주 1일째 — 여덟 상황 */
function w2SitBrief(){
  const si=w2Sit(); if(si.answered<W2_SIT.length) return "";
  const ans=W2_SIT.map(s=>({s,o:s.o.find(x=>x.v===F(1,"sit_"+s.id,null,2))}));
  const hide=ans.filter(x=>x.o&&x.o.c!=="true"), truth=ans.filter(x=>x.o&&x.o.c==="true");
  const qs=q=>q.replace(/, 나는 대개$/,"");
  const s1 = si.hideN? `${W2_SIT.length}가지 상황 가운데 ${si.hideN}곳에서 속이는 쪽을 고르셨습니다.${si.top.length?` 가장 자주 나온 모양은 ${joinKo(si.top.map(k=>`‘${shapeNm(k)}’`))}입니다.`:""}` : `${W2_SIT.length}가지 상황 모두에서 있는 그대로 말하는 쪽을 고르셨습니다.`;
  const s2 = hide.length? hide.slice(0,4).map(x=>`${qs(x.s.q)} ${qb(x.o.t)}`).join(", ")+(hide.length>4?` 외 ${hide.length-4}곳`:"")+".":"";
  const s3 = truth.length&&hide.length? `반대로 ${truth.slice(0,2).map(x=>`‘${qs(x.s.q)}’`).join(", ")}에서는 있는 그대로 말한다고 답하셨습니다. 이미 참된 말이 자리 잡은 곳입니다.`:"";
  const s4 = si.hideN? "‘틀린 말은 아니잖아’ 하고 스스로 위로하며 반쪽만 말한 적은 없었나요?" : "";
  return briefBox(`월요일 브리핑 — ${nmOf()}의 말`,[{h:"요약",p:s1},{h:"속이는 쪽을 고른 상황",p:s2},{h:"이미 자리 잡은 곳",p:s3},{h:"아브라함처럼",p:s4},{h:"내일",p:"화요일에는 이 말들이 나오는 자리와 그 밑의 마음을 보고, 한 장면을 해부합니다."}]);
}

/* 2주 5일째 — 세 쪽과 말하기 전에 보기 */
function w2SideBrief(){
  const sd=w2Side(); if(sd.answered<W2_SIDE.length) return "";
  const m=sd.m; const H=k=>m[k]!=null&&m[k]>=1.25, Lo=k=>m[k]!=null&&m[k]<0.75;
  const stA=W2_STUDY.map(p=>F(5,"sy_"+p.id,null,2)); const st=stA.every(v=>v!==null)?stA.reduce((a,b)=>a+b,0)/stA.length:null;
  const often=W2_SIDE.filter(p=>F(5,"sd_"+p.id,null,2)===2).map(p=>qb(p.t));
  let s1;
  if(Lo("hide")&&H("knife")) s1="속이는 쪽은 낮지만 찌르는 쪽이 높습니다. 거짓말은 잘 하지 않지만, 솔직함이 칼이 되는 쪽입니다. 서론의 제이콥스가 그랬습니다.";
  else if(H("knife")&&H("silent")) s1="때로는 찌르고, 때로는 입을 닫습니다. 화가 날 때는 말하고 정작 말해야 할 때는 침묵하는, 말할 때와 잠잠할 때가 뒤바뀌어 있을 수 있습니다.";
  else if(H("hide")&&H("silent")) s1="속이기도 하고 입을 닫기도 합니다. 두 길 모두 나를 지키는 길입니다.";
  else if(H("silent")) s1="말해야 할 때 입을 닫는 쪽이 큽니다. 참된 말에서 지금 가장 필요한 것은 용기입니다.";
  else if(H("knife")) s1="사실을 칼처럼 쓰는 쪽이 큽니다. 칼 같은 말도 결국 나를 지키고 높이는 말이라, 속이는 말과 뿌리가 같습니다.";
  else if(H("hide")) s1="나를 지키거나 높이려고 속이는 쪽이 큽니다.";
  else s1="세 쪽 모두 크지 않습니다. 참된 말의 자리가 꽤 단단합니다.";
  if(st!=null&&H("silent")&&st>=1.6) s1+=" 그리고 말하기 전에 보는 습관은 잘 자리 잡혀 있습니다. 알면서도 말하지 못하는 자리, 지식보다 용기가 필요한 자리입니다.";
  const s2 = often.length? `‘자주’라고 고르신 것은 ${often.slice(0,2).join(", 그리고 ")}입니다.`:"";
  const s3 = st==null?"" : st<1? "말하기 전에 보는 습관은 아직 약합니다. 들은 말을 다른 사람에게 옮기거나 SNS에 무언가를 올리기 전에, 원래 자료와 다른 쪽 설명을 한 번 찾아보는 것부터 시작해 보세요. 확인할 수 없는 것이라면 옮기지 않는 것도 참된 말입니다." : st<1.6? "말하기 전에 보는 습관은 자리 잡아 가는 중입니다. ‘가끔’이라고 답한 문장 하나를 이번 주의 연습으로 삼아 보세요." : "말하기 전에 보는 습관이 잘 자리 잡혀 있습니다. 이 습관이 공동체 안에서 다른 사람에게도 안전한 자리가 되게 해 보세요.";
  const tips=[]; if(H("knife")) tips.push("오늘의 ‘참되면서 살리는 말’에서 관찰과 느낌을 나누어 보세요. 사실과 판단이 갈라집니다.");
  if(H("silent")) tips.push("오늘의 ‘참되면서 살리는 말’로, 꼭 해야 할 말 하나를 준비해 보세요.");
  if(H("hide")) tips.push("저녁의 ‘오늘의 세 걸음’에서 실제 그림의 말을 꼭 써 보세요.");
  if(!tips.length) tips.push("이번 주에는 그 단단한 자리에서, 누군가 자기를 드러낼 때 “말해 줘서 고마워요”로 받아 주는 사람이 되어 보세요.");
  return briefBox(`금요일 브리핑 — ${nmOf()}의 말`,[{h:"요약",p:s1},{h:"내가 고른 것",p:s2},{h:"말하기 전에 보기",p:s3},{h:"오늘",p:tips.join(" ")}]);
}

   저장: 그날 pl_when · pl_when_own · pl_old · pl_old_own · pl_new / 다음 날 yd_out · yd_old · yd_gate · yd_again · yd_after · yd_thanks */
const W3_CARRY={1:{t:"누구든지 듣기는 빨리 하고, 말하기는 더디 하고, 성내기도 더디 하십시오.",r:"야고보서 1:19"},2:{t:"화를 내더라도 죄를 짓지는 말라.",r:"에베소서 4:26"},3:{t:"율법을 주시는 분도, 재판하시는 분도 오직 한 분이십니다. 그런데 이웃을 판단하는 당신은 누구입니까?",r:"야고보서 4:12"},4:{t:"욕을 들으셔도 맞받아 욕하지 않으셨고, 고난을 받으셔도 위협하지 않으시고, 공의롭게 심판하시는 분께 맡기셨습니다.",r:"베드로전서 2:23"},5:{t:"부드러운 대답은 분노를 가라앉히지만, 거친 말은 노여움을 일으킨다.",r:"잠언 15:1"},6:{t:"모든 겸손과 온유로, 오래참음으로 사랑 가운데서 서로 용납하십시오.",r:"에베소서 4:2"}};
const PLAN_WHEN=["아이와 이야기할 때","배우자와 이야기할 때","부모님과 통화할 때","직장에서","운전할 때","교회에서","온라인에서"];
const YD_OUT=["그 순간에 새 말을 했어요","그 순간이 왔지만 옛 말이 나왔어요","그 순간이 오지 않았어요"];
function planOf(d){ const g=k=>(F(d,k,"",CW)||"").toString().trim();
  const when=g("pl_when_own")||g("pl_when"), old=g("pl_old_own")||g("pl_old"), nw=g("pl_new");
  return (when||old||nw)?{when,old,nw}:null; }
function planLine(p){ const q=s=>s?(/^[“"]/.test(s)?s:/^\(.*\)$/.test(s)?s.slice(1,-1):`“${s.replace(/[.。]$/,"")}”`):"";
  return `${p.when?esc(p.when)+", ":""}${p.old?esc(q(p.old))+" 대신 ":""}${p.nw?esc(q(p.nw))+"라고":"새 말로"} 말해 보기`; }
function carryLayer(n, o){
  const p=planOf(n); const w=o.word;
  return `<section class="layer" id="L4">${layerHead(n,4,o.title||"들고 나가기","2분")}

    ${o.pre||""}

    <p class="small">${o.planHint||"오늘 날 선 말이 나올 만한 순간 하나를 미리 정하고, 그때 할 새 말을 정해 둡니다. 연구에서 ‘언제, 무엇을’까지 정해 둔 다짐이 그냥 한 결심보다 훨씬 잘 지켜졌습니다(실행 의도)."}</p>
    ${fChips(n,"pl_when","언제 — 그 순간이 올 만한 자리",PLAN_WHEN)}
    ${fText(n,"pl_when_own","또는 내 말로",{ph:"예: 저녁 숙제를 봐 줄 때"})}
    ${(o.olds||[]).length?fChips(n,"pl_old","무엇 대신 — 그때 나오기 쉬운 옛 말",o.olds):""}
    ${fText(n,"pl_old_own",(o.olds||[]).length?"또는 그 말 그대로":"무엇 대신 — 그때 나오기 쉬운 옛 말",{ph:o.oldPh||"예: 몇 번을 말해야 알아듣니?"})}
    ${fText(n,"pl_new","어떻게 — 그 대신 할 새 말",{ph:w?w.word:"예: 잠깐, 생각하고 말할게.",hint:w?`오늘의 새 말 ‘${w.nm}’을 내 상황에 맞게 고쳐 쓰세요.`:""})}
    ${p&&p.nw?`<div class="panel soft"><p class="ph">들고 나갈 한 문장</p><p class="serif" style="font-size:1.08em">${planLine(p)}</p><p class="small">화면을 캡처해 두거나, 소리 내어 한 번 말해 보세요.</p></div>`:""}
    ${o.extra||""}
    ${doneBar(n,4)}</section>`;
}
function ydCard(n){
  if(n<=1) return ""; const p=planOf(n-1); if(!p) return "";
  const out=F(n,"yd_out",null,CW);
  const body = out===YD_OUT[0] ? `${fText(n,"yd_after","그 뒤에 무엇이 달라졌나요? (선택)")}<p class="small">새 언어는 이렇게 한 문장씩 몸에 붙습니다. 오늘도 한 문장만 들고 나가면 됩니다.</p>`
    : out===YD_OUT[1] ? `${fText(n,"yd_old","그때 실제로 나온 말")}${fChips(n,"yd_gate","어느 입구로 들어왔나요?",["찔릴 때 — 무시나 실망","막힐 때 — 바람이 막힘","잘 모르겠다"])}${fText(n,"yd_again","다시 그 순간이 온다면, 무슨 말을 하고 싶나요?")}<p class="small">옛 말이 나온 날은 실패한 날이 아니라, 어디서 걸리는지 알게 된 날입니다. 이 줄은 토요일 ‘나의 말 사전’에 그대로 들어갑니다.</p>`
    : out===YD_OUT[2] ? `<p class="small">그 다짐은 오늘 다시 들고 나가도 됩니다.</p>` : "";
  return `<div class="panel soft yd" style="border-left:4px solid var(--teal)"><p class="ph">어제의 다짐 — 어떻게 되었나요?</p><p class="serif">${planLine(p)}</p>
    ${fChips(n,"yd_out","",YD_OUT)}${body}
    ${out?fText(n,"yd_thanks","어제 감사했던 것 하나 (선택)"):""}</div>`;
}

  3:{who:"나아만", scr:"w3_2ki5", body:"나병을 고치러 온 장군 나아만은 ‘요단강에 가서 일곱 번 씻으라’는 말에 화가 나서 돌아섰습니다. “내 생각에는, 그가 반드시 나와서…” 그의 마음에는 고침받는 방식에 대한 법이 있었고, 그 법이 어겨지자 분노가 되었습니다. 그를 돌이킨 것은 종들의 부드러운 말이었습니다. “아버지, 더 어려운 일을 하라고 했다면 하지 않으셨겠습니까?”",
     ins:"불평은 일을, 비난은 사람을 겨눕니다", insBody:"가트맨은 불평과 비난을 구별합니다. 불평은 특정한 행동이나 일을 말하고, 대개 세 부분으로 이루어집니다. 내 마음(“나는 정말 화가 나”), 구체적인 상황(“어젯밤 부엌을 치우지 않았네”), 그리고 바라는 것(“지금 해 줄 수 있어?”). 비난은 상대의 성품과 인격 전체를 겨눕니다(“당신은 왜 그렇게 잘 잊어버려?”). 바람이 법이 되는 순간, 불평은 비난이 됩니다.", src:"Gottman · Silver, The Seven Principles for Making Marriage Work, p. 42"},
  4:{who:"다윗과 시므이", scr:"w3_2sa16", body:"아들에게 쫓겨 도망치던 다윗에게 시므이가 돌을 던지며 저주했습니다. 부하 아비새가 “제가 건너가서 그의 머리를 베게 해 주십시오” 했을 때, 다윗은 판결을 하나님께 맡겼습니다. “그를 내버려 두어라. 여호와께서 혹시 내 고통을 보시고 선으로 갚아 주실지도 모른다.” 판사석에 앉을 수 있는 왕이 그 자리에서 내려왔습니다.",
     ins:"감정에 이름을 붙이면", insBody:"2007년 미국 UCLA의 리버먼 연구팀은 30명에게 부정적인 감정이 담긴 사진을 보여 주며 뇌를 촬영했습니다. 사진 속 감정에 ‘화남’, ‘두려움’ 같은 이름을 붙이게 했을 때, 감정 반응을 일으키는 편도체의 활동이 줄고 대신 전두엽의 한 부위가 활발해졌습니다. 감정에 말을 붙이는 일이 그 감정을 다스리는 길이 될 수 있음을 보여 주는 연구입니다. 오늘 내 마음에 이름을 붙여 하나님께 내놓는 기도가 그렇습니다.", src:"Lieberman 외 (2007), Putting feelings into words, Psychological Science 18(5), 421–428"},
  5:{who:"아비가일", scr:"w3_1sa25", body:"남편 나발의 모욕에 다윗이 칼을 차고 사백 명과 함께 오고 있었습니다. 아비가일은 맞서 싸우지도 숨지도 않고, 먼저 내려와 엎드려 말했습니다. “내 주여, 그 잘못은 저에게 돌려 주십시오.” 진실은 그대로 두고 날은 거둔 그 말에, 다윗은 이렇게 답합니다. “오늘 당신이, 내가 피를 흘리지 않게 나를 막아 주었습니다.”",
     ins:"첫 문장이 끝을 정합니다", insBody:"가트맨은 부부의 15분 대화를 관찰한 결과, 처음 3분만 보고도 그 대화가 어떻게 끝날지를 96% 예측할 수 있었다고 말합니다. 거칠게 시작한 대화는 중간에 아무리 좋게 하려 해도 결국 부정적으로 끝났습니다. 그래서 그는 거칠게 시작했다면 차라리 멈추고, 숨을 고른 뒤, 다시 시작하라고 권합니다. 아비가일의 첫마디가 다윗의 칼을 멈춘 것처럼, 첫 문장이 대화의 끝을 정합니다.", src:"Gottman · Silver, The Seven Principles for Making Marriage Work, p. 41"},
  6:{who:"바울과 바나바, 그리고 마가", scr:"w3_act15", body:"첫 선교 여행 중간에 돌아간 마가를 두고, 바울과 바나바는 심하게 다투고 갈라섰습니다. 사도들도 날 선 다툼을 했습니다. 그러나 이야기는 거기서 끝나지 않습니다. 세월이 흐른 뒤 감옥의 바울은 이렇게 씁니다. “마가를 데리고 오십시오. 그는 내 일에 유익한 사람입니다.” 틀린 자리에서 고쳐 가는 것, 그것이 새 언어를 배우는 사람의 길입니다.",
     ins:"수치가 아니라 죄책감이 사과를 낳습니다", insBody:"탱니와 디어링에 따르면, ‘나는 형편없는 사람이다’라는 수치는 사람을 바로잡는 쪽으로 이끌기보다 부인과 방어적인 분노를 부릅니다. 그러나 ‘내가 한 그 일이 잘못이었다’는 특정한 행동에 대한 죄책감은 책임을 받아들이고 바로잡게 합니다. 죄책감을 잘 느끼는 사람은 화가 나도 더 직접적이고 건설적으로 표현했습니다. 그래서 좋은 사과는 “나는 쓰레기야”가 아니라 “내가 한 그 말이 잘못이었어”로 시작합니다.", src:"Tangney · Dearing (2002), Shame and Guilt, pp. 21, 23, 25"}
};

    ${w.ex.map(e=>`<p class="small">${e}</p>`).join("")}</div>
  ${fChips(n,"w_aloud","소리 내어 세 번 말해 보세요",["소리 내어 말해 봤어요"])}
  ${fText(n,"w_mine","내 말투로 고쳐 쓴 오늘의 새 말",{ph:w.word})}
  ${fChips(n,"w_where","오늘 이 말을 써 볼 자리",["집에서","직장에서","교회에서","친구 사이에서","운전할 때","온라인에서"],{multi:true})}`;
}

  {id:"m2",q:"가족이 부탁한 일을 또 잊었을 때, 나는 대개",o:[{v:"a",c:"blame",t:"“당신은 맨날 이래.”"},{v:"b",c:"jab",t:"“역시 기대한 내가 잘못이지.”"},{v:"c",c:"swallow",t:"혼자 해 버리고 말을 안 한다"},{v:"d",c:"witness",t:"“이번에도 빠졌네. 다음엔 메모해 두면 좋겠어.”"}]},

function w3Sit(){ const cnt={}; let a=0; W3_SIT.forEach(s=>{ const o=s.o.find(x=>x.v===F(1,"sit_"+s.id,null,3)); if(o){ a++; cnt[o.c]=(cnt[o.c]||0)+1; } });
  const faces=Object.keys(W3_FACE).filter(k=>k!=="witness"&&cnt[k]).sort((x,y)=>cnt[y]-cnt[x]); return {cnt, answered:a, faces}; }
const W3_FAV=["“맨날 왜 그래.”","“그러니까 내가 뭐랬어.”","“됐어, 말을 말자.”","“몇 번을 말해야 알아듣니?”","“너는 생각이 있는 거니?”","“또, 또, 핑계 댄다.”","“너 때문에 이렇게 됐잖아.”","“알아서 해.”"];
function w3Favs(){ const a=(F(1,"fav",[],3)||[]).slice(); const own=(F(1,"fav_own","",3)||"").trim(); if(own) a.push(`“${own.replace(/^[“"]|[”"]$/g,"")}”`); return a; }
function w3SitBrief(){
  const s=w3Sit(); if(s.answered<W3_SIT.length) return "";
  const c=s.cnt, top=s.faces.slice(0,2), wn=c.witness||0;
  const p1 = top.length? `여덟 상황 가운데 날 선 쪽을 고른 것은 ${W3_SIT.length-wn}번이고, 가장 자주 나온 얼굴은 ${joinKo(top.map(k=>`‘${W3_FACE[k]}’`))}입니다.` : "여덟 상황 모두에서 증인의 말을 고르셨습니다.";
  const read={burst:"화가 바로 밖으로 나가고, 문제가 아니라 사람을 겨누기 쉽습니다.",jab:"목소리는 높이지 않지만, 농담과 비꼼과 차가운 침묵으로 벌을 줍니다. 가트맨이 경멸의 모양으로 든 것들입니다.",blame:"‘맨날’, ‘너 때문에’로 화살을 상대에게 돌립니다.",swallow:"밖에서는 삼키지만, 삼킨 말은 사라지지 않고 가장 안전하다고 믿는 사람 앞에서 터지기 쉽습니다.",back:"받은 칼을 같은 칼로 돌려줍니다. 싸움이 커집니다."};

/* 규준 — 같은 척도에 답한 대학생들의 평균 · 표준편차(합계 점수, 원 척도 눈금은 1부터). 원 논문의 표에서 그대로 옮김.
   va · ho: 서수균 · 권석만 2002, 494쪽 표 2(n=552) / p1 · p2 · s1: 서수균 · 권석만 2005, 200쪽 표 4(연구 2, n=410) / c · j · r: 서수균 2007, 244쪽 표 1(n=409) */
const W3_NORM = {
  va:{k:5,pts:5,M:12.75,SD:3.32}, ho:{k:8,pts:5,M:18.32,SD:4.88},
  p1:{k:11,pts:5,M:34.21,SD:7.16}, p2:{k:9,pts:5,M:30.91,SD:5.63}, s1:{k:19,pts:5,M:39.57,SD:12.50},
  c:{k:12,pts:4,M:32.13,SD:5.95}, j:{k:6,pts:4,M:15.49,SD:3.98}, r:{k:5,pts:4,M:7.43,SD:2.20}
};
/* 앱 눈금(0–4)의 하위 척도 평균 → 원 척도 합계 → 표준점수 */
function w3Z(f,m){ const N=W3_NORM[f]; if(!N||m==null) return null; return ((m*(N.pts-1)/4+1)*N.k-N.M)/N.SD; }
function w3NM(f){ const N=W3_NORM[f]; return (N.M/N.k-1)*4/(N.pts-1); } /* 규준 평균을 앱 눈금으로 */
function w3Lv(z){ return z==null?"–":z>=1.5?"훨씬 높은 편":z>=1?"높은 편":z>=0.5?"조금 높은 편":z>-0.5?"평균 언저리":z>-1?"조금 낮은 편":"낮은 편"; }
function w3Hi(z){ return z!=null&&z>=0.5; }
function w3Lo(z){ return z!=null&&z<=-0.5; }
function w3Num(f,m){ return `나 ${m.toFixed(1)} · 평균 ${w3NM(f).toFixed(1)}`; }
function w3Score(items, day, prefix, k){ const sub={}; let a=0; items.forEach(p=>{ const v=F(day,prefix+p.id,null,3); if(v===null) return; a++; (sub[p.f]=sub[p.f]||{s:0,c:0}); sub[p.f].s+=v*4/(k-1); sub[p.f].c++; });
  const o={}; Object.keys(sub).forEach(f=>o[f]=sub[f].s/sub[f].c); return {sub:o, answered:a, done:items.length>0&&a===items.length}; }
function w3Pri(){ return w3Score(W3_PRI,2,"pa_",5); }
function w3Sec(){ return w3Score(W3_SEC,3,"sa_",5); }
function w3Vb(){ return w3Score(W3_VB,5,"vb_",4); }
function w3Bars(sub, keys){ return `<div class="bars">${keys.filter(k=>sub[k]!=null).map(k=>{ const nm=w3NM(k); return `<div class="bar"><span class="nm">${W3_SUB[k].nm}</span><span class="tr"><span class="tk ${k==="c"?"in":"out"}"><i style="width:${sub[k]/4*100}%"></i><b class="avg" style="left:${nm/4*100}%" aria-hidden="true"></b></span><span class="small">${sub[k].toFixed(1)} · 평균 ${nm.toFixed(1)} · ${w3Lv(w3Z(k,sub[k]))}</span></span></div>`; }).join("")}</div><p class="small" style="margin:2px 0 0">막대 위의 세로 줄이 같은 척도에 답한 대학생들의 평균입니다. 0에서 4 사이.</p>`; }
function w3Items(n, items, prefix, labels, stem){ return `${stem?`<p class="small">${stem}</p>`:""}${items.map(p=>`<div class="phrase"><div class="t">${p.t}</div>${fSeg(n,prefix+p.id,labels)}</div>`).join("")}`; }
function w3Wait(name){ return `<div class="panel warn"><p class="ph">점검 문항을 넣는 중입니다</p><p>${name}의 문항은 원문을 받는 대로 이 자리에 들어갑니다. 오늘은 아래의 다른 연습부터 해 주세요.</p></div>`; }
const W3_NOQUOTE=new Set(["s15","s18"]); /* 척도에는 넣고 브리핑에서 돌려 인용하지는 않는 강한 문항 */
/* ‘특히’ 인용 — 그 하위 척도 안에서 가장 높게 답한 문항만(k 이상). 모든 문항에 같은 답을 했으면 ‘특히’가 거짓이 되므로 인용하지 않는다 */
function w3Top(items, day, prefix, keys, k){ const pool=items.filter(p=>keys.includes(p.f)); const val=p=>F(day,prefix+p.id,0,3)||0; const vs=pool.map(val); if(!vs.length) return []; const mx=Math.max(...vs), mn=Math.min(...vs); if(mx<k||mx===mn) return []; return pool.filter(p=>!W3_NOQUOTE.has(p.id)&&val(p)===mx).map(p=>qb(p.t)).slice(0,2); }

/* 화요일 브리핑 — 두 입구 (규준과 견주어 읽음 — 2026-10-20) */

  const P=w3Pri(); if(!P.done) return ""; const a=P.sub.p2, b=P.sub.p1, za=w3Z("p2",a), zb=w3Z("p1",b);
  const gate = w3Hi(za)&&(za-zb>=0.5||!w3Hi(zb)) ? {k:"stab",nm:"버튼이 눌리는 사람",d:"가까운 사람에게 무시당하거나 실망할 때 남들보다 쉽게 타오릅니다. 찔리는 입구가 큽니다."}

    : (w3Lo(za)&&w3Lo(zb)) ? {k:"low",nm:"비교적 잔잔한 사람",d:"두 입구 모두 남들보다 덜 열려 있습니다."}
    : {k:"mid",nm:"두 입구가 보통인 사람",d:"찔릴 때도 막힐 때도 같은 척도에 답한 사람들의 평균 언저리입니다."};

    {h:"다 그렇다고 답하게 되는 까닭",p:`이 문항들은 누구라도 마음이 상할 만한 상황을 그려 놓았고, 스무 문항이 모두 같은 쪽으로 묻습니다. 그래서 읽어 갈수록 다 맞는 말 같고, 이끌려 가는 느낌이 들 수 있습니다. 실제로 이 척도를 만든 연구에서 대학생 410명의 문항당 평균도 찔릴 때 ${w3NM("p2").toFixed(1)}, 막힐 때 ${w3NM("p1").toFixed(1)}이었습니다(2가 ‘어느 정도 일치함’, 3이 ‘상당히 일치함’). 많이 동의했다는 것만으로 분노가 큰 사람이라는 뜻은 아닙니다. 이 척도가 보는 것은 같은 상황을 남들보다 얼마나 더 ‘나를 무시한다’, ‘이기적이다’로 읽는가입니다. 그래서 결과는 점수 자체가 아니라 평균과 견주어 읽습니다.`},
    {h:"찔릴 때",p:w3Hi(za)?`가까운 사람의 말과 태도에서 무시와 실망을 남들보다 쉽게 읽는 편입니다.${ta.length?` 특히 ${ta.join(", 그리고 ")}가 내 생각과 상당히 일치한다고 답하셨습니다.`:""} 탱니의 연구처럼, 찔린 자리에 수치가 묻어 있으면 그 아픔은 쉽게 남을 탓하는 말이 됩니다.`
      : w3Lo(za)?"가까운 사람에게 무시당하거나 실망하는 자리에서 남들보다 덜 타오르는 편입니다."

    {h:"막힐 때",p:w3Hi(zb)?`남의 부당하고 이기적인 행동에 남들보다 예민합니다.${tb.length?` 특히 ${tb.join(", 그리고 ")}가 내 생각과 상당히 일치한다고 답하셨습니다.`:""} 정의에 대한 감각은 좋은 것이지만, 그 감각이 ‘이래야 한다’는 내 법이 되면 판결로 이어집니다. 내일 그 법을 봅니다.`

  ]);

/* 수요일 브리핑 — 법정 */

    [33,"예수께서는 마리아가 우는 것과, 그와 함께 온 유대 사람들도 우는 것을 보시고, 마음이 몹시 북받쳐 괴로워하셨다."],
    [34,"예수께서 물으셨다. “그를 어디에 두었느냐?” 그들이 대답했다. “주님, 와서 보십시오.”"],

  w4_neh2:{ ref:"느헤미야 2:2–5", v:[
    [2,"왕이 나에게 말했다. “<b>네가 아픈 것도 아닌데, 어찌하여 얼굴에 수심이 가득하냐? 이것은 마음에 근심이 있는 것이 분명하다.</b>” 나는 몹시 두려웠다."],

    [4,"왕이 나에게 말했다. “<b>네가 원하는 것이 무엇이냐?</b>” <b>그래서 나는 하늘의 하나님께 기도하고,</b>"],

  w4_act18:{ ref:"사도행전 18:24–26, 28", gloss:"25절의 ‘정확하게’(아크리보스)와 26절의 ‘더 정확하게’(아크리베스테론)는 같은 낱말의 원급과 비교급입니다. 아볼로는 이미 정확하게 가르쳤고, 브리스길라와 아굴라는 그것을 ‘더’ 정확하게 해 주었습니다. 26절의 ‘맞아들이다’(프로슬람바노)는 ‘따로 데려가다’로도, ‘집에 맞아들이다’로도 읽습니다.", v:[

  w4_ru2:{ ref:"룻기 2:4", gloss:"주인의 인사에도, 일꾼들의 대답에도 여호와의 이름이 들어 있습니다.", v:[

const W4_CALM_PIC={1:"하늘을 지으시고도 사람 하나를 기억하시고 찾아와 돌보시며, 영광과 존귀의 관을 씌우신 분",2:"내게 귀를 기울여, 내 말을 끝까지 들으시는 분",3:"상한 갈대를 꺾지 않으시고, 꺼져 가는 심지를 끄지 않으시는 분",4:"모든 일에 때를 두시고, 잠잠할 때와 말할 때를 아시는 분",5:"내가 모르는 내 허물에서 나를 깨끗하게 하시고, 내 입의 말을 받아 주시는 분",6:"우리에게 얼굴을 비추시고, 그 복이 온 땅에 흐르게 하시는 분"};
const W4_PRAY={1:"하나님, 오늘 이 사람을 하나님 보시는 눈으로 보게 해 주십시오. 주님이 아들을 내어 주시기까지 사랑하시는 그 귀한 존재로 나도 보게 하소서.<span class=\"ref\">주일 설교의 기도</span>",2:"주님, 받은 수고를 당연하게 여기지 않게 하소서. 오늘 고마움 하나를 말로 돌려주게 하소서.",3:"주님, 무거운 마음 앞에서 서두르지 않게 하소서. 제 불편함보다 그 사람의 아픔을 먼저 보게 하소서.",4:"주님, 이 사람에게 지금 무엇이 필요한지 보게 해 주십시오. 말할 때와 잠잠할 때를 알게 하소서.",5:"주님, 제가 모르는 제 허물을 알려 줄 사람을 주시고, 그 말을 들을 귀를 주소서."};

const W4_CARRY={1:{t:"모든 사람을 존중하고, 형제자매를 사랑하고, 하나님을 두려워하고, 왕을 존중하십시오.",r:"베드로전서 2:17"},2:{t:"그리고 사랑과 선한 일로 서로 북돋우도록, 서로에게 마음을 기울입시다.",r:"히브리서 10:24"},3:{t:"끝으로, 여러분은 모두 한마음이 되고, 서로의 아픔을 함께 느끼고, 형제자매로 사랑하고, 속 깊이 불쌍히 여기고, 자신을 낮추십시오.",r:"베드로전서 3:8"},4:{t:"사람은 자기 입의 알맞은 대답으로 기뻐한다. 때에 맞는 말은 얼마나 좋은가!",r:"잠언 15:23"},5:{t:"생명을 주는 꾸지람을 듣는 귀는 지혜로운 사람들 가운데 머문다.",r:"잠언 15:31"},6:{t:"악을 악으로, 욕을 욕으로 갚지 마십시오. 도리어 복을 빌어 주십시오. 여러분은 바로 이것을 위해 부르심을 받았습니다. 여러분이 복을 물려받게 하시려는 것입니다.",r:"베드로전서 3:9"}};

const W4_NEW = {
  1:{who:"엠마오 길의 예수", scr:"w4_lk24", body:"부활하신 예수께서 엠마오로 가는 두 제자 곁에 다가와 함께 걸으셨습니다. 그들이 침울하게 주고받던 이야기는 바로 예수님 자신에 관한 것이었습니다. 누구보다 그 일을 잘 아시는 분이 먼저 물으셨고(17절), 되묻는 말에도 다시 물으셨습니다. “무슨 일이냐?” 그리고 그들이 실망과 혼란을 다 꺼내 놓을 때까지 들으신 뒤에야 말씀을 시작하셨습니다(19–25절). 묻는 일은 몰라서만 하는 것이 아닙니다. 그 사람이 자기 이야기를 자기 입으로 하게 하는 일입니다.",
     ins:"상상하지 말고 물어보세요", insBody:"‘그 사람 입장이 되어 보라’는 말을 들으면 그 사람을 더 정확하게 알게 될까요? 이스라엘과 미국의 심리학자 에얄, 스테펠, 에플리는 25개의 실험으로 이것을 확인했습니다. 얼굴과 몸짓에서 감정 읽기, 가짜 웃음과 진짜 웃음 가려내기, 거짓말 알아채기, 배우자가 무엇을 좋아할지 맞히기까지. 미리 물어본 사람들은 대부분 상대의 입장을 상상하면 더 정확해질 거라고 기대했지만, 정확도는 나아지지 않았고 오히려 떨어지기도 했습니다. 정확도를 올린 것은 그 사람에게 직접 물어 대답을 듣는 것이었습니다. 연구자들은 남의 마음을 정확히 아는 길은 관점을 ‘취하는’ 것이 아니라 ‘얻는’ 것이라고 결론짓습니다.", src:"Eyal · Steffel · Epley (2018), Perspective mistaking, Journal of Personality and Social Psychology 114(4), 547–571"},
  2:{who:"바울의 문안", scr:"w4_rom16", body:"로마서는 바울의 편지 가운데 가장 긴 편지이고, 바울이 아직 가 보지 못한 교회에 보낸 편지입니다(1:13). 그런데 그 끝에서 바울은 스무 명이 넘는 사람의 이름을 하나하나 부릅니다. 그리고 많은 이름에 그 사람이 한 일을 덧붙입니다. “많은 사람과 나를 후원해 준” 뵈뵈, “여러분을 위해 많이 수고한” 마리아, “주 안에서 많이 수고한 사랑하는” 버시, 그리고 “나에게도 어머니가 되어 준” 루포의 어머니. 고마움은 이름과 함께, 그 사람이 한 일을 구체적으로 말할 때 그 사람에게 닿습니다.",
     ins:"고마움은 생각보다 크게 닿습니다", insBody:"쿠마르와 에플리는 사람들에게 고마운 사람을 떠올려 감사 편지를 쓰게 하고, 받는 사람이 어떤 기분일지 짐작하게 했습니다. 그리고 실제로 편지를 받은 사람에게 물었습니다. 세 실험에서 쓴 사람들은 받는 사람이 얼마나 놀라고 기뻐할지는 낮게, 얼마나 어색해할지는 높게 짐작했습니다. 그리고 받는 사람이 어색해하거나 덜 기뻐할 거라고 짐작할수록, 고마움을 표현하려는 마음도 약했습니다. 괜히 어색하게 만들까 봐 삼킨 고마움이, 사실은 그 사람이 가장 듣고 싶던 말일 수 있습니다.", src:"Kumar · Epley (2018), Undervaluing gratitude, Psychological Science 29(9), 1423–1435"},
  3:{who:"나사로의 무덤 앞의 예수", scr:"w4_jn11", body:"나사로가 죽은 뒤 예수께서 베다니에 오셨을 때, 마르다와 마리아는 같은 말로 예수님을 맞았습니다. “주님, 주님이 여기 계셨더라면 내 오빠가 죽지 않았을 것입니다”(21, 32절). 그런데 예수님의 대답은 같지 않았습니다. 이야기를 이어 가는 마르다에게는 말씀으로 답하셨고(“나는 부활이요 생명이다”), 발 앞에 엎드려 우는 마리아 앞에서는 “그를 어디에 두었느냐?” 물으시고 함께 눈물을 흘리셨습니다. 같은 문장 밑에 다른 마음이 있었고, 예수님의 첫마디도 달랐습니다.",
     ins:"그 마음을 알아주는 위로", insBody:"위로를 연구하는 학자들은 위로하는 말을 ‘사람 중심’의 정도로 나눕니다. 그 사람의 감정을 알아주고, 그럴 만하다고 여겨 주고, 더 말할 자리를 주는 말일수록 사람 중심이 높고, 그 감정을 깎아내리거나 느끼지 말라고 하는 말일수록 낮습니다. 23개 연구를 모은 메타분석에서 사람 중심이 높은 위로일수록 실제로도 더 도움이 되었고, 도움이 된다고 평가되는 정도에서는 그 차이가 더 뚜렷했습니다(High · Dillard 2012). 2020년의 한 연구는 최근 배우자와 다툰 기혼자들에게, 자기 결혼 이야기를 털어놓은 적이 있는 사람이 이렇게 말한다고 상상하게 했습니다. “그렇게까지 속 끓일 만한 사람은 없어. 그만 우울해해.” 이런 말은 고압적으로 들려 반발을 불렀고, 마음을 낫게 하지 못했습니다. “아끼는 사람과 의견이 갈리는 건 언제나 힘들지. 이 일로 속상한 건 당연해.” 이런 말은 반발 없이 마음을 더 낫게 했습니다(Tian 외 2020).", src:"High · Dillard (2012), A review and meta-analysis of person-centered messages and social support outcomes, Communication Studies 63(1), 99–118 · Tian · Solomon · Brisini (2020), How the comforting process fails, Journal of Communication 70(1), 13–34 — 예문은 펜실베이니아 주립대 보도자료(2020)"},
  4:{who:"느헤미야", scr:"w4_neh2", body:"왕에게 술을 따라 올리던 느헤미야는, 무너진 예루살렘 소식을 듣고 여러 날 슬퍼하며 금식하고 기도했습니다(1:4). 왕 앞에서는 그런 얼굴을 보인 적이 없었는데(2:1), 그날 왕이 먼저 물었습니다. “어찌하여 얼굴에 수심이 가득하냐?” 느헤미야는 몹시 두려웠지만 정중하게 사정을 말했고, 왕이 “네가 원하는 것이 무엇이냐?” 하고 묻자 대답하기 전에 하늘의 하나님께 기도했습니다. 그리고 구체적으로 청했습니다. 오래 품은 말을, 기도 한 줄을 거쳐 꺼냈습니다.",
     ins:"지친 저녁의 물러남", insBody:"심리학자 레페티는 항공 관제사 33명과 그 아내 27명에게서 사흘 동안 날마다 기록을 받았습니다. 관제사들은 일이 바쁘고 고됐다고 느낀 날 저녁, 집에서 더 물러나 있었고, 화를 내는 일은 오히려 줄었습니다. 그 물러남은 주로 아내가 정서적으로 받쳐 준 저녁에 나타났습니다. 레페티는 이 물러남을 지친 사람이 제자리로 돌아오는 회복의 한 방법으로 보았고, 자신이 제안한 이 회복 과정에서 배우자의 정서적 지지를 꼭 필요한 조건으로 보았습니다. 지친 날의 말없음이 늘 무관심은 아닙니다. 오늘의 새 말은 그 물러남을 말로 알리는 문장입니다.", src:"Repetti (1989), Effects of daily workload on subsequent behavior during marital interaction, Journal of Personality and Social Psychology 57(4), 651–659 (pp. 653, 655, 657–658)"},
  5:{who:"브리스길라와 아굴라, 그리고 아볼로", scr:"w4_act18", body:"말 잘하고 성경에 능통한 아볼로가 에베소 회당에서 담대하게 가르쳤습니다. 그가 가르친 것은 정확했지만, 그는 요한의 세례까지만 알았습니다. 그의 말을 들은 브리스길라와 아굴라는 그를 맞아들여 하나님의 길을 더 정확하게 풀어 주었습니다. 그 뒤 아볼로는 아가야로 건너가 은혜로 믿게 된 사람들에게 큰 도움이 되었고, 성경으로 예수가 그리스도이심을 힘 있게 밝혔습니다(27–28절). 바로잡아 준 사람들은 그를 맞아들였고, 바로잡힌 사람은 그 말을 들고 더 멀리 갔습니다.",
     ins:"내 말투는 생각만큼 전해지지 않습니다", insBody:"크루거와 에플리 연구팀은 사람들에게 비꼬는 말, 진지한 말, 농담 같은 짧은 문장을 이메일로 보내게 하고, 받는 사람이 그 말투를 얼마나 제대로 알아들을지 짐작하게 했습니다. 다섯 실험에서 보낸 사람들은 자기 말투가 전해질 거라고 실제보다 크게 자신했고, 친구에게 보낼 때도 낯선 사람에게 보낼 때와 똑같이 자신했습니다. 이 과신은 목소리로 말할 때보다 이메일에서 더 컸습니다. 연구자들은 그 까닭을 자기중심성에서 찾습니다. 내가 뜻한 말투가 내 머릿속에서는 또렷이 들리니, 상대에게도 그렇게 들릴 거라 여긴다는 것입니다. 단톡방의 농담 한 줄이 꼭 그렇습니다.", src:"Kruger · Epley · Parker · Ng (2005), Egocentrism over e-mail: Can we communicate as well as we think?, Journal of Personality and Social Psychology 89(6), 925–936"},
  6:{who:"보아스와 일꾼들", scr:"w4_ru2", body:"룻이 이삭을 줍던 밭에 주인 보아스가 왔습니다. 그가 일꾼들에게 건넨 첫마디는 “여호와께서 여러분과 함께하시기를!”이었고, 일꾼들은 “여호와께서 주인께 복을 주시기를!”로 답했습니다. 주인과 일꾼 사이에 오간 인사에 하나님의 이름이 들어 있었습니다. 그리고 그 밭에서 시작된 이야기 끝에, 이방 여인 룻은 보아스의 아내가 되고 다윗의 증조할머니가 됩니다(4:13, 17).",
     ins:"한 사람을 위해 기도하면", insBody:"램버트와 핀챔 연구팀은 사람들을 세 무리로 나누어 4주 동안 날마다 하게 했습니다. 가까운 친구의 안녕을 위해 기도하기, 아무 주제로나 기도하기, 그 친구에 대해 좋은 생각을 하기. 4주 뒤, 친구를 위해 기도한 사람들이 그 친구를 더 용서했습니다. 처음의 용서 정도를 고려한 뒤에도 그랬습니다. 그 사이 그들 안에서 자란 것은 자기를 내세우지 않고 남을 위하는 마음이었고, 그 마음이 용서로 이어졌습니다. 또 다른 연구에서는 연인을 위해 기도한 사람들이 연인을 더 용서할 마음을 보였습니다. 이번 주에 날마다 빈 복 한 줄도, 그 사람을 위한 짧은 기도였습니다.", src:"Lambert · Fincham · Stillman · Graham · Beach (2010), Motivating change in relationships: Can prayer increase forgiveness?, Psychological Science 21(1)"}
};

  3:{nm:"필요를 묻는 말", word:"지금 해결이 필요해, 아니면 그냥 들어 줄까?", why:"무거운 마음 앞에서 내가 할 말을 고르기 전에, 그 사람에게 무엇이 필요한지 먼저 묻습니다. 해결책이 필요한 때도 있지만, 묻고 나서 건네면 짐이 아니라 도움이 됩니다.",

  4:{nm:"때를 고르는 말", word:"정말 듣고 싶은데, 지금은 너무 지쳤어. 아침에 들어도 될까?", why:"지금 들을 힘이 없을 때, 건성으로 듣거나 말없이 물러나지 않고 그렇다고 말합니다. 그리고 다시 들을 때를 약속합니다. 내가 꺼낼 말이 있을 때도 같습니다. 그 사람의 때를 먼저 묻습니다. 이 문장은 애덤 맥휴가 하루 중 가장 지친 시간에 가족과 함께 있는 우리에게 권한 말을 줄여 옮긴 것입니다.",

function w4WordPanel(n){
  const w=W4_WORDS[n]; if(!w) return "";
  return `<div class="panel soft"><p class="ph">오늘의 새 말 — ${w.nm}</p><p class="serif" style="font-size:1.2em;font-weight:700">“${w.word}”</p><p class="small">${w.why}</p>
    ${w.ex.map(e=>`<p class="small">${e}</p>`).join("")}</div>
  ${fChips(n,"w_aloud","외국어 회화 문장처럼, 소리 내어 세 번 말해 보세요",["소리 내어 말해 봤어요"])}
  ${fText(n,"w_mine","내 말투로 고쳐 쓴 오늘의 새 말",{ph:w.word})}`;
}

function w4Who(){ return (F(1,"kp_who","",4)||"").trim(); }
function hasBatchim(w){ const t=String(w||"").trim(); const c=t.charCodeAt(t.length-1); return c>=0xAC00&&c<=0xD7A3 ? (c-0xAC00)%28!==0 : false; }
function jo(w,a,b){ return `${w}${hasBatchim(w)?a:b}`; }
function w4WhoObj(){ const w=w4Who(); return w?jo(esc(w),"을","를"):"그 사람을"; }
function w4Daily(){ const a=(F(1,"bl_daily",[],4)||[]).filter(x=>x!=="그 밖에"); const own=(F(1,"bl_daily_own","",4)||"").trim(); if(own) a.push(own); return a.join(", "); }
const YD_BLESS=["빌었어요","잊었어요","기회가 없었어요"];
function w4BlessExtra(n){
  const who=w4Who(), daily=w4Daily();
  return `<div class="panel soft" style="margin-top:14px"><p class="ph">오늘의 복 한 줄</p><p class="small">인사에 복을 붙입니다. 현관에서, 전화를 끊을 때, 잠자리에 들기 전에. 날마다는 짧게, 민수기 6장 24절에서 온 한 줄이면 됩니다.${n<6?" 어떻게 되었는지는 내일 아침에 묻습니다.":" 시리즈가 끝난 뒤에도 현관에서 이어 가 보세요."}</p>
    ${fChips(n,"pl_bless_to","누구에게",[{v:"daily",t:daily||"날마다 인사할 가까운 사람"},{v:"kp",t:who?`${who} — 이번 주 복을 빌 사람`:"이번 주 복을 빌 사람"}],{multi:true})}
    ${fText(n,"pl_bless","오늘의 복 한 줄",{ph:n===6?"예: 하나님이 이번 주도 너를 지켜 주시기를.":"하나님이 오늘 너를 지켜 주시기를."})}</div>`;
}
function planOfW(d,w){ const g=k=>(F(d,k,"",w)||"").toString().trim(); const when=g("pl_when_own")||g("pl_when"), old=g("pl_old_own")||g("pl_old"), nw=g("pl_new"); return (when||old||nw)?{when,old,nw}:null; }

function w4Close(n){ return carryLayer(n,{intro:W4_INTRO, pray:W4_PRAY[n]||"", carry:W4_CARRY[n], word:W4_WORDS[n], olds:W4_OLDS[n], oldPh:"예: 그래? 그건 그렇고…", planHint:"오늘 옛 말이 나올 만한 순간 하나를 미리 정하고, 그때 할 새 말을 정해 둡니다. 연구에서 ‘언제, 무엇을’까지 정해 둔 다짐이 그냥 한 결심보다 훨씬 잘 지켜졌습니다(실행 의도).", extra:w4BlessExtra(n)}); }

function w4Rel(){ return F(1,"kp_rel",null,4); }
function w4Mode(){ const r=w4Rel(); return r==="배우자"?"sp":r==="연인"?"lv":r?"g":null; }
function w4Couple(){ const m=w4Mode(); return m==="sp"||m==="lv"; }
function w4CPv(){ const sp=w4Mode()==="sp"; return W4_CP.map(p=>({...p,t:sp?p.t:p.g})); }
function w4POv(){ const sp=w4Mode()==="sp"; return W4_PO.map(p=>({...p,t:sp?p.t:p.g})); }
function w4ADv(){ const c=w4Couple(); return W4_AD.map(p=>({...p,t:c?p.t:p.g})); }
function w4Score(items, day, prefix){ const sub={}; let a=0; items.forEach(p=>{ const pts=p.pts||5; let v=F(day,prefix+p.id,null,4); if(v===null) return; a++; if(p.r) v=(pts-1)-v; const f=p.f; (sub[f]=sub[f]||{s:0,c:0}); sub[f].s+=v*4/(pts-1); sub[f].c++; });
  const o={}; Object.keys(sub).forEach(f=>o[f]=sub[f].s/sub[f].c); return {sub:o, answered:a, done:items.length>0&&a===items.length}; }
function w4Ok(f){ const N=W4_NORM[f]; return !!(N&&N.ok); }
function w4Z(f,m){ const N=W4_NORM[f]; if(!N||!N.ok||m==null) return null; return ((m*(N.pts-1)/4+(N.b??1))*N.k-N.M)/N.SD; }
function w4NM(f){ const N=W4_NORM[f]; return (N.M/N.k-(N.b??1))*4/(N.pts-1); }
/* 원 눈금 합계(1부터): 앱 평균 m(0–4)을 문항 수 k, 칸 수 pts로 되돌림 */
function w4Sum(m,k,pts){ return Math.round((m*(pts-1)/4+1)*k); }
function w4Items(n, items, prefix, labels, stem, from){ const num=labels.some(x=>/^\d$/.test(x)); return `${stem?`<p class="small">${stem}</p>`:""}${items.map(p=>`<div class="phrase"><div class="t">${p.t}</div>${fSeg(n,prefix+p.id,labels,{num,from})}</div>`).join("")}`; }
/* ‘특히’ 인용 — 원 응답(역채점 전) 기준으로 가장 높게 답한 문항만. 모두 같은 답이면 인용하지 않음 */
function w4Same(items, day, prefix){ const vs=items.map(p=>F(day,prefix+p.id,null,4)); return vs.length>1&&vs.every(v=>v!==null&&v===vs[0]); }
function w4Top(items, day, prefix, pick, minV){ const pool=items.filter(pick); const val=p=>F(day,prefix+p.id,0,4)||0; const vs=pool.map(val); if(!vs.length) return []; const mx=Math.max(...vs); const tie=pool.filter(p=>val(p)===mx); if(mx<minV||tie.length>2) return []; return tie.map(p=>qb(p.t)); }   /* 셋 이상이 같으면 둘만 골라 ‘특히’라 하지 않음 */
function w4Low(items, day, prefix, pick, maxV){ const pool=items.filter(pick); const val=p=>F(day,prefix+p.id,0,4)||0; const vs=pool.map(val); if(!vs.length) return []; const mn=Math.min(...vs); const tie=pool.filter(p=>val(p)===mn); if(mn>maxV||tie.length>2) return []; return tie.map(p=>qb(p.t)); }
function w4Bars(sub, keys, note, noNorm){ return `<div class="bars">${keys.filter(k=>sub[k]!=null).map(k=>{ const ok=!noNorm&&w4Ok(k), nm=ok?w4NM(k):null; return `<div class="bar"><span class="nm">${W4_SUB[k].nm}</span><span class="tr"><span class="tk in"><i style="width:${sub[k]/4*100}%"></i>${ok?`<b class="avg" style="left:${nm/4*100}%" aria-hidden="true"></b>`:""}</span><span class="small">${sub[k].toFixed(1)}${ok?` · 평균 ${nm.toFixed(1)} · ${w3Lv(w4Z(k,sub[k]))}`:""}</span></span></div>`; }).join("")}</div>${note?`<p class="small" style="margin:2px 0 0">${note}</p>`:""}`; }
function w4Perm(k){ return W4_PERM[k]?"저자의 허락을 받아 ":""; }

  ]);

function w4ApNote(){ return `<p class="small" style="margin-top:12px">관계 속 감사 척도(Gordon 외 2012)의 ‘감사하는 마음’ 9문항을 ${w4Perm("ap")}이 워크북이 우리말로 옮겼습니다(‘my partner’를 ‘그 사람’으로). 미국에서 주로 연애 중인 대학생과 성인을 대상으로 만든 척도이고, 내적 일치도는 .74–.87, 9개월 뒤 다시 잰 상관은 .61이었습니다. 한국판 연구를 찾지 못했고 견줄 만한 규준(평균과 표준편차)이 발표되지 않아 남과 견주지 않습니다. 배우자나 연인이 아닌 사람을 두고 답하면, 그만큼 더 어림으로 비추는 거울입니다. 임상 진단이 아닙니다. 근거는 [더보기 → 출처]에 있습니다.</p>`; }

function w4AdNote(){ const c=w4Couple();

const W4_SERMON = `<p>가까운 사이일수록 말은 소리 없이 사람을 시들게 합니다. 설교는 교회를 세울 때 받은 축하 화분들이 관심이 줄면서 시들어 간 이야기로 시작합니다. 베드로는 가장 가까운 관계에서 “지식을 따라 함께 사십시오”, “존중하십시오”라고 말합니다(벧전 3:7). 이 둘을 뒤집으면 서로를 시들게 하는 두 길이 보입니다. 존중이 빠진 말과 지혜가 빠진 말입니다.</p>
  <p>존중이 빠진 말은 세 모양입니다. 다 안다는 듯이 지레짐작하는 말, ‘말 안 해도 알겠지’ 하며 고마움을 삼키는 말, 그리고 상대가 꺼낸 기쁨과 아픔을 ‘그건 그렇고’로 넘기는 말입니다(잠 18:13). 지혜가 빠진 말도 세 모양입니다. 상대의 마음이 아니라 내 마음에 맞춘 말(“나 때는 더했어”), 때와 상황에 어긋난 말, 그리고 한없이 가벼운 말(“살 좀 쪘나 봐?”)입니다(잠 12:18). 악의는 없지만, 말하는 사람은 자기가 그런 말을 하는지조차 잘 모릅니다.</p>
  <p>그 밑에는 하나님이 빠진 자리가 있습니다. 하나님이 빠지면 사람의 값을 내 저울로 매기고(존중이 아니라 평가), 내 판단을 마지막 판단으로 여깁니다(잠 9:10). 사무엘상 25장의 나발이 그랬습니다. “다윗이 누구냐?” 그의 말에는 존중도 지혜도 없었고, 그의 종은 “아무도 그분께 말을 붙일 수가 없습니다”라고 했습니다. 믿는 우리도 아는 것과 믿는 것이 삶까지 이어지지 못하면 같은 말을 합니다. 그리고 나발의 말을 들은 다윗마저 사백 명을 무장시켰습니다.</p>
  <p>하나님은 아비가일을 보내셨습니다. 아비가일은 다윗에게 그가 하나님 안에서 누구인지 기억나게 했고(존중), 책망 대신 물러설 길을 열어 주었습니다(지혜, 25:26). 그리고 때가 차자 하나님은 다윗만이 아니라 나발 같은 우리를 위해 아들을 보내셨습니다. 우리는 이미 그분의 충만함에서 은혜 위에 은혜를 받았습니다(요 1:16). 문제는 가뭄이 아니라 물꼬입니다.</p>
  <p>설교는 에베소서 4:29의 ‘세우는 좋은 말’을 향해 세 물꼬를 트자고 권했습니다. 존중의 물꼬는 하나님 보시는 눈으로 보게 해 달라고 기도하고, 독심술을 멈추고, 당연하게 여기던 것에 날마다 고맙다고 말하는 것입니다. 지혜의 물꼬는 아침마다 말씀의 축복과 선한 말을 회화처럼 입에 익히고 글로 써 보는 것, 그리고 가까운 사람에게 내 말을 지적해 달라고 허락하는 것입니다. 복의 물꼬는 욕이 나오려는 순간 도리어 복을 비는 것입니다(벧전 3:9). 먼저 집에서, 그리고 공동체 안에서. 그렇게 누군가의 아비가일로 살아가자는 것이 설교의 결론입니다.</p>`;

    ${cnt===outP.length?wbPickList("out"):pendHTML(cnt,outP.length)}
    ${doneBar(n,2)}</section>
  <section class="layer" id="L3">${layerHead(n,3,"함께 걸을 사람, 그리고 이번 주의 실","")}

    ${fText(n,"when","금요일 언제 만날까요(또는 통화할까요)?")}
    ${fText(n,"signal","우리의 신호어",{hint:"대화하다 한쪽이 힘들어지면 잠시 멈추자는 약속의 말. 예: “잠깐 쉬자”, “노란불”"})}

    ${wbWordPanel(n,W1B_WORDS)}
    ${doneBar(n,3)}</section>`+wbClose(n,1));
}

/* ---------- 1주 2일째 — 내 안의 가장 큰 목소리 ---------- */

    ${fText(n,"own","목록에 없지만 내 안에서 자주 들리는 말 (선택)",{area:true,hint:"한 줄에 하나씩."})}

    <p class="small">검증된 척도의 열네 문장입니다. 일이 잘못되거나 바라던 대로 되지 않았을 때를 떠올리며, 각 문장이 나와 얼마나 같은지 고르세요. ‘전혀’는 ‘전혀 나와 같지 않다’, ‘매우’는 ‘매우 나와 같다’입니다.</p>
    ${W1B_FS.map(p=>`<div class="phrase"><div class="t">${p.t}</div>${fSeg(n,"fs_"+p.id,W1B_FS_PTS)}</div>`).join("")}
    <p class="small">${R.answered} / ${W1B_FS.length}</p>
    <h3 class="h3">한 가지만 더</h3>
    ${fChips(n,"safety","요즘, 나 자신이 너무 싫어서 스스로를 벌주거나 해치고 싶은 마음이 든 적이 있나요?",[{v:"yes",t:"예"},{v:"no",t:"아니오"}])}
    ${safety==="yes"?wbWarn():""}
    ${wbDxNav(dx,"결과 보기 ›")}`;
  if(dx===3){ const left=(inP.length-cntI)+(W1B_FS.length-R.answered);
    body=`${wbDxBar(dx,steps)}${left?`<p class="small">아직 답하지 않은 문장이 ${left}개 있습니다. 앞으로 돌아가 마저 답하면 결과가 나옵니다.</p>`:""}
    ${R.done?`<h3 class="h3">실수한 날 내 안의 두 목소리</h3>${w1bFsBars()}${w1bFsBrief()}`:""}
    ${safety==="yes"||(R.done&&R.sub.crit>=3.5)?`<div class="panel warn"><p class="ph">혼자 견디지 마세요</p><p>나를 몰아세우는 마음이 클 때는, 이 점검보다 사람이 먼저입니다. 오늘 믿을 수 있는 한 사람에게 이야기해 주세요.</p><a class="btn" href="#/help/stop">멈추고 싶을 때</a></div>`:""}

  const inner=[...inP.filter(p=>(F(n,"ph_"+p.id,0)||0)>0).map(p=>p.t), ...String(F(n,"own","")).split("\n").map(s=>s.trim()).filter(Boolean)];
  const picks=[...PHRASES.filter(p=>p.dir==="out"&&(F(1,"ph_"+p.id,0)||0)>0).map(p=>p.t), ...String(F(1,"own_o","")).split("\n").map(s=>s.trim()).filter(Boolean), ...inner].filter((v,i,a)=>a.indexOf(v)===i);
  const typeChips=(i)=>{ const sel=F(n,`s${i}_type`,null)||typeOfText(F(n,`s${i}_text`,"")); return `<div class="chips" role="group">${TYPES.map(t=>`<button type="button" class="chip" aria-pressed="${sel===t.id}" data-chip="2|s${i}_type|0" data-val="${t.id}">${t.nm}</button>`).join("")}</div>`; };

    ${[0,1,2].map(i=>`<div class="panel soft"><p class="ph">문장 ${i+1}${i>0?" (선택)":""}</p>
      ${inner.length?`<div class="chips" role="group">${inner.map(x=>`<button type="button" class="chip" aria-pressed="${F(n,`s${i}_text`,"")===x}" data-fill="2|s${i}_text" data-val="${esc(x)}">“${esc(x)}”</button>`).join("")}</div>`:""}

    <div class="quote">제자는 스승보다 높지 않다. 그러나 <b>누구든지 다 배우고 나면 자기 스승처럼 되는 법이다.</b><span class="ref">누가복음 6:40 · NJHV</span></div>
    <div class="quote" style="font-size:.98em">가족을 돌아보는 것은 잘못을 찾기 위해서가 아니라, 무엇이 건강했고 무엇이 건강하지 않았는지 있는 그대로 보고, 그리스도 안에서 자라고 치유되어 참된 나로 성숙하기 위해서입니다.<span class="ref">피터 · 제리 스캐지로</span></div>
    ${safety==="yes"?`<div class="panel warn"><p>이 질문은 오늘 건너뛰어도 됩니다.</p><div class="seg" style="grid-template-columns:1fr 1fr"><button type="button" aria-pressed="${skip}" data-seg="2|skipOrigins" data-val="1">건너뛰기</button><button type="button" aria-pressed="${!skip}" data-seg="2|skipOrigins" data-val="0">지금 해 보기</button></div></div>`:""}
    <p class="small">가족을 돌아보다가 폭력이나 학대의 기억이 떠오른다면, 오늘은 여기서 멈추어도 됩니다. 그것은 당한 사람의 잘못이 아닙니다. 믿을 수 있는 사람이나 도움을 줄 수 있는 곳에 먼저 이야기해 주세요. <a href="#/help/stop">멈추고 싶을 때</a></p>

    ${wbWordPanel(n,W1B_WORDS)}
    ${stopLine()}${doneBar(n,3)}</section>`+wbClose(n,1));
}

    ${all?`${w2SitBrief()}<p class="small">이 아홉 상황은 이 워크북이 만든 연습이라 검증된 척도가 아닙니다. 점수로 읽지 말고, 내 말의 모양을 비추어 보는 거울로 쓰세요.</p>`:pendHTML(si.answered,W2_SIT.length)}
    ${doneBar(n,2)}</section>

    <h3 class="h3">이번 주 대화 파트너</h3>

    ${fChips(n,"partner_keep","",p1?[{v:"same",t:"1주 파트너와 그대로"},{v:"new",t:"새 파트너와"}]:[{v:"new",t:"파트너 정하기"}])}

    <h3 class="h3">신호어, 그리고 옮기기 전의 멈춤</h3>

    ${doneBar(n,3)}</section>`+wbClose(n,2));
}

/* ---------- 2주 2일째 — 그 밑의 마음 ---------- */
function vW2BDay2(){
  const n=2; const dx=Math.min(4,Math.max(1,F(n,"dx",1)));
  const A=w2bFn(), U=w2bAu(), H=w2bHh();
  const steps=["","자리 지도","두려움과 가면","얻고 싶을 때","결과"];
  let body="";
  if(dx===1) body=`${wbDxBar(dx,steps)}<div class="privacy">이 점검은 이 기기에만 저장됩니다. 누구도 볼 수 없습니다. 좋아 보이는 답이 아니라, 정직한 답을 고르세요.</div>
    <p>설교는 속이는 말 밑에서 두 가지가 작동한다고 했습니다. 사랑과 인정과 좋은 평판을 잃을까 하는 <b>두려움</b>, 그리고 내 손으로 직접 만들어 내려는 <b>교만과 욕심</b>. 그리고 속이는 말이 익숙해지면 <b>가면</b>을 벗는 법 자체를 잊게 된다고 했습니다. 오늘은 이 셋을 봅니다. 두 척도는 한국에서 타당화한 한국판이고, 정직-겸손은 검증된 원척도의 공식 한국어판(원저자들이 공개한 문장)입니다.</p>
    <h3 class="h3">1 / 3 · 자리 지도 — 누구 앞에서?</h3>
    <p class="small">같은 사람이라도 자리에 따라 말이 달라집니다.</p>
    ${fChips(n,"place","속이는 말이 가장 쉽게 나오는 자리",W2_PLACES,{multi:true})}
    ${fChips(n,"hard","있는 그대로 말하기 가장 어려운 자리",W2_PLACES)}
    ${fText(n,"safe","반대로, 있는 그대로 말해도 안전하다고 느끼는 사람 한 명 (이름이나 관계)")}
    ${wbDxNav(dx,"다음 ›")}`;
  if(dx===2) body=`${wbDxBar(dx,steps)}<h3 class="h3">2 / 3 · 사람들의 평가 앞에서 (8)</h3>
    ${wbItems(n,W2B_FN,"fn_",WB_P5FN,"각 문장이 나에게 얼마나 해당하는지 고르세요. 1은 ‘매우 그렇지 않다’, 5는 ‘매우 그렇다’입니다.")}
    <p class="small">${A.answered} / ${W2B_FN.length}</p>
    <h3 class="h3">진짜 나와 남의 기대 사이 (8)</h3>
    ${wbItems(n,W2B_AU,"au_",WB_P5,"각 문장이 평소 내 생각과 느낌을 얼마나 잘 나타내는지 고르세요. 1은 ‘전혀 그렇지 않다’, 5는 ‘매우 그렇다’입니다.")}
    <p class="small">${U.answered} / ${W2B_AU.length}</p>${wbDxNav(dx,"다음 ›")}`;
  if(dx===3) body=`${wbDxBar(dx,steps)}<h3 class="h3">3 / 3 · 얻고 싶을 때, 가지고 싶을 때 (10)</h3>
    <p class="small">제시되는 문장을 잘 읽고 그 문장에 얼마나 동의하는지 표시해 주십시오. 몇몇 문장은 일부러 극단적인 상황을 가정합니다. 솔직하게 답할수록 거울이 정확해집니다.</p>
    ${W2B_HH.map(p=>`<div class="phrase"><div class="t">${p.t}</div>${fSeg(n,"hh_"+p.id,WB_HH_PTS)}</div>`).join("")}
    <p class="small">${H.answered} / ${W2B_HH.length}</p>
    ${fChips(n,"sex","성별 — 이 척도는 남녀의 평균이 달라, 평균과 견줄 때만 씁니다",["여성","남성","답하지 않음"],{hint:"이 기기에만 저장됩니다."})}
    ${wbDxNav(dx,"결과 보기 ›")}`;
  if(dx===4){ const left=(W2B_FN.length-A.answered)+(W2B_AU.length-U.answered)+(W2B_HH.length-H.answered);
    body=`${wbDxBar(dx,steps)}${left?`<p class="small">아직 답하지 않은 문장이 ${left}개 있습니다. 앞으로 돌아가 마저 답하면 브리핑이 나옵니다.</p>`:""}
    ${w2bRootBars()}
    ${w2bRootBrief()}
    ${A.done&&U.done&&H.done?w2bRootNote():""}
    ${wbOld2HTML()}
    <div class="row" style="margin-top:12px"><button type="button" class="btn" data-dx="prev">‹ 답 고치기</button></div>`; }
  const sceneOpts=[...new Set(w2Sit().picks)]; const sn=w2Scene();
  return dayShell(n, w2bYd(n)+calmLayer(n)+`
  <section class="layer" id="L2">${layerHead(n,2,"그 밑의 마음","")}${wbFig(n,W2B_NEW)}${wbIns(n,W2B_NEW)}${body}${dx===4?doneBar(n,2):""}</section>
  <section class="layer" id="L3">${layerHead(n,3,"한 장면 해부","")}
    <p>점검이 내 말의 지도였다면, 이제 그 지도 위의 한 지점을 자세히 들여다봅니다. 진단은 혼내려는 것이 아니라 고치려는 것입니다. 두 질문으로 합니다. <b>내 말이 상대 머릿속에 실제와 다른 그림을 그렸나? 그 그림은 무엇을 지키거나 높이고 있었나?</b></p>
    ${sceneOpts.length?fChips(n,"scene","1. 최근에 실제로 있었던 장면 하나 — 월요일에 고른 대답 가운데, 또는 직접",sceneOpts.map(x=>({v:x,t:x}))):""}
    ${fText(n,"scene_own",sceneOpts.length?"또는 그때 내가 한 말 그대로":"1. 최근에 내가 속인 말 하나 — 그때 한 말 그대로")}
    ${sn.said?`
    ${fText(n,"fact","2. 실제로 있었던 일 — 카메라로 찍은 듯, 녹음기로 들은 듯",{area:true,hint:"해석이나 평가 없이, 일어난 일만 적습니다. 박재연은 관찰을 ‘카메라로 찍은 듯’ 묘사하는 것이라고 말합니다."})}
    ${fChips(n,"pic","3. 내 말을 듣고 상대 머릿속에 그려졌을 그림",W2_PIC)}
    ${fText(n,"pic_own","다른 그림이라면 (선택)")}
    ${fChips(n,"guard","4. 그 말은 무엇을 지키려던 말이었나요?",W2_KEEP,{multi:true})}
    ${fChips(n,"guard","…아니면 무엇을 높이거나 얻으려던 말이었나요?",W2_RAISE,{multi:true,hint:"둘 다 골라도 됩니다. 지키려는 얼굴과 높이려는 얼굴이 한 말 안에 함께 있기도 합니다."})}
    ${fChips(n,"afraid","5. 그대로 드러났다면, 무엇이 두려웠나요?",["실망한 얼굴","꾸중이나 벌","등 돌림, 관계가 끊김","무시, 창피","버림받음","잘 모르겠다"],{multi:true})}
    ${fText(n,"felt","6. 그때 내가 정말 느낀 것 — 한 줄로 (선택)",{ph:"예: 사실 많이 지쳐 있었다."})}
    ${fChips(n,"belief","7. 그 두려움 밑에 깔린 믿음에 가장 가까운 것",BELIEFS)}
    ${F(n,"belief",null)?fRange(n,"belief_pct","이 믿음을 지금 얼마나 믿고 있나요?",{min:0,max:100,step:5,lo:"전혀",hi:"완전히"}):""}
    ${F(n,"belief",null)&&F(n,"belief_pct",null)!=null?sceneCard(sn,"해부 결과")+`<p class="small">목요일에 이 장면을 들고 하나님 앞에 진짜 이름으로 서고, 금요일에 지혜로운 침묵이었는지 가려 보고, 토요일에 이 믿음을 다시 잽니다.</p>`:""}`:""}
    ${wbWordPanel(n,W2B_WORDS)}
    ${doneBar(n,3)}</section>`+wbClose(n,2));
}

/* ---------- 2주 3일째 — 하나님에 대한 거짓 그림 ---------- */
function w2bFace(){ const g=F(2,"guard",[],2)||[]; const hi=g.some(x=>W2_RAISE.includes(x)), lo=g.some(x=>W2_KEEP.includes(x)); if(hi&&lo) return "both"; if(hi) return "raise"; if(lo) return "keep"; const ty=w2bType(); return ty&&ty.k!=="free"?ty.k:null; }
const WB2_FACE_TXT={keep:`<p>두려움에서 나오는 속이는 말 밑에는 이런 믿음이 있습니다. <b>사랑은 잘 보여야만 받을 수 있고, 들키면 잃는다.</b> 하나님의 사랑마저 그렇게 조건부로 믿으면, 사람 앞에서만이 아니라 하나님 앞에서도 나를 가립니다.</p><div class="quote">두려움은 형벌과 관련이 있습니다.<span class="ref">요한일서 4:18 · NJHV</span></div>`,
  raise:`<p>교만에서 나오는 속이는 말 밑에는 이런 마음이 있습니다. <b>내 가치와 복을 하나님께 받지 않고, 내 손으로 만들어 내려는 마음.</b> 그래서 나를 실제보다 크게 보이게 하고, 남보다 앞서려고 말을 꾸밉니다. 요한은 이것을 ‘삶의 자랑’이라고 부릅니다(요일 2:16).</p>`,
  both:`<p>복을 움켜쥐려는 손과 잃을까 떠는 마음이 한 사람 안에 함께 있습니다. 더 가지려고 꾸미면서, 드러날까 봐 두려워합니다.</p>`};
function vW2BDay3(){
  const n=3; const sn=w2Scene(); const G=w2bAg(); const face=w2bFace(); const rs=F(n,"rules",[])||[];
  const rvMe=F(n,"rv_me",null), rvOt=F(n,"rv_other",null); const RV=["훨씬 나쁘게","조금 나쁘게","그대로","조금 좋게","훨씬 좋게"];
  return dayShell(n, w2bYd(n)+calmLayer(n)+`
  <section class="layer" id="L2">${layerHead(n,2,"하나님에 대한 거짓 그림","")}
    ${wbFig(n,W2B_NEW)}${wbIns(n,W2B_NEW)}
    <p>설교는 속이는 말의 가장 근본적인 뿌리에 ‘하나님에 대한 거짓 그림’이 있다고 했습니다. 늘 좋은 것은 감추시고, 제약을 거시고, 조건적으로 사랑하시는 분. 동산의 이야기를 순서대로 보면, 그 그림을 믿자 사람은 하나님이 주시는 것을 기다리지 않고 스스로 움켜쥐었고(창 3:6), 그다음에야 부끄러움과 두려움과 숨음이 따라왔습니다(3:7, 10).</p>
    ${sn.said?`<p class="small">어제 해부한 말 — ${esc(sn.said)}${sn.belief?` · 그 밑의 믿음 “${esc(sn.belief)}”`:""}</p>`:""}
    <h3 class="h3">하나님 앞의 내 마음 — 열 문장</h3>
    <p class="small">입으로 하는 고백이 아니라, 실제로 내 마음이 하나님 앞에서 어떤지를 봅니다. 검증된 척도의 문장입니다.</p>
    ${wbItems(n,W2B_AG,"ag_",WB_P7,"각 문장이 나에게 얼마나 해당하는지 고르세요. 1은 ‘전혀 그렇지 않다’, 7은 ‘매우 그렇다’입니다.")}
    ${G.done?`${w2bAgBar()}${w2bGodBrief()}${w2bSynth()}${w2bGodNote()}`:pendHTML(G.answered,W2B_AG.length)}
    ${fChips(n,"approval","나에게 하나님의 말씀보다 더 크게 들리는 반응은 누구의 것인가요?",["부모님","배우자","직장 상사나 동료","교회 사람들","친구들","SNS의 반응","잘 모르겠다"],{multi:true,hint:"그 사람의 실망이나 칭찬이 두려움과 교만을 움직이는 자리입니다."})}
    <h3 class="h3">내 속이는 말의 얼굴</h3>
    ${face?`<p class="small">어제의 장면 해부와 점검으로 보면 — <b>${FACE_NM[face]}</b>에 가깝습니다.</p>${WB2_FACE_TXT[face]}`:fOpts(n,"face","어제 기록이 없어 한 번만 묻습니다 — 내 속이는 말은 주로 어느 얼굴인가요",[{v:"keep",t:"지키려는 얼굴 — 잃을까 봐 두려워서"},{v:"raise",t:"높이려는 얼굴 — 좋아 보이고, 얻고, 이기려고"},{v:"both",t:"둘 다 — 움켜쥐면서, 떨면서"}])}
    ${!face&&F(n,"face",null)?WB2_FACE_TXT[F(n,"face",null)]:""}
    <details class="voice"><summary><span class="nm">더 깊이 — 이 그림을 어디서 배웠을까 (선택)</span></summary>
      ${fChips(n,"who","처음 배운 자리는",WHO,{multi:true})}
      ${fChips(n,"rules","우리 집이나 학교, 교회에 있던 보이지 않는 규칙 가운데, 오늘의 내 말과 닮은 것",W2_RULES.map(r=>({v:r.id,t:r.t})),{multi:true})}
      ${fText(n,"rule_own","직접 쓰는 규칙")}
      ${rs.length?`<div class="panel soft"><p class="ph">새 가족의 규칙</p><p class="small">그리스도 안에서 우리는 새 가족이 되었고, 그 가족의 규칙은 “우리는 서로의 지체”입니다(엡 4:25).</p>${rs.map(id=>{const r=W2_RULES.find(x=>x.id===id); return r?`<p class="small" style="margin-top:12px">“${r.t}” 대신</p>${verseHTML(r.v,{name:S.name})}`:"";}).join("")}</div>`:""}
    </details>
    <p class="small">숨는 이유가 다 내 잘못 때문은 아닙니다. 누군가에게 당한 일 때문에 숨어 왔다면, 그것은 당한 사람의 잘못이 아닙니다.</p>
    ${stopLine()}${doneBar(n,2)}</section>
  <section class="layer" id="L3">${layerHead(n,3,"드러내면 어떻게 될까","")}
    ${wbIns(n,W2B_NEW,true)}
    <p>속이는 말 밑에는 대개 짐작이 있습니다. ‘이걸 드러내면 사람들이 나를 덜 좋아할 거야.’ 오늘은 그 짐작을 한 번 시험해 봅니다.</p>
    ${fText(n,"rv_what","말하지 못하고 있는 약함이나 실수 하나 — 적지 않고 떠올리기만 해도 됩니다 (선택)")}
    <div class="field"><div class="lbl">그것을 믿을 만한 한 사람에게 털어놓으면, 그 사람은 나를 —</div>${fSeg(n,"rv_me",RV)}</div>
    <div class="field"><div class="lbl">거꾸로, 내가 아끼는 친구가 같은 일을 나에게 털어놓는다면, 나는 그 친구를 —</div>${fSeg(n,"rv_other",RV)}</div>
    ${rvMe!=null&&rvOt!=null?`<div class="panel soft"><p>${rvOt>rvMe?`친구가 털어놓으면 ‘${RV[rvOt]}’ 보겠다고 하시면서, 내가 털어놓으면 ‘${RV[rvMe]}’ 보일 거라고 고르셨습니다. 오늘 배운 ‘아름다운 엉망 효과’ 그대로입니다. 드러내면 덜 사랑받으리라는 내 짐작이 실제보다 어두울 수 있습니다.`:rvOt===rvMe?`나와 친구를 같은 눈으로 보셨습니다. 드러내는 일을 두렵게만 보지 않는 마음입니다.`:`털어놓는 나를 친구보다 오히려 좋게 보일 거라고 고르셨습니다. 믿을 만한 사람이 이미 곁에 있다는 뜻일 수 있습니다.`}</p></div>`:""}
    ${fChips(n,"cost","속이는 말이 내게서 빼앗아 간 것",W2_COSTS,{multi:true})}

    <div class="optlist">${JACOB.map(j=>`<button type="button" class="opt" aria-pressed="${name===j}" data-wiz-set="name" data-val="${esc(j)}"><div class="tx">하나님 앞에서, 나는 사실 — ${esc(j)}, 바로 그 이름</div></button>`).join("")}</div>
    ${conf?`<div class="panel soft"><p class="ph">이름 고백</p><p class="serif" style="font-size:1.15em;line-height:1.7">${conf}</p><p class="small">소리 내어 한 번 말해 보세요.</p></div>`:""}`;
  if(step===3) body=`<h3 class="h3">3. 진짜 내 이름을 하나님께 보여 드리기</h3>

    <div class="quote">여러분의 염려를 모두 그분께 던져 맡기십시오. 그분이 여러분을 돌보고 계시기 때문입니다.<span class="ref">베드로전서 5:7 · NJHV</span></div>`;
  if(step===4) body=`<h3 class="h3">4. 하나님의 참된 그림 — 그리고 새 이름</h3>

  if(step===5) body=`<h3 class="h3">5. 굵은 부분을 소리 내어 천천히 세 번</h3>

    <p class="small">소리 내어 읽은 것이 조용히 읽은 것보다 더 잘, 더 오래 기억됩니다(산출 효과).</p>`;
  if(step===6){ const v=VERSES[vid]||{}; const old=quoteOf(sn.said)||"그 말"; const nw=w2NewFor(old,sn.shape);
    if(F(4,"ifthen",null)===null) setF(4,"ifthen",`다음에 “${old}” 같은 말이 나오려 하면, 나는 ${nw} 하고 말하겠다. 그리고 “${v.key||v.t||""}”를 기억하겠다.`);

  if(step===7) body=`<h3 class="h3">7. 다시 재기</h3>

    <p class="small">한 번에 크게 달라지지 않아도 괜찮습니다. 토요일에 한 주의 변화를 함께 봅니다.</p>`;

    <div class="row" style="margin-top:16px">${step>1?`<button type="button" class="btn" data-wiz="prev">이전</button>`:""}${step<7?`<button type="button" class="btn primary" data-wiz="next" ${can?"":"disabled"}>다음</button>`:""}</div>`;
  return dayShell(n, w2bYd(n)+calmLayer(n)+`
  <section class="layer" id="L2">${layerHead(n,2,"내가 입어 온 옷","")}

    ${fChips(n,"coat","내가 입어 온 옷 — 사람들 앞에서 나는 이런 사람이어야 한다고 느낀다",ESAU,{multi:true,hint:"여럿 골라도 됩니다."})}

    ${wbWordPanel(n,W2B_WORDS)}
    ${doneBar(n,2)}</section>
  <section class="layer" id="L3">${layerHead(n,3,"진짜 이름으로 서기","7–10분")}${wiz}${doneBar(n,3)}</section>`+wbClose(n,2));
}

/* ---------- 2주 5일째 — 진실을 알고, 사랑 안에서 ---------- */
function wb2LoveBrief(){
  const lv=w2Love(); if(lv.answered<W2_LOVE.length) return ""; const c=lv.cnt; let p;
  if((c.life||0)===3) p="세 상황 모두에서 참되면서 살리는 쪽을 고르셨습니다. 이미 몸에 밴 말의 자리입니다. 이번 주에는 그 말을 가장 어려운 한 사람에게 건네 보세요.";
  else if((c.flat||0)>=2) p="듣기 좋은 거짓 쪽을 자주 고르셨습니다. 상대를 아끼는 마음에서 나왔겠지만, 실제와 다른 그림을 남깁니다. 칭찬할 수 있는 ‘사실’을 찾아 말하는 연습이 필요합니다. 마음에 드는 점이 하나도 없다면, 마음 써 준 그 사람 자체에 고마워할 수 있습니다.";
  else if((c.knife||0)>=2) p="필터 없는 칼 쪽을 자주 고르셨습니다. 사실이지만 사람을 다치게 하는 말입니다. 말하기 전에, 이 말을 들은 사람이 무엇을 느낄지 한 번 떠올려 보세요.";
  else if((c.mute||0)>=2) p="말하지 않는 쪽을 자주 고르셨습니다. 거짓도 칼도 피했지만, 살리는 말 한마디도 함께 사라질 수 있습니다.";
  else p="상황마다 다른 쪽을 고르셨습니다. 어떤 자리에서 쉽게 무너지는지 살펴보세요.";
  return briefBox(`사랑 안에서 — ${nmOf()}의 말`,[{h:"내 대답",p:Object.keys(LOVE_NM).filter(k=>c[k]).map(k=>`${LOVE_NM[k]} ${c[k]}`).join(", ")+"."},{h:"보이는 것",p},{h:"",p:"이 세 상황은 이 워크북이 만든 연습이라 검증된 척도가 아닙니다."}]);
}

  const box=$("#cardbox"); const vid=F(4,"verse",null); if(!box||!vid) return;
