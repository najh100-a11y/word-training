<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="진실한숲교회 설교 시리즈 『깊은 샘에서 흐르는 말』 4주 워크북">
<meta name="theme-color" content="#F3ECDB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1B28" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="깊은 샘">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>깊은 샘에서 흐르는 말</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/DeepspringSans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/GowunBatang-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Gowun Batang";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/GowunBatang-400.woff2") format("woff2");}
@font-face{font-family:"Gowun Batang";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/GowunBatang-700.woff2") format("woff2");}
@font-face{font-family:"Deepspring Sans";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/DeepspringSans-400.woff2") format("woff2");}
@font-face{font-family:"Deepspring Sans";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/DeepspringSans-600.woff2") format("woff2");}
:root{
  --paper:#F3ECDB; --sheet:#FBF7EC; --ink:#1C2942; --ink-soft:#4A5670; --muted:#7A8194;
  --ochre:#9C6A1E; --ochre-soft:#E9D9B8; --teal:#1E7068; --teal-soft:#D5E7E3; --teal-ink:#FFFFFF;
  --line:#DDD2BA; --deep:#16405C; --deep-2:#0C2436; --warn:#8A3B2E; --warn-soft:#F2DCD5;
  --serif:"Gowun Batang","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --sans:"Deepspring Sans","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --base:17px; --r-s:10px; --r-m:14px; --r-l:22px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1B28; --sheet:#152536; --ink:#ECE4D2; --ink-soft:#C3BCAC; --muted:#8C93A3;
    --ochre:#D6A452; --ochre-soft:#3A3122; --teal:#56B3A7; --teal-soft:#1B3A3A; --teal-ink:#0F1B28;
    --line:#2A3B4E; --deep:#0E3048; --deep-2:#071826; --warn:#E39A88; --warn-soft:#3A2420;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1B28; --sheet:#152536; --ink:#ECE4D2; --ink-soft:#C3BCAC; --muted:#8C93A3;
  --ochre:#D6A452; --ochre-soft:#3A3122; --teal:#56B3A7; --teal-soft:#1B3A3A; --teal-ink:#0F1B28;
  --line:#2A3B4E; --deep:#0E3048; --deep-2:#071826; --warn:#E39A88; --warn-soft:#3A2420;
  color-scheme: dark;
}
:root[data-size="l"]{ --base:20px; }

*{box-sizing:border-box}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); background:var(--paper); }
body{ margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:var(--base); line-height:1.65; -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:anywhere; }
img{ max-width:100%; }
button,input,textarea,select{ font:inherit; color:inherit; }
a{ color:var(--teal); }
:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; border-radius:6px; }

/* ---------- 골격 ---------- */
#app{ max-width:600px; margin:0 auto; min-height:100vh; padding:0 20px 168px; }
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--paper); margin:0 -20px; padding:12px 20px 10px; display:flex; align-items:center; gap:12px; border-bottom:1px solid transparent; }
.topbar.scrolled{ border-bottom-color:var(--line); }
.topbar .back{ border:0; background:none; padding:6px 8px 6px 0; font-size:1.05em; color:var(--ink-soft); cursor:pointer; min-height:44px; }
.topbar h1{ font-family:var(--serif); font-weight:700; font-size:1.08em; margin:0; flex:1; min-width:0; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar .sub{ white-space:nowrap; }
.topbar .sub{ font-size:.78em; color:var(--muted); }

.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--sheet); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
.tabbar .in{ max-width:600px; margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); }
.tabbar button{ border:0; background:none; padding:10px 4px 12px; font-size:.78em; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; min-height:58px; }
.tabbar button svg{ width:24px; height:24px; }
.tabbar button[aria-current="page"]{ color:var(--ink); font-weight:600; }
.tabbar button[aria-current="page"] svg{ color:var(--teal); }

.fab{ position:fixed; z-index:31; right:max(16px, calc(50% - 300px + 16px)); bottom:calc(76px + env(safe-area-inset-bottom,0px)); background:var(--teal); color:var(--teal-ink); border:0; border-radius:999px; padding:13px 20px 13px 16px; font-weight:600; font-size:.92em; display:flex; align-items:center; gap:8px; box-shadow:0 6px 18px rgba(12,36,54,.22); cursor:pointer; min-height:48px; }
.fab svg{ width:20px; height:20px; }

/* ---------- 글자 ---------- */
.serif{ font-family:var(--serif); }
.h-hero{ font-family:var(--serif); font-size:1.9em; line-height:1.35; letter-spacing:-.02em; margin:.2em 0 .5em; font-weight:700; }
.h2{ font-family:var(--serif); font-size:1.32em; line-height:1.4; margin:1.6em 0 .5em; font-weight:700; letter-spacing:-.01em; }
.h3{ font-size:1.02em; font-weight:600; margin:1.3em 0 .4em; }
.lead{ color:var(--ink-soft); }
.small{ font-size:.85em; color:var(--muted); }
p{ margin:.55em 0; }
.note{ font-size:.86em; color:var(--muted); margin-top:.6em; }

/* ---------- 말씀 ---------- */
.scripture{ margin:1.1em 0 1.3em; padding:.1em 0 .1em 16px; border-left:2px solid var(--ochre); font-family:var(--serif); font-size:1.06em; line-height:1.95; }
.scripture .ref{ display:block; font-family:var(--sans); font-size:.78em; color:var(--ochre); margin-bottom:.35em; font-weight:600; }
.scripture .v{ display:inline; }
.scripture .vn{ font-family:var(--sans); font-size:.68em; color:var(--ochre); font-weight:700; vertical-align:.25em; margin:0 .25em 0 .1em; }
.scripture b, .quote b{ font-weight:700; color:var(--ink); }
.scripture .var{ color:var(--muted); font-size:.9em; }
.gloss{ font-size:.84em; color:var(--muted); margin:-.6em 0 1em 18px; }
.quote{ font-family:var(--serif); font-size:1.08em; line-height:1.9; margin:1em 0; padding:0 0 0 16px; border-left:2px solid var(--ochre-soft); }
.quote .ref{ display:block; font-family:var(--sans); font-size:.78em; color:var(--ochre); margin-top:.3em; }
.speaker{ font-size:.8em; color:var(--ochre); font-weight:600; margin-bottom:.2em; }

/* ---------- 홈 ---------- */
.home-hero{ padding:18px 0 6px; }
.home-hero .week{ font-size:.86em; color:var(--muted); }
.home-hero .q{ font-family:var(--serif); font-size:1.62em; line-height:1.4; font-weight:700; margin:.25em 0 .7em; letter-spacing:-.02em; }
.today{ background:var(--sheet); border-radius:var(--r-l); padding:20px 20px 18px; border:1px solid var(--line); }
.today .day{ font-size:.85em; color:var(--teal); font-weight:600; }
.today .title{ font-family:var(--serif); font-size:1.28em; font-weight:700; margin:.15em 0 .6em; }
.today .line{ font-family:var(--serif); color:var(--ink-soft); font-size:1.02em; line-height:1.8; margin:0 0 1em; }
.strip{ display:flex; gap:8px; margin:18px 0 6px; }
.strip button{ flex:1; aspect-ratio:1/1.15; border-radius:var(--r-m); border:1px solid var(--line); background:transparent; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:.78em; color:var(--muted); min-height:52px; }
.strip button b{ font-size:1.25em; color:var(--ink); font-family:var(--serif); }
.strip button.done{ background:var(--teal-soft); border-color:transparent; }
.strip button.now{ border:2px solid var(--teal); }
.strip button.group{ flex:1.2; }

.wells{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin:10px 0; }
.wells span{ aspect-ratio:1; border-radius:50%; border:1.5px solid var(--line); display:block; position:relative; overflow:hidden; }
.wells span.full{ border-color:var(--deep); background:radial-gradient(circle at 50% 70%, #3F7EA3 0%, var(--deep) 70%); }
.wells span.locked{ opacity:.45; }
.wells-row{ display:flex; align-items:center; gap:10px; }
.wells-row .lbl{ width:34px; font-size:.78em; color:var(--muted); }

/* ---------- 버튼 ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:12px; border:1.5px solid var(--teal); background:transparent; color:var(--teal); padding:12px 18px; font-weight:600; cursor:pointer; min-height:48px; text-decoration:none; }
.btn.primary{ background:var(--teal); color:var(--teal-ink); }
.btn.block{ width:100%; }
.btn.ghost{ border-color:transparent; padding-left:6px; padding-right:6px; }
.btn.warn{ border-color:var(--warn); color:var(--warn); }
.btn svg{ width:20px; height:20px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; }
.row .btn{ flex:1; }

/* ---------- 오늘의 순서(날) ---------- */
.stepper{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 62px); z-index:15; background:var(--paper); margin:0 -20px; padding:6px 20px 10px; display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.stepper a{ text-decoration:none; color:var(--muted); font-size:.78em; text-align:center; padding:8px 2px 6px; border-radius:10px; border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:2px; min-height:48px; justify-content:center; }
.stepper a .n{ font-family:var(--serif); font-weight:700; font-size:1.2em; color:var(--ink-soft); }
.stepper a.done{ background:var(--teal-soft); border-color:transparent; color:var(--ink); }
.stepper a.done .n{ color:var(--teal); }
.layer{ padding:8px 0 22px; border-bottom:1px solid var(--line); scroll-margin-top:130px; }
.layer:last-of-type{ border-bottom:0; }
.layer > .lh{ display:flex; align-items:baseline; gap:10px; margin:22px 0 4px; }
.layer > .lh .n{ font-family:var(--serif); font-size:1.5em; color:var(--teal); font-weight:700; line-height:1; }
.layer > .lh h2{ font-family:var(--serif); font-size:1.28em; margin:0; font-weight:700; }
.layer > .lh .min{ margin-left:auto; font-size:.8em; color:var(--muted); }
.donebar{ margin-top:18px; display:flex; justify-content:flex-end; }
.donebar .btn{ min-width:150px; }
.donebar .btn.is-done{ background:var(--teal-soft); border-color:transparent; color:var(--ink); }

/* ---------- 입력 ---------- */
.field{ margin:14px 0; }
.field label, .field .lbl{ display:block; font-weight:600; font-size:.95em; margin-bottom:6px; }
.field .hint{ font-size:.83em; color:var(--muted); margin:-2px 0 6px; }
.field input[type=text], .field textarea, .field select{ width:100%; border:1.5px solid var(--line); background:var(--sheet); border-radius:var(--r-s); padding:12px 14px; min-height:48px; }
.field textarea{ min-height:88px; resize:vertical; line-height:1.6; }
.field input:focus, .field textarea:focus{ border-color:var(--teal); outline:none; }
.range{ display:flex; align-items:center; gap:12px; }
.range input[type=range]{ flex:1; accent-color:var(--teal); height:32px; }
.range output{ min-width:2.6em; text-align:right; font-family:var(--serif); font-weight:700; font-size:1.2em; color:var(--teal); }
.range-ends{ display:flex; justify-content:space-between; font-size:.78em; color:var(--muted); margin-top:-2px; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ border:1.5px solid var(--line); background:var(--sheet); border-radius:999px; padding:9px 14px; cursor:pointer; min-height:44px; font-size:.93em; }
.chip[aria-pressed="true"]{ border-color:var(--teal); background:var(--teal-soft); color:var(--ink); font-weight:600; }
.seg{ display:grid; grid-template-columns:repeat(3,1fr); border:1.5px solid var(--line); border-radius:12px; overflow:hidden; }
.seg button{ border:0; background:var(--sheet); padding:10px 4px; cursor:pointer; font-size:.86em; min-height:44px; color:var(--ink-soft); }
.seg button + button{ border-left:1.5px solid var(--line); }
.seg button[aria-pressed="true"]{ background:var(--teal); color:var(--teal-ink); font-weight:600; }

.phrase{ padding:14px 0; border-bottom:1px solid var(--line); }
.phrase .t{ font-family:var(--serif); font-size:1.08em; margin-bottom:8px; }

/* ---------- 도구 패널 · 카드 ---------- */
.panel{ border:1.5px solid var(--teal); border-radius:var(--r-m); padding:16px 16px 12px; margin:16px 0; background:transparent; }
.panel.soft{ border-color:var(--line); background:var(--sheet); }
.panel.warn{ border-color:var(--warn); background:var(--warn-soft); }
.panel > .ph{ font-weight:700; margin:0 0 6px; }
.privacy{ font-size:.86em; color:var(--ink-soft); background:var(--sheet); border-radius:var(--r-s); padding:10px 14px; margin:12px 0; border:1px dashed var(--line); }
.stop{ font-size:.86em; color:var(--muted); margin:18px 0 0; padding-top:12px; border-top:1px dashed var(--line); }
.stop a{ color:var(--muted); }

.voice{ border-top:1px solid var(--line); padding:16px 0; }
.voice summary{ cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; min-height:44px; }
.voice summary::-webkit-details-marker{ display:none; }
.voice summary .nm{ font-family:var(--serif); font-weight:700; font-size:1.15em; }
.voice summary .mine{ margin-left:auto; font-size:.78em; color:var(--teal); font-weight:600; }
.voice dl{ margin:10px 0 0; display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:.93em; }
.voice dt{ color:var(--muted); }
.voice dd{ margin:0; }
.voice .answer{ margin-top:12px; }

.bars{ margin:14px 0 6px; }
.bar{ display:grid; grid-template-columns:7.2em 1fr; gap:10px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line); }
.bar .nm{ font-size:.9em; font-weight:600; }
.bar .tr{ display:grid; gap:5px; }
.bar .tk{ height:10px; border-radius:6px; background:var(--line); position:relative; overflow:hidden; }
.bar .tk i{ position:absolute; inset:0 auto 0 0; border-radius:6px; }
.bar .tk.out i{ background:var(--ochre); }
.bar .tk.in i{ background:var(--teal); }
.bar.top .nm{ color:var(--teal); }
.legend{ display:flex; gap:16px; font-size:.8em; color:var(--muted); margin-top:6px; }
.legend i{ display:inline-block; width:12px; height:10px; border-radius:4px; margin-right:6px; vertical-align:-1px; }

.pairlist{ margin:10px 0; }
.pair{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); font-size:.93em; }
.pair .said{ font-family:var(--serif); }
.pair .voice-t{ color:var(--ink-soft); }
.pair .meta{ grid-column:1/-1; font-size:.78em; color:var(--muted); }
.empty{ color:var(--muted); font-size:.92em; padding:18px 0; text-align:left; }

.cmp{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:12px 0; }
.cmp .c{ border:1px solid var(--line); border-radius:var(--r-m); padding:12px; }
.cmp .c .k{ font-size:.8em; color:var(--muted); }
.cmp .c .v{ font-family:var(--serif); font-size:1.6em; font-weight:700; }

.line-chart{ width:100%; height:150px; }

/* ---------- 마법사(4일차) ---------- */
.wiz-steps{ display:flex; gap:5px; margin:12px 0 4px; }
.wiz-steps i{ flex:1; height:5px; border-radius:4px; background:var(--line); }
.wiz-steps i.on{ background:var(--teal); }
.wiz-title{ font-weight:700; margin:10px 0 4px; }
.optlist{ display:grid; gap:10px; margin:10px 0; }
.opt{ text-align:left; border:1.5px solid var(--line); background:var(--sheet); border-radius:var(--r-m); padding:14px; cursor:pointer; }
.opt[aria-pressed="true"]{ border-color:var(--teal); box-shadow:inset 0 0 0 1px var(--teal); }
.opt .speaker{ margin-bottom:4px; }
.opt .tx{ font-family:var(--serif); line-height:1.8; }
.reads{ display:flex; gap:12px; margin:12px 0; }
.reads button{ width:64px; height:64px; border-radius:50%; border:2px solid var(--teal); background:transparent; font-family:var(--serif); font-size:1.4em; font-weight:700; color:var(--teal); cursor:pointer; }
.reads button[aria-pressed="true"]{ background:var(--teal); color:var(--teal-ink); }
.card-preview{ width:min(260px, 70%); display:block; margin:14px auto; border-radius:18px; box-shadow:0 10px 30px rgba(12,36,54,.25); }

/* ---------- 시트 · 오버레이 ---------- */
.sheet-back{ position:fixed; inset:0; background:rgba(8,20,32,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
.sheet{ width:100%; max-width:600px; background:var(--paper); border-radius:22px 22px 0 0; padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px)); max-height:92vh; overflow:auto; }
.sheet .grab{ width:44px; height:5px; border-radius:4px; background:var(--line); margin:0 auto 10px; }
.sheet h2{ font-family:var(--serif); margin:.2em 0 .3em; font-size:1.3em; }

.overlay{ position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; }
.calm{ background:linear-gradient(180deg, var(--deep) 0%, var(--deep-2) 100%); color:#EDE6D3; }
.calm canvas{ position:absolute; inset:0; width:100%; height:100%; }
.calm .cv{ position:relative; z-index:2; flex:1; display:flex; flex-direction:column; padding:calc(18px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px)); max-width:600px; width:100%; margin:0 auto; }
.calm .top{ display:flex; justify-content:space-between; align-items:center; font-size:.86em; color:#B7C4CE; }
.calm .top button{ background:none; border:0; color:#DCE4EA; padding:8px; cursor:pointer; min-height:44px; font-size:1em; }
.calm .stage{ margin-top:auto; margin-bottom:auto; text-align:center; }
.calm .stage .nm{ font-family:var(--serif); font-size:2em; font-weight:700; letter-spacing:.02em; }
.calm .stage .ins{ font-family:var(--serif); font-size:1.08em; line-height:1.8; margin:.6em auto 0; max-width:26em; color:#DCE3E6; }
.calm .stage .time{ margin-top:1.1em; font-size:.95em; color:#AFC0CC; font-variant-numeric:tabular-nums; }
.calm .text{ font-family:var(--serif); font-size:1.05em; line-height:1.95; max-height:42vh; overflow:auto; text-align:left; margin:1em 0 0; padding:0 4px; color:#EDE6D3; }
.calm .text .vn{ color:#D6A452; font-family:var(--sans); font-size:.7em; font-weight:700; margin-right:.25em; vertical-align:.25em; }
.calm .text b{ color:#FFF6E0; }
.calm .dots{ display:flex; justify-content:center; gap:8px; margin:0 0 16px; }
.calm .dots i{ width:34px; height:4px; border-radius:3px; background:rgba(237,230,211,.25); }
.calm .dots i.on{ background:#D6A452; }
.calm .ctrl{ display:flex; gap:10px; }
.calm .ctrl button{ flex:1; border-radius:12px; border:1.5px solid rgba(237,230,211,.4); background:transparent; color:#EDE6D3; padding:13px; font-weight:600; min-height:50px; cursor:pointer; }
.calm .ctrl button.main{ background:#EDE6D3; color:var(--deep-2); border-color:#EDE6D3; }
.calm .prayer{ text-align:center; font-family:var(--serif); color:#D6A452; font-size:1.05em; margin-bottom:10px; }

.partner-view{ background:var(--sheet); color:var(--ink); }
.partner-view .cv{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:calc(24px + env(safe-area-inset-top,0px)) 28px calc(24px + env(safe-area-inset-bottom,0px)); max-width:640px; margin:0 auto; width:100%; }
.partner-view .big{ font-family:var(--serif); font-size:1.7em; line-height:1.75; font-weight:700; }
.partner-view .how{ font-size:.9em; color:var(--muted); margin-top:1.4em; }

.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(140px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:10px; z-index:70; font-size:.9em; }

/* ---------- 도입 ---------- */

const KEY = "deepspring.v1";
const DEF = () => ({ v:1, name:"", onboarded:false, settings:{size:"m", chime:true, theme:"auto"}, logs:[], w1:{days:{}, group:{}}, calm:{} });
let S;
function load(){
  try{ const raw = localStorage.getItem(KEY); S = raw ? Object.assign(DEF(), JSON.parse(raw)) : DEF(); }
  catch(e){ S = DEF(); }
  S.settings = Object.assign(DEF().settings, S.settings||{});
  S.w1 = S.w1 || {days:{}, group:{}}; S.w1.days = S.w1.days||{}; S.w1.group = S.w1.group||{};
  S.logs = S.logs||[]; S.calm = S.calm||{};
}
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }, 150); }
function D(n){ S.w1.days[n] = S.w1.days[n] || {f:{}, done:{}}; const d=S.w1.days[n]; d.f=d.f||{}; d.done=d.done||{}; return d; }
function F(n,k,dflt){ const v = D(n).f[k]; return v===undefined ? dflt : v; }
function setF(n,k,v){ D(n).f[k]=v; save(); }

/* ---------- 도움 함수 ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function vocative(name){
  const n=(name||"").trim(); if(!n) return "";
  const c=n.charCodeAt(n.length-1);
  if(c>=0xAC00 && c<=0xD7A3){ return n + (((c-0xAC00)%28)?"아":"야"); }
  return n + ",";
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function applySettings(){
  const r=document.documentElement;
  r.setAttribute("data-size", S.settings.size==="l"?"l":"m");
  if(S.settings.theme==="auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", S.settings.theme);
}
function fmtDate(ts){ const d=new Date(ts); return `${d.getMonth()+1}월 ${d.getDate()}일 ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }

function voiceScores(){
  const res={};
  TYPES.forEach(t=>res[t.id]={out:0,outN:0,in:0,inN:0});
  PHRASES.forEach(p=>{ const v=F(2,"ph_"+p.id,null); if(v===null) return; const r=res[p.type]; if(p.dir==="out"){r.out+=v;r.outN++;} else {r.in+=v;r.inN++;} });
  const list=TYPES.map(t=>{ const r=res[t.id]; const o=r.outN?r.out/r.outN:0, i=r.inN?r.in/r.inN:0; return {id:t.id, out:o, in:i, sum:o+i}; });
  const answered = PHRASES.filter(p=>F(2,"ph_"+p.id,null)!==null).length;
  const top=[...list].sort((a,b)=>b.sum-a.sum).filter(x=>x.sum>0).slice(0,2).map(x=>x.id);
  const oMean=list.reduce((a,x)=>a+x.out,0)/list.length, iMean=list.reduce((a,x)=>a+x.in,0)/list.length;
  let shape="both";
  if(oMean<0.35 && iMean<0.35) shape="low"; else if(oMean-iMean>=0.35) shape="out"; else if(iMean-oMean>=0.35) shape="in";
  return {list, top, answered, shape};
}
function myPhrases(typeId){ return PHRASES.filter(p=>p.type===typeId && (F(2,"ph_"+p.id,0)||0)>0).map(p=>p.t); }
function topTypes(){ return voiceScores().top; }

let AC;
function chime(){
  if(!S.settings.chime) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const now=AC.currentTime;
    [[523.25,0.18],[783.99,0.09],[1046.5,0.05]].forEach(([f,g],i)=>{
      const o=AC.createOscillator(), a=AC.createGain();
      o.type="sine"; o.frequency.value=f;
      a.gain.setValueAtTime(0,now); a.gain.linearRampToValueAtTime(g, now+0.02+i*0.01); a.gain.exponentialRampToValueAtTime(0.0001, now+3.2);
      o.connect(a).connect(AC.destination); o.start(now); o.stop(now+3.3);
    });
  }catch(e){}
}

function openCalm(dayN){

  </div>`;
  document.body.appendChild(ov); document.body.style.overflow="hidden";
  const cvs=ov.querySelector("canvas"); let ctx=null; try{ ctx=cvs.getContext("2d"); }catch(e){}
  if(!ctx){ ctx={clearRect(){},createLinearGradient(){return {addColorStop(){}};},fillRect(){},beginPath(){},arc(){},fill(){},setTransform(){}}; }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,P=[];
  function size(){ const dpr=Math.min(2,window.devicePixelRatio||1); W=cvs.clientWidth; H=cvs.clientHeight; cvs.width=W*dpr; cvs.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  size(); window.addEventListener("resize", size);
  for(let i=0;i<150;i++) P.push({x:Math.random()*W, y:Math.random()*H, r:.6+Math.random()*2.2, vx:(Math.random()-.5)*.6, vy:(Math.random()-.5)*.6, a:.25+Math.random()*.45});
  const st={i:-1, left:0, run:false, elapsed:0, last:0, raf:0, wake:null};
  TM=st;
  function progress(){ return Math.min(1, st.elapsed/total); }
  function draw(ts){
    const dt = st.last? Math.min(.05,(ts-st.last)/1000) : 0; st.last=ts;
    if(st.run){ st.elapsed+=dt; st.left-=dt; if(st.left<=0) nextStage(true); }
    const p=progress();
    ctx.clearRect(0,0,W,H);
    // 물빛: 점점 맑아지는 위쪽 빛
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,`rgba(120,170,190,${.10+.18*p})`); g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    const floor=H-18;
    P.forEach(q=>{
      if(!reduce){
        const settle = .15 + p*1.4;           // 시간이 갈수록 가라앉는 힘이 커짐
        const stir = (1-p)*.9;                 // 처음엔 소용돌이
        q.vx += (Math.random()-.5)*.08*stir; q.vy += (Math.random()-.5)*.08*stir + .004*settle;
        q.vx*=.985; q.vy*=.985;
        q.x+=q.vx; q.y+=q.vy*(.6+settle);
        if(q.x<0) q.x+=W; if(q.x>W) q.x-=W;
        if(q.y>floor){ q.y=floor-Math.random()*6*(1-p); q.vy*=-.2; }
        if(q.y<0) q.y=0;
      } else { q.y = q.y + (floor-q.y)*0.002; }
      const alpha = q.a*(1-.65*p) * (q.y>floor-8?1.2:1);
      ctx.beginPath(); ctx.fillStyle=`rgba(214,190,140,${alpha})`; ctx.arc(q.x,q.y,q.r,0,Math.PI*2); ctx.fill();
    });
    ctx.fillStyle=`rgba(214,190,140,${.08+.18*p})`; ctx.fillRect(0,floor+2,W,H-floor);
    const tEl=ov.querySelector(".time"); if(st.i>=0 && tEl){ const s=Math.max(0,Math.ceil(st.left)); tEl.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
    st.raf=requestAnimationFrame(draw);
  }
  st.raf=requestAnimationFrame(draw);
  function showStage(){
    const s=stages[st.i]; const el=ov.querySelector(".stage");
    el.querySelector(".nm").textContent=s.nm;
    el.querySelector(".ins").textContent=s.ins;
    const tx=el.querySelector(".text");
    if(s.text){ tx.hidden=false; tx.innerHTML=scr.v.map(([n,h])=>`<span class="vn">${n}</span>${h} `).join(""); } else { tx.hidden=true; }
    ov.querySelector(".prayer").style.visibility = s.prayer? "visible":"hidden";
    ov.querySelectorAll(".dots i").forEach((x,k)=>x.classList.toggle("on", k<=st.i));
  }
  function nextStage(auto){
    if(st.i>=0 && st.i<stages.length){ st.elapsed = stages.slice(0,st.i+1).reduce((a,s)=>a+s.s,0); }
    st.i++;
    if(st.i>=stages.length){ finish(); return; }
    st.left=stages[st.i].s; showStage(); if(st.i>0||auto) chime();
  }
  async function wake(){ try{ st.wake = await navigator.wakeLock?.request("screen"); }catch(e){} }
  function finish(){
    st.run=false; chime();
    S.calm["1-"+dayN]=true; D(dayN).f.calmDone=true; save();
    const el=ov.querySelector(".stage");
    el.querySelector(".nm").textContent="마쳤습니다";
    el.querySelector(".ins").textContent="알아챈 목소리, 머문 단어, 한 문장 기도를\n적어 두세요.";
    el.querySelector(".text").hidden=true; ov.querySelector(".time").textContent="";
    ov.querySelector(".ctrl").innerHTML=`<button type="button" class="main" data-x="close">적으러 가기</button>`;
  }
  ov.addEventListener("click", e=>{
    const x=e.target.closest("[data-x]")?.dataset.x; if(!x) return;
    if(x==="close"){ close(); }
    if(x==="toggle"){
      if(st.i<0){ st.run=true; nextStage(false); wake(); chime(); e.target.textContent="잠시 멈춤"; }
      else { st.run=!st.run; e.target.textContent= st.run?"잠시 멈춤":"이어서"; }
    }
    if(x==="next"){ if(st.i<0){ st.run=true; ov.querySelector('[data-x="toggle"]').textContent="잠시 멈춤"; wake(); } nextStage(false); }
  });
  function close(){ cancelAnimationFrame(st.raf); try{st.wake&&st.wake.release();}catch(e){} window.removeEventListener("resize",size); ov.remove(); document.body.style.overflow=""; TM=null; render(); }
}

/* ---------- 말씀 카드 ---------- */
function wrapLines(ctx, text, maxW){
  const out=[]; let line="";
  for(const ch of text){ const test=line+ch; if(ctx.measureText(test).width>maxW && line){ out.push(line); line=ch.trim()?ch:""; } else line=test; }
  if(line) out.push(line); return out;
}

  x.fillStyle="rgba(214,190,140,.16)"; for(let i=0;i<90;i++){ x.beginPath(); x.arc(Math.random()*W, H-140-Math.random()*120, 1+Math.random()*3, 0, Math.PI*2); x.fill(); }
  x.fillStyle="rgba(214,190,140,.22)"; x.fillRect(0,H-120,W,120);

  x.textBaseline="top";
  x.fillStyle="#D6A452"; x.font=`600 34px ${sans}`;
  let y=360; wrapLines(x, v.who, W-220).forEach(l=>{ x.fillText(l,110,y); y+=50; });
  y+=40;
  const nm = v.direct && S.name ? vocative(S.name)+" " : "";
  const body = nm + v.t;
  let size=66; x.font=`700 ${size}px ${serif}`; let lines=wrapLines(x, body, W-220);
  while(lines.length>11 && size>44){ size-=4; x.font=`700 ${size}px ${serif}`; lines=wrapLines(x, body, W-220); }
  x.fillStyle="#F3ECDB"; lines.forEach(l=>{ x.fillText(l,110,y); y+=size*1.62; });
  y+=30; x.fillStyle="#B7C4CE"; x.font=`500 32px ${sans}`; x.fillText(v.ref+" · NJHV",110,y);
  x.fillStyle="rgba(243,236,219,.55)"; x.font=`500 28px ${sans}`; x.fillText("깊은 샘에서 흐르는 말",110,H-230);
  return c;
}

    <h3 class="h3">이 목소리가 약속하는 것</h3>
    ${(top.length?top:["perfect","driver"]).map(id=>`<p class="small">${TYPE[id].nm}: \u201c${TYPE[id].promise}\u201d</p>`).join("")}
    ${fText(n,"promise","내 비판자는 나에게 무엇을 약속하나요?")}
    ${fChips(n,"actual","그런데 그 목소리는 실제로 나를 어떻게 했나요?",["나를 일으켰다","나를 숨게 했다","나를 지치게 했다","가까운 사람에게 날 선 말을 하게 했다","새로운 일을 포기하게 했다"],{multi:true})}
    <div class="panel soft"><p class="ph">약속과 실제는 달랐습니다</p>
      <p>노은혜는 이렇게 씁니다. \u201c가혹한 비판자는 결코 우리를 성장으로 이끌지 않는다.\u201d</p>
      <p>심리학자 줄리아나 브라인스와 세레나 첸의 실험에서, 실패한 뒤 자기에게 친절하게 대한 사람들이 오히려 잘못을 바로잡으려는 마음이 더 컸고, 어려운 시험에 떨어진 뒤 더 오래 공부했습니다.</p>
      <p>그리고 하나님은 숨은 사람에게 \u201c너희가 벗었구나\u201d 하지 않으시고, 이렇게 물으셨습니다. <span class="serif">\u201c누가 너에게, 네가 벗었다고 알려 주었느냐?\u201d</span>(창 3:11)</p></div>
    <div class="quote"><b>하나님의 인자하심이 너를 회개로 이끌고 있다는 것을 알지 못하느냐?</b><span class="ref">로마서 2:4 · NJHV</span></div>
    <p>사람을 돌이키게 하는 것은 다그침이 아니라, 하나님의 인자하심입니다.</p>
    <h3 class="h3">이름 붙이기</h3>
    <p class="small">역할로 붙입니다. 이름이 생기면 그 목소리가 \u2018나\u2019와 조금 떨어져 보입니다. \u201c아, 재판관이 또 왔구나.\u201d</p>
    <div class="chips">${["재판관","감시자","채점관","검사","잔소리꾼","감독"].map(x=>`<button type="button" class="chip" data-fill="3|critic_name" data-val="${x}" aria-pressed="${F(3,"critic_name","")===x}">${x}</button>`).join("")}</div>
    ${fText(n,"critic_name","내 비판자의 이름")}
    <p class="small">비판자를 마귀라고 부르지는 않습니다. 이 목소리의 상당 부분은 우리가 오래 들어 온 사람들의 말투이기 때문입니다.</p>
    ${doneBar(n,2)}</section>
  <section class="layer" id="L3">${layerHead(n,3,"양심인가, 비판자인가","")}

    <div class="quote">하나님의 뜻을 따르는 근심은 후회할 것 없는 구원에 이르는 회개를 이루지만, 세상의 근심은 죽음을 이룹니다.<span class="ref">고린도후서 7:10 · NJHV</span></div>
    <p class="small">어제 적은 문장 하나를 떠올리며 고르세요.</p>
    ${qs.map((q,i)=>`<div class="field"><div class="lbl">${["이 목소리를 듣고 나면","이 목소리는","이 목소리는","이 목소리는"][i]}</div><div class="seg" style="grid-template-columns:1fr 1fr">${q.map((o,j)=>`<button type="button" aria-pressed="${F(3,"tf"+(i+1),null)===j}" data-seg="3|tf${i+1}" data-val="${j}">${o}</button>`).join("")}</div></div>`).join("")}
    ${answered===4?`<p class="serif" style="font-size:1.05em">${right>=2?"이것은 양심의 목소리라기보다 비판자의 목소리에 가깝습니다. 하나님이 주시는 근심은 사람을 무너뜨리지 않고 돌아오게 합니다.":"이 목소리에는 하나님이 주시는 근심의 모습이 있습니다. 그 일을 하나님께 가져가고, 필요하면 바로잡으세요(요일 1:9)."}</p>`:""}
    <h3 class="h3">이 목소리는 어디서 왔을까 — 두 질문만</h3>
    <div class="quote" style="font-size:.98em">가족을 돌아보는 것은 잘못을 찾기 위해서가 아니라, 무엇이 건강했고 무엇이 아팠는지 정직하게 보고 그리스도 안에서 자라기 위해서입니다.<span class="ref">피터 스캐지로</span></div>
    ${safety?`<div class="panel warn"><p>이 질문은 오늘 건너뛰어도 됩니다. 3주에 천천히 다시 열 수 있습니다.</p><div class="seg" style="grid-template-columns:1fr 1fr"><button type="button" aria-pressed="${skip}" data-seg="3|skipOrigins" data-val="1">건너뛰기</button><button type="button" aria-pressed="${!skip}" data-seg="3|skipOrigins" data-val="0">지금 해 보기</button></div></div>`:""}
    ${skip?"":`
      ${F(2,"pick_text","")?`<p class="small">내 입버릇: \u201c${esc(F(2,"pick_text",""))}\u201d</p>`:""}
      ${fChips(n,"who","1. 내가 자주 하는 그 말 — 그 말투는 누구에게서 들었나요?",WHO,{multi:true,hint:"여럿 골라도 됩니다. 아이는 부모를 옳다고 믿어야 세상이 안전하기 때문에 \u201c엄마가 잘못했다\u201d보다 \u201c내가 잘못했다\u201d를 택하곤 합니다(노은혜). 목소리의 출처가 늘 누군가의 말은 아닙니다."})}
      ${fChips(n,"rules","2. 우리 집의 보이지 않는 규칙 가운데, 내 비판자와 닮은 것을 두세 개 고르세요.",RULES.map(r=>({v:r.id,t:r.t})),{multi:true})}
      ${fText(n,"rule_own","직접 쓰는 규칙")}
      ${rulesSel.length?`<h3 class="h3">새 가족의 규칙</h3>

/* ---------- 4일째 ---------- */

  const vid=F(4,"verse",null);
  let body="";
  if(step===1){
    body=`<p class="wiz-title">1. 오늘 대답을 들을 짝 하나를 고르세요</p><p class="small">지금 가장 믿고 있는 문장이 맨 위에 있습니다.</p>
    ${pairs.length?`<div class="optlist">${pairs.map(p=>`<button type="button" class="opt" aria-pressed="${pk===p.key}" data-wiz-set="pair" data-val="${p.key}">${p.said?`<div class="small">내가 한 말 \u201c${esc(p.said)}\u201d</div>`:""}<div class="tx">\u201c${esc(p.voice||p.said)}\u201d</div><div class="small">${p.type?TYPE[p.type].nm:"목소리 모름"}${p.belief!=null?` · 믿음 ${p.belief}`:""}</div></button>`).join("")}</div>`
    :`<p class="empty">아직 짝이 없습니다. 2일째의 \u2018그 말 밑의 문장\u2019을 적거나 [말과 목소리]로 기록해 주세요.</p><button type="button" class="btn" data-act="log">${IC.pen}지금 기록하기</button>`}`;
  }

    const t=pair&&pair.type?TYPE[pair.type]:null;
    const cats = t? t.cats : CATS.map(c=>c.id);
    const catSel=F(4,"cat", cats[0]);
    const ids = [...new Set([...(t?[t.answer]:[]), ...CATS.find(c=>c.id===catSel).v])];
    body=`<p class="wiz-title">2. 아버지의 대답을 고르세요</p>
    <p class="small">예수께서도 광야에서 흔드는 목소리에 자기 말로 답하지 않으시고, \u201c기록되었으되\u201d로 답하셨습니다(마 4:4).</p>
    ${pair?`<p class="small">내 안의 목소리: \u201c${esc(pair.voice||pair.said)}\u201d</p>`:""}
    <div class="chips" style="margin:10px 0">${cats.map(c=>`<button type="button" class="chip" aria-pressed="${catSel===c}" data-wiz-set="cat" data-val="${c}">${CATS.find(x=>x.id===c).nm}</button>`).join("")}</div>
    <div class="optlist">${ids.map(id=>{const v=VERSES[id]; return `<button type="button" class="opt" aria-pressed="${vid===id}" data-wiz-set="verse" data-val="${id}"><div class="speaker">${esc(v.who)}</div><div class="tx">${esc(v.t)}</div><div class="small">${v.ref}</div></button>`;}).join("")}</div>`;
  }
  if(step===3){
    body=`<p class="wiz-title">3. 내 이름을 넣어 읽어 보세요</p>
    ${S.name?"":`<div class="field"><label for="nm3">부르는 이름</label><input type="text" id="nm3" data-name value="" placeholder="예: 지은"></div>`}

function lineChart(pts){
  const W=320,H=140,pad=28; const xs=pts.map((_,i)=>pad+i*((W-2*pad)/Math.max(1,pts.length-1)));
  const y=v=>H-pad-(v/100)*(H-2*pad);
  const path=pts.map((p,i)=>p.v==null?null:`${xs[i]},${y(p.v)}`).filter(Boolean);
  return `<svg class="line-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="믿음의 변화">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"/>
    ${path.length>1?`<polyline fill="none" stroke="var(--teal)" stroke-width="3" points="${path.join(" ")}"/>`:""}
    ${pts.map((p,i)=>p.v==null?"":`<circle cx="${xs[i]}" cy="${y(p.v)}" r="6" fill="var(--teal)"/><text x="${xs[i]}" y="${y(p.v)-12}" text-anchor="middle" font-size="13" fill="var(--ink)">${p.v}</text>`).join("")}
    ${pts.map((p,i)=>`<text x="${xs[i]}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${p.l}</text>`).join("")}</svg>`;
}

    <h3 class="h3">다섯 도구 — 이번 주 내가 쓴 것</h3>

      <tr><td><b>자각</b></td><td>말과 목소리 기록 ${S.logs.length}개${voiceScores().answered>=14?", 입버릇 찾기":""}</td></tr>
      <tr><td><b>지연</b></td><td>${fSeg(n,"delay",["아직","한 번쯤","여러 번"])}<span class="small">\u201c지금 당장\u201d을 요구하는 목소리 앞에서 한 박자 멈춘 적</span></td></tr>
      <tr><td><b>대체</b></td><td>${vid?`아버지의 대답 — ${VERSES[vid].ref}`:"아직"}</td></tr>
      <tr><td><b>샘 관리</b></td><td>아침 고요 ${[1,2,3,4,5,6].filter(d=>S.calm["1-"+d]).length} / 6</td></tr>
      <tr><td><b>공동체</b></td><td>${F(5,"heard","")||F(5,"send_name","")?"파트너와의 대화, 또는 보낸 말씀":"아직"}</td></tr></table></div>
    <p class="small">2주에는 <b>지연</b>을 깊이 다룹니다.</p>
    <h3 class="h3">소그룹 나눔 준비</h3>
    <p class="small">나눌 것만 고르세요. 고르지 않은 것은 나만 봅니다. 아무것도 나누지 않아도 괜찮습니다.</p>
    ${shareItems.length?fChips(n,"share","",shareItems.map(x=>({v:x.k,t:x.t})),{multi:true}):`<p class="empty">이번 주 기록이 쌓이면 여기에 나타납니다.</p>`}
    ${shareText?`<button type="button" class="btn" data-act="copy" data-text="${esc(shareText)}">고른 것 복사하기</button>`:""}
    <div class="panel soft" style="margin-top:18px"><p class="ph">다음 주 · 나가는 말</p><p class="serif">왜 나는 자꾸 날 선 말이 먼저 나갈까?</p><p class="small">이번 주 찾은 내 입버릇이 다음 주에 다시 열립니다. 그 말이 언제, 왜 하필 그 순간에 터지는지 함께 봅니다.</p></div>
    ${doneBar(n,3)}</section>
  <section class="layer" id="L4">${layerHead(n,4,"훈련 기도문","")}
    <p class="small">천천히 소리 내어 읽으세요. 마음에 걸리는 줄에서는 잠시 멈추어도 좋습니다.</p>
    <div class="quote" style="white-space:pre-line">${esc(prayer)}</div>
    ${fText(n,"addPrayer","이 기도에 덧붙이고 싶은 나의 한 문장(선택)")}
    ${fText(n,"thanks","오늘 감사한 것 한 줄")}
    ${doneBar(n,4)}</section>`);
}

/* ---------- 소그룹 ---------- */
function vGroup(){
  return `${topbar("소그룹 · 1주","#/week/1","약 60분")}
  <h2 class="h2">나눔 규칙</h2>
  <ol style="padding-left:1.2em"><li>여기서 들은 것은 여기에 둡니다</li><li>조언하지 않습니다 — 요약(\u201c~라는 거구나\u201d)과 공감(\u201c힘들었겠다\u201d)만</li><li>판단 대신 질문합니다</li><li>다른 사람 이야기 말고, 내 이야기를 합니다</li><li>말하지 않을 권리가 있습니다 — 침묵해도 괜찮습니다</li></ol>
  <h2 class="h2">흐름</h2>
  <div class="tablewrap"><table class="simple"><tr><th>순서</th><th>시간</th><th>내용</th></tr>
  <tr><td>체크인</td><td>5분</td><td>한 단어로 — 이번 주 내 마음의 날씨</td></tr>
  <tr><td>고요 나눔</td><td>10분</td><td>아침 고요 첫 주 — 무엇이 어려웠고, 무엇을 들었나요?</td></tr>
  <tr><td>말과 목소리</td><td>25분</td><td>질문 1–3</td></tr>
  <tr><td>함께 듣기</td><td>15분</td><td>질문 4</td></tr>
  <tr><td>기도</td><td>5분</td><td>서로를 위한 기도</td></tr></table></div>
  <h2 class="h2">질문</h2>
  <ol style="padding-left:1.2em">
    <li><b>내 입버릇 가운데 \u201c어, 이거 나다\u201d 싶었던 말 하나</b> — 그 말 밑의 목소리는 누구를 닮았나요? (말할 수 있는 만큼만)</li>
    <li><b>내 비판자에게 붙인 이름</b>과 그 까닭</li>
    <li><b>파트너가 내 이름을 넣어 말씀을 읽어 주었을 때</b> — 혹은 내가 누군가에게 말씀을 보냈을 때</li>
    <li><b>함께 듣기</b> — 돌아가며, 오른쪽에 앉은 사람의 이름을 넣어 이사야 43:4를 천천히 읽어 줍니다. 듣는 사람은 대답하지 않고 그냥 듣습니다. 모두 마치면 잠시 침묵합니다.</li>
  </ol>
  <div class="quote">○○아, 네가 내 눈에 귀하고, 너는 존귀하며, 나는 너를 사랑한다.<span class="ref">이사야 43:4 · NJHV</span></div>
  <div class="field"><label for="gp">서로를 위한 기도 제목</label><textarea id="gp" data-g="prayer">${esc(S.w1.group.prayer||"")}</textarea></div>
  <details class="voice"><summary><span class="nm">리더에게</span></summary>
    <p><b>진행</b> — 규칙을 읽고 시작합니다. 질문 1은 리더가 먼저 짧게 나누면 문이 열립니다.</p>
    <p><b>힘들어하는 참여자가 있을 때</b> — 그 자리에서 상담하려 하지 않습니다. \u201c나눠 줘서 고마워요\u201d로 받고, 모임 뒤에 따로 연락합니다. 필요하면 목회자에게 연결합니다.</p>
    <p><b>말이 길어질 때</b> — \u201c지금 이야기가 참 소중해요. 다른 분들도 들어 볼게요.\u201d</p>
    <p><b>질문 4</b> — 이름을 부르는 목소리가 떨리거나 눈물이 나는 분이 있을 수 있습니다. 서두르지 말고, 모두 마친 뒤 1분 침묵합니다.</p>
    <p><b>시간</b> — 60분을 넘기지 않습니다.</p></details>`;
}
function route(){ return (location.hash||"#/").replace(/^#/,"").split("/").filter(Boolean); }
function currentTab(r){ if(!r.length) return "home"; if(r[0]==="week"||r[0]==="day"||r[0]==="group") return "week"; if(r[0]==="log") return "log"; return "more"; }
function view(){
  const r=route();
  if(!S.onboarded && r[0]!=="intro" && r[0]!=="finish-intro") return vIntro(0);
  switch(r[0]){
    case undefined: return vHome();
    case "intro": return vIntro(r[1]);
    case "week": return vWeek(r[1]);
    case "day": { const n=+r[2]||1; return [null,vDay1,vDay2,vDay3,vDay4,vDay5,vDay6][Math.min(6,Math.max(1,n))](); }
    case "group": return vGroup();
    case "log": return vLog();
    case "more": return vMore();
    case "library": return vLibrary();
    case "tools5": return vTools5();
    case "guide": return vGuide();
    case "help": return vStop();
    case "settings": return vSettings();
    case "map": return vMap();
    case "sources": return vSources();
    default: return vHome();
  }
}
function chrome(){
  const r=route(); const tab=currentTab(r); const intro=!S.onboarded||r[0]==="intro";
  let tb=$(".tabbar"), fab=$(".fab");
  if(intro){ tb&&tb.remove(); fab&&fab.remove(); return; }
  if(!tb){ tb=document.createElement("nav"); tb.className="tabbar"; tb.setAttribute("aria-label","주요 메뉴"); document.body.appendChild(tb); }
  tb.innerHTML=`<div class="in">${[["home","오늘","#/"],["week","한 주","#/week/1"],["log","기록","#/log"],["more","더보기","#/more"]].map(([k,t,h])=>`<button type="button" data-go="${h}" ${tab===k?'aria-current="page"':""}>${IC[k]}${t}</button>`).join("")}</div>`;
  if(!fab){ fab=document.createElement("button"); fab.type="button"; fab.className="fab"; fab.dataset.act="log"; fab.innerHTML=`${IC.pen}말과 목소리`; document.body.appendChild(fab); }
}
let lastRoute="";
function render(keepScroll){
  const y=window.scrollY; const r=location.hash;
  $("#app").innerHTML=view(); chrome();
  if(keepScroll && r===lastRoute) window.scrollTo(0,y); else window.scrollTo(0,0);
  lastRoute=r;
  if(route()[0]==="day" && +route()[2]===4 && F(4,"step",1)===6) renderCard();
  const h1=$(".topbar h1"); document.title = (h1?h1.textContent+" — ":"") + SERIES.title;
}
async function renderCard(){
  const box=$("#cardbox"); const vid=F(4,"verse",null); if(!box||!vid) return;
  const c=await makeCard(vid);
  if(!c){ box.innerHTML=`<div class="panel soft">${verseHTML(vid,{name:S.name})}<p class="small">이 기기에서는 카드 그림을 만들 수 없습니다. 이 화면을 캡처해 배경화면으로 쓰셔도 됩니다.</p></div>`; return; }
  const url=c.toDataURL("image/png");
  box.innerHTML=`<img class="card-preview" src="${url}" alt="말씀 카드: ${esc(VERSES[vid].t)}">`;
  box.dataset.ready="1"; box._canvas=c;
}

/* ---------- 이벤트 ---------- */
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.f){ const [n,k]=t.dataset.f.split("|"); setF(+n,k,t.value); if(n==="2"&&k==="own"){ clearTimeout(t._rt); t._rt=setTimeout(()=>{},0);} }
  if(t.dataset.r){ const [n,k]=t.dataset.r.split("|"); setF(+n,k,+t.value); const o=t.parentElement.querySelector("output"); if(o) o.textContent=t.value; t.setAttribute("aria-valuetext",t.value); }
  if(t.hasAttribute("data-name")){ S.name=t.value.trim(); save(); }
  if(t.dataset.g){ S.w1.group[t.dataset.g]=t.value; save(); }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.dataset.f && t.dataset.f==="2|own") render(true);
  if(t.hasAttribute("data-name") && route()[0]==="day") render(true);
  if(t.dataset.r){ const [n,k]=t.dataset.r.split("|"); if((n==="6"&&k==="belief6")||(n==="6"&&k.startsWith("t_"))) render(true); }
  if(t.id==="imp" && t.files && t.files[0]){
    const fr=new FileReader(); fr.onload=()=>{ try{ const data=JSON.parse(fr.result); if(!data||data.v!==1) throw 0; if(confirm("지금 이 기기의 기록을 불러온 기록으로 바꿀까요?")){ S=Object.assign(DEF(),data); save(); applySettings(); render(); toast("불러왔습니다"); } }catch(err){ toast("이 앱에서 내보낸 기록 파일이 아닙니다"); } };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-go],[data-act],[data-chip],[data-seg],[data-done],[data-set],[data-jump],[data-wiz],[data-wiz-set],[data-read],[data-fill]");
  if(!el) return;
  const ds=el.dataset;
  if(ds.go){ if(ds.go==="#/finish-intro"){ S.onboarded=true; save(); location.hash="#/"; return; } if(location.hash===ds.go) render(); else location.hash=ds.go; return; }
  if(ds.jump){ const t=document.getElementById(ds.jump); if(t) t.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"start"}); return; }
  if(ds.chip){ const [n,k,multi]=ds.chip.split("|"); const val=ds.val;
    if(multi==="1"){ const cur=[...F(+n,k,[])]; const i=cur.indexOf(val); if(i>=0) cur.splice(i,1); else cur.push(val); setF(+n,k,cur); }
    else { setF(+n,k, F(+n,k,null)===val? null : val); }
    render(true); return; }
  if(ds.fill){ const [n,k]=ds.fill.split("|"); setF(+n,k,ds.val); render(true); return; }
  if(ds.seg){ const [n,k]=ds.seg.split("|"); let v=+ds.val; if(k==="skipOrigins") v=!!v; setF(+n,k,v); render(true); return; }
  if(ds.done){ const [n,L]=ds.done.split("|"); const d=D(+n); d.done[L]=!d.done[L]; save(); render(true);
    if(d.done[L]){ const next=document.getElementById("L"+(+L+1)); if(next) setTimeout(()=>next.scrollIntoView({behavior:"smooth",block:"start"}),60); }
    return; }
  if(ds.set){ const [k,v]=ds.set.split("|"); if(k==="chime") S.settings.chime = v==="1"; else S.settings[k]=v; save(); applySettings(); render(true); return; }
  if(ds.wiz){ const s=F(4,"step",1); setF(4,"step", Math.max(1,Math.min(7, s+(ds.wiz==="next"?1:-1)))); render(true); const L3=document.getElementById("L3"); L3&&L3.scrollIntoView({block:"start"}); return; }
  if(ds.wizSet){ setF(4, ds.wizSet, ds.val); if(ds.wizSet==="pair"){ setF(4,"ifthen",null); setF(4,"cat",null); } if(ds.wizSet==="verse") setF(4,"ifthen",null); render(true); return; }
  if(ds.read){ const k="read"+ds.read; setF(4,k,!F(4,k,false)); render(true); return; }
  const a=ds.act;
  if(a==="calm"){ openCalm(+ds.day||currentDay()); return; }
  if(a==="log"){ openLogSheet(); return; }
  if(a==="logEdit"){ openLogSheet(ds.id); return; }
  if(a==="partner"){ openPartnerView(ds.v); return; }
  if(a==="copy"){ copyText(ds.text); return; }
  if(a==="reveal"){ setF(6,"revealed",true); render(true); return; }
  if(a==="cardSave"){ const box=$("#cardbox"); if(!box||!box._canvas){ toast("카드를 만드는 중입니다"); return; }
    box._canvas.toBlob(async b=>{ const ok=await saveFile("기록되었으되_카드.png", b); if(!ok) toast("카드를 길게 눌러 저장해 주세요"); }, "image/png"); return; }
  if(a==="export"){ const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const d=new Date(); const ok=await saveFile(`깊은샘_내기록_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`, b); if(!ok){ copyText(JSON.stringify(S)); } return; }
  if(a==="reset"){ if(confirm("이 기기의 모든 기록을 지울까요? 되돌릴 수 없습니다.") && confirm("정말 지울까요?")){ S=DEF(); S.onboarded=true; save(); applySettings(); render(); toast("모두 지웠습니다"); } return; }
});
window.addEventListener("hashchange", ()=>render());
window.addEventListener("scroll", ()=>{ const tb=$(".topbar"); if(tb) tb.classList.toggle("scrolled", window.scrollY>4); }, {passive:true});

/* ---------- 시작 ---------- */
load(); applySettings(); render();

</script>
</body>
</html>
